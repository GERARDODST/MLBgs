name: Bundle de desarrollo (temporal)
# corrida: probar marcador con decisiones y la base de tickets (historial)
on:
  push:
    branches: ["claude/eloquent-ride-7quneh"]
    paths: ["mlbgs/fetch.py", ".github/workflows/dev-bundle.yml"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m mlbgs.fetch --out dev/raw_bundle.json.gz
      - run: |
          git config user.name "mlbgs-bot"
          git config user.email "mlbgs-bot@users.noreply.github.com"
          git add -f dev/raw_bundle.json.gz
          git commit -m "Bundle de desarrollo $(date -u +%H:%MZ)" || echo "sin cambios"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
