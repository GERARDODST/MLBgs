name: Investigación (temporal)
on:
  push:
    branches: ["claude/eloquent-ride-7quneh"]
    paths: ["scripts/research_urls.txt", "scripts/research_fetch.py", ".github/workflows/research-fetch.yml"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils > /dev/null 2>&1 || true
      - run: python3 scripts/research_fetch.py
