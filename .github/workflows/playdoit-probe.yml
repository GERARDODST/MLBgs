name: Playdoit sonda (temporal)
# corrida: 1
on:
  push:
    branches: ["claude/eloquent-ride-7quneh"]
    paths: ["scripts/playdoit_probe.py", ".github/workflows/playdoit-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/playdoit_probe.py
      - run: |
          git config user.name "mlbgs-bot"
          git config user.email "mlbgs-bot@users.noreply.github.com"
          git add -f dev/playdoit
          git commit -m "Playdoit: sonda $(date -u +%H:%MZ)" || echo "sin cambios"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
