name: Pro-Lab snapshot previo al partido
on:
  push:
    branches: ["claude/eloquent-ride-7quneh"]
    paths: ["scripts/prolab_snapshot.py", ".github/workflows/prolab-snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prolab_snapshot.py
      - run: |
          git config user.name "mlbgs-bot"
          git config user.email "mlbgs-bot@users.noreply.github.com"
          git add prolab
          git commit -m "Pro-Lab: snapshot previo al partido $(date -u +%H:%MZ)" || echo "sin cambios"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
