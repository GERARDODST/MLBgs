name: Pro-Lab snapshot previo al partido
on:
  push:
    branches: ["claude/eloquent-ride-7quneh"]
    paths: ["scripts/prolab_snapshot.py", "scripts/prolab_postgame.py", ".github/workflows/prolab-snapshot.yml", "prolab/request.env"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -a; [ -f prolab/request.env ] && . prolab/request.env; set +a
          # PROLAB_POST=<pk>: datos de después del partido (post-mortem); si no, el snapshot previo de PROLAB_PK
          if [ -n "${PROLAB_POST:-}" ]; then python scripts/prolab_postgame.py; else python scripts/prolab_snapshot.py; fi
      - run: |
          set -a; [ -f prolab/request.env ] && . prolab/request.env; set +a
          git config user.name "mlbgs-bot"
          git config user.email "mlbgs-bot@users.noreply.github.com"
          git add prolab
          git commit -m "Pro-Lab: ${PROLAB_POST:+post-mortem }snapshot $(date -u +%H:%MZ)" || echo "sin cambios"
          # la descarga del bundle también toca data/ (momios y cambios): aquí no se guarda, es de producción
          git stash -u -q || true
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
