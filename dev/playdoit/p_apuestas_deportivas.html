<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso bloqueado</title>
  <style>
    :root{
      --bg:#ffffff;
      --surface:#fafafa;
      --line:#e6e6e8;
      --text:#0d0d0f;
      --muted:#6b6b70;
      --accent:#e30613; /* rojo Playdoit — ajusta al hex exacto de tu marca */
      --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      width:100%;
      max-width:440px;
    }
    .brand{
      font-weight:800;
      letter-spacing:.14em;
      font-size:15px;
      text-transform:uppercase;
    }
    .brand span{color:var(--accent)}
    .rule{
      height:2px;
      width:36px;
      background:var(--accent);
      margin:22px 0 28px;
      border:0;
    }
    h1{
      font-size:26px;
      font-weight:700;
      margin:0 0 10px;
      letter-spacing:-.01em;
    }
    p.lead{
      margin:0 0 28px;
      color:var(--muted);
      font-size:15px;
    }
    .data{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
    }
    .row + .row{border-top:1px solid var(--line)}
    .label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
    }
    .value{
      font-family:var(--mono);
      font-size:14px;
      color:var(--text);
      word-break:break-all;
      text-align:right;
    }
    .copy{
      appearance:none;
      background:transparent;
      border:1px solid var(--line);
      color:var(--muted);
      font-family:var(--sans);
      font-size:12px;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      white-space:nowrap;
      transition:border-color .15s,color .15s;
    }
    .copy:hover,.copy:focus-visible{
      border-color:var(--accent);
      color:var(--text);
      outline:none;
    }
    footer{
      margin-top:24px;
      font-size:12px;
      color:var(--muted);
    }
    footer b{color:var(--accent);font-weight:700}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="card">

    <hr class="rule">

    <h1>Acceso bloqueado</h1>
    <p class="lead">Nuestro sistema de seguridad detuvo esta solicitud. Si crees que es un error, comparte el Ray ID con soporte para revisarlo.</p>

    <section class="data" aria-label="Detalles del bloqueo">
      <div class="row">
        <span class="label">Ray ID</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span class="value" id="ray">a414e330887cdda7</span>
          <button class="copy" type="button" data-copy="ray">Copiar</button>
        </span>
      </div>
      <div class="row">
        <span class="label">Tu IP</span>
        <span class="value">145.132.102.55</span>
      </div>
    </section>

  </main>

  <script>
    document.querySelectorAll('.copy').forEach(function(btn){
      btn.addEventListener('click',function(){
        var el=document.getElementById(btn.dataset.copy);
        var txt=el?el.textContent.trim():'';
        if(navigator.clipboard){navigator.clipboard.writeText(txt);}
        var old=btn.textContent;
        btn.textContent='Copiado';
        setTimeout(function(){btn.textContent=old;},1500);
      });
    });
  </script>
</body>
</html>
