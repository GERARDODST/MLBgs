</header>
<main class="wrap" id="app"></main>
<div id="tip" hidden></div>

<script id="mlbgs-data" type="application/json">__MLBGS_DATA__</script>
<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("mlbgs-data").textContent);
  const app = document.getElementById("app");
  const GAMES = D.games || [];
  const BY_PK = Object.fromEntries(GAMES.map((g) => [String(g.pk), g]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } },
  };

  // ---------------------------------------------------------------- formato
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isNum = (x) => typeof x === "number" && isFinite(x);
  const f = (x, d = 2) => (isNum(x) ? x.toFixed(d) : "—");
  const pc = (p, d = 0) => (isNum(p) ? (100 * p).toFixed(d) + "%" : "—");
  const pv = (x, d = 1) => (isNum(x) ? x.toFixed(d) + "%" : "—"); // ya viene en porcentaje
  const odds = (m) => (isNum(m) ? (m > 0 ? "+" : "") + Math.round(m) : "—");
  const signed = (x, d = 1) => (isNum(x) ? (x > 0 ? "+" : "") + x.toFixed(d) : "—");
  const hand = (h) => (h === "L" ? "Z" : h === "R" ? "D" : "—");
  const light = (l) => `<span class="light ${esc(l)}">${esc(l)}</span>`;
  const status = (s) => {
    const cls = { OK: "ok", disponible: "ok", derivado: "info", sustituido: "info", "no aplica": "", parcial: "warn", Alerta: "warn", faltante: "bad", Falla: "bad" }[s] ?? "";
    return `<span class="tag ${cls}">${esc(s)}</span>`;
  };
  const yes = (v) => `<span class="tag ${v === "Sí" ? "ok" : v === "No" ? "bad" : ""}">${esc(v)}</span>`;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" }); } catch { return iso; } };
  const fmtDateLong = (d) => { const dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }); };
  const fmtShort = (d) => { const dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("es-MX", { day: "numeric", month: "short" }); };
  const fmtStamp = (iso) => { try { return new Date(iso).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch { return iso; } };
  const dayLabel = (d) => {
    const t = D.meta.today;
    if (d === t) return "Hoy";
    const n = new Date(t + "T12:00:00"); n.setDate(n.getDate() + 1);
    if (d === n.toISOString().slice(0, 10)) return "Mañana";
    return fmtShort(d);
  };
  const table = (head, rows, opts = {}) => `<div class="tbl"><table${opts.cls ? ` class="${opts.cls}"` : ""}><thead><tr>${head.map((h) => `<th${h.startsWith("~") ? ' class="r"' : ""}>${esc(h.replace(/^~/, ""))}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${head.length}" class="muted">Sin datos</td></tr>`}</tbody></table></div>`;
  const tr = (cells, cls = "") => `<tr${cls ? ` class="${cls}"` : ""}>${cells.join("")}</tr>`;
  const td = (v, cls = "") => `<td${cls ? ` class="${cls}"` : ""}>${v}</td>`;
  const tdn = (v) => `<td class="r num">${v}</td>`;

  // ---------------------------------------------------------------- picks e índice de confianza
  const lvlCls = (l) => (l === "Muy baja" ? "Muy" : esc(l));
  const icBadge = (p) => `<span class="ic ${lvlCls(p.level)}" data-tip="Índice de confianza ${f(p.ic, 1)} de 100 · ${esc(p.level)}">IC ${Math.round(p.ic)} <small>${esc(p.level)}</small></span>`;
  const PART_NAMES = { fuerza: "Fuerza", consenso: "Consenso", datos: "Datos", estabilidad: "Estabilidad", contradicciones: "Sin contradicciones" };
  const PART_W = { fuerza: 0.35, consenso: 0.25, datos: 0.15, estabilidad: 0.15, contradicciones: 0.10 };
  const PART_TIP = {
    fuerza: "Ventaja de la probabilidad sobre el punto de equilibrio del precio (momio real o de referencia), a escala de 12 pp",
    consenso: "Acuerdo entre métodos independientes del framework: 1 − divergencia/12 pp (un solo método = 0.5)",
    datos: "Gate de completitud (9.3) del mercado y lineups confirmados",
    estabilidad: "Peso de la muestra tras la regresión a la media (5.7.4) y error del Monte Carlo",
    contradicciones: "1 − contradicciones activas/3 (secciones 5.6, 6.11, 7.7)",
  };
  const BOOKS = ["Draftea", "Playdoit", "Caliente", "Codere", "Strendus", "Betcris", "bet365", "Otra"];
  const oddsStore = (() => { try { return JSON.parse(store.get("mlbgs-odds") || "{}"); } catch { return {}; } })();
  const saveOdds = () => store.set("mlbgs-odds", JSON.stringify(oddsStore));
  const bookSel = () => store.get("mlbgs-book") || "Draftea";

  function parseOdds(raw) {
    const t = String(raw || "").trim().replace(",", ".");
    if (!t) return null;
    const v = Number(t);
    if (!isFinite(v) || v === 0) return null;
    if (t.includes(".") && v > 1 && v < 30) return { dec: v, imp: 1 / v, am: v >= 2 ? (v - 1) * 100 : -100 / (v - 1) };
    if (Math.abs(v) >= 100) return { am: v, imp: v < 0 ? -v / (-v + 100) : 100 / (v + 100), dec: v < 0 ? 1 + 100 / -v : 1 + v / 100 };
    return null;
  }

  function evalOdds(p, raw) {
    const o = parseOdds(raw);
    if (!o) return null;
    const edge = p.p - o.imp;
    const fuerza = Math.max(0, Math.min(1, edge / 0.12));
    const datos = p.datosWithOdds != null ? p.datosWithOdds : p.parts.datos;   // con momio, el gate de la sección 7 queda cubierto
    const ic = p.ic + 100 * PART_W.fuerza * (fuerza - p.parts.fuerza) + 100 * PART_W.datos * (datos - p.parts.datos);
    const blocked = p.blockedWithOdds != null ? p.blockedWithOdds : p.blocked;
    const b = o.dec - 1;
    const kelly = Math.max(0, (b * p.p - (1 - p.p)) / b);
    let light = "Gris", why = "precio justo (edge < 3 pp)";
    if (edge < 0) { light = "Rojo"; why = "sin valor: el momio paga menos que la probabilidad"; }
    else if (edge >= 0.03) {
      if (blocked) { light = "Amarillo"; why = "hay valor, pero falta un dato obligatorio (gate: lineup, umpire, clima o abridor)"; }
      else if (p.guion === "No" || p.contradiction === "Alta") { light = "Amarillo"; why = "hay valor, pero el guion o las contradicciones no acompañan"; }
      else if (ic >= 55) { light = "Verde"; why = "modelo + guion + cuota con edge + baja contradicción"; }
      else { light = "Amarillo"; why = "hay valor, pero la confianza es baja"; }
    }
    return { ...o, edge, ic, kelly, light, why, level: ic >= 70 ? "Alta" : ic >= 55 ? "Media" : ic >= 40 ? "Baja" : "Muy baja" };
  }

  function oddsResult(p, raw) {
    const r = evalOdds(p, raw);
    if (!r) return `<span class="muted val">Escribe el momio de ${esc(bookSel())} (−150, +130 o 1.91)</span>`;
    const cls = r.edge >= 0.03 ? "good" : r.edge < 0 ? "bad" : "fair";
    return `<span class="val ${cls}">${r.edge >= 0 ? "+" : ""}${(100 * r.edge).toFixed(1)} pp</span> · implícita ${pc(r.imp, 1)} · ${light(r.light)} · IC ${Math.round(r.ic)} · ¼ Kelly ${pc(r.kelly / 4, 2)}<br><span class="muted val">${esc(r.why)}</span>`;
  }

  const oddsInput = (pk, p) => {
    const key = `${pk}|${p.pick}`;
    return `<input class="odds-in" id="odds-${esc(String(pk))}-${esc(p.pick).replace(/[^a-zA-Z0-9]/g, "")}" data-odds="${esc(key)}" inputmode="decimal" placeholder="momio" value="${esc(oddsStore[key] || "")}" aria-label="Momio de ${esc(p.pick)}">`;
  };

  function pickCard(p, pk, rank, graded) {
    const partsHtml = Object.entries(p.parts).map(([k, v]) => `<span data-tip="${esc(PART_TIP[k])}">${PART_NAMES[k]} <span class="muted">×${PART_W[k]}</span></span><span class="bar"><i style="width:${(v * 100).toFixed(0)}%"></i></span><span class="num">${v.toFixed(2)}</span>`).join("");
    const res = graded ? `<span class="${graded.won ? "won" : graded.won === false ? "lost" : "muted"}">${graded.won ? "✓ Acertado" : graded.won === false ? "✗ Fallado" : "Push / sin dato"}</span>` : "";
    return `<article class="pickcard" data-pick="${esc(JSON.stringify({ pick: p.pick, p: p.p, ic: p.ic, parts: p.parts, guion: p.guion, contradiction: p.contradiction, blocked: p.blocked, blockedWithOdds: p.blockedWithOdds, datosWithOdds: p.datosWithOdds }))}">
      <div class="rank">Pick principal ${rank} · ${esc(p.market)} ${res}</div>
      <h3>${esc(p.pick)}</h3>
      <div class="meta"><span>Probabilidad <b class="num">${pc(p.p, 1)}</b></span><span>Momio justo <b class="num">${odds(p.fair)}</b></span><span>Mínimo aceptable <b class="num">${odds(p.minPrice)}</b></span>${icBadge(p)}</div>
      <div class="gauge" role="img" aria-label="Índice de confianza ${Math.round(p.ic)} de 100"><i style="left:${Math.max(0, Math.min(100, p.ic))}%"></i></div>
      <div class="gauge-l"><span>0</span><span>40 Baja</span><span>55 Media</span><span>70 Alta</span><span>100</span></div>
      <div class="note"><b>Cómo se llegó:</b> ${esc(p.how)}</div>
      <div class="methods">${Object.entries(p.methods).map(([k, v]) => `<span>${esc(k)} <b>${pc(v, 1)}</b></span>`).join("")}</div>
      <div class="parts">${partsHtml}</div>
      <div class="formula">IC = ${esc(p.formula)} → ${f(p.ic, 1)} · punto de equilibrio ${pc(p.breakeven, 1)} (${p.priceIsReal ? "momio real" : "precio de referencia " + odds(p.refPrice)})</div>
      <div class="oddsbar"><span>Tu momio en ${esc(bookSel())}:</span>${oddsInput(pk, p)}<span class="odds-out">${oddsResult(p, oddsStore[`${pk}|${p.pick}`])}</span></div>
    </article>`;
  }

  function picksTable(picks, pk, graded) {
    const g = Object.fromEntries((graded || []).map((x) => [x.pick, x]));
    return `<div class="oddsbar"><label for="book-${pk}">Casa de apuestas</label><select id="book-${pk}" data-book>${BOOKS.map((b) => `<option${b === bookSel() ? " selected" : ""}>${b}</option>`).join("")}</select><span class="muted">Escribe tu momio (americano −150 / +130 o decimal 1.91): se recalculan edge, índice de confianza, semáforo y Kelly. Se guarda solo en este navegador.</span></div>
      ${table(["#", "Mercado", "Pick", "~Prob.", "Confianza", "Fuerza · Consenso · Datos · Estab. · Contr.", "Métodos del framework", "~Justo", "Tu momio", "Valor con tu momio", ...(graded ? ["Resultado"] : [])],
      picks.map((p) => tr([tdn(p.rank), td(esc(p.market)), td(`<b>${esc(p.pick)}</b>`), tdn(pc(p.p, 1)), td(icBadge(p)),
        td(`<span class="num" style="font-size:12px">${Object.values(p.parts).map((v) => v.toFixed(2)).join(" · ")}</span>`),
        td(`<span class="muted" style="font-size:12px">${Object.entries(p.methods).map(([k, v]) => `${esc(k)} ${pc(v, 1)}`).join("<br>")}</span>`),
        tdn(odds(p.fair)), td(oddsInput(pk, p)), td(`<span class="odds-out">${oddsResult(p, oddsStore[`${pk}|${p.pick}`])}</span>`),
        ...(graded ? [td(g[p.pick] ? (g[p.pick].won ? '<span class="won">✓</span>' : g[p.pick].won === false ? '<span class="lost">✗</span>' : "push") : "—", "c")] : [])],
        "").replace("<tr", `<tr data-pick="${esc(JSON.stringify({ pick: p.pick, p: p.p, ic: p.ic, parts: p.parts, guion: p.guion, contradiction: p.contradiction, blocked: p.blocked, blockedWithOdds: p.blockedWithOdds, datosWithOdds: p.datosWithOdds }))}"`)))}
      <p class="note muted">IC = 100 · (0.35·Fuerza + 0.25·Consenso + 0.15·Datos + 0.15·Estabilidad + 0.10·Sin contradicciones). Niveles: ≥70 Alta · 55–69 Media · 40–54 Baja · &lt;40 Muy baja. Sin momio real la fuerza se mide contra un precio de referencia típico; en moneyline un favorito real cuesta más: escribe tu momio para medir el valor.</p>`;
  }

  document.addEventListener("input", (e) => {
    const inp = e.target.closest("[data-odds]");
    if (!inp) return;
    oddsStore[inp.dataset.odds] = inp.value;
    saveOdds();
    const host = inp.closest("[data-pick]");
    if (!host) return;
    const p = JSON.parse(host.dataset.pick);
    const out = host.querySelector(".odds-out");
    if (out) out.innerHTML = oddsResult(p, inp.value);
  });
  document.addEventListener("change", (e) => {
    const sel = e.target.closest("[data-book]");
    if (!sel) return;
    store.set("mlbgs-book", sel.value);
    route();
  });

  // ---------------------------------------------------------------- lineups, bullpen, importancia y noticias
  function lineupCard(team, lu, vsName) {
    if (!lu) return `<div class="card-lu"><header><b>${esc(team)}</b><span class="stamp-p">Sin datos</span></header><p class="note muted">No hay lineup publicado ni juegos recientes para proyectarlo.</p></div>`;
    const conf = lu.status === "Confirmado";
    return `<div class="card-lu"><header><b>${esc(team)}</b>${conf ? '<span class="stamp-c">✓ Confirmado</span>' : `<span class="stamp-p">Proyectado · ${pc(lu.confidence)}</span>`}</header>
      <p class="note muted">${conf ? "Lineup oficial publicado por el club." : `Predicción con sus últimos ${lu.games} juegos (${lu.sameGames} contra abridor de la misma mano, doble peso; recientes pesan más). El % es la frecuencia ponderada con que ese jugador abrió.`}${vsName && vsName !== "Por anunciar" ? ` Contra ${esc(vsName)}.` : " Abridor rival por anunciar: sin filtro de mano."}</p>
      ${lu.rows.map((r, i) => `<div class="lu-row ${conf ? "conf" : "proj"}"><span class="slot">${i + 1}</span><span class="pos">${esc(r.pos || "—")}</span><span class="nm">${esc(r.name)}</span><span class="pos">${esc(r.bats || "")}</span><span class="st">${r.ops != null ? "OPS " + f(r.ops, 3) : ""}${r.k != null ? " · K% " + pv(r.k) : ""}${!conf && r.prob != null ? ` <span class="pr">${pc(r.prob)}</span>` : ""}</span></div>`).join("")}
      <p class="formula">OBP ${f(lu.obp, 3)} · SLG ${f(lu.slg, 3)} · K% ${pv(lu.k)} · Barrel% ${f(lu.barrel, 1)} · factor vs ofensiva habitual ${f(lu.ratio, 3)}</p></div>`;
  }

  function bullpenTable(team, rows, hasOfficial) {
    const chip = (a) => `<span class="tag ${a === "Disponible" ? "ok" : a === "Dudoso" ? "warn" : a === "No disponible" ? "bad" : ""}">${esc(a)}</span>`;
    return `<h3 class="sub">${esc(team)} <span class="code">${rows.length} brazos · ${hasOfficial ? "lista oficial del partido + predicción de uso" : "roster activo + predicción de uso"}</span></h3>
      ${table(["Pitcher", "Mano", "Rol", "Estado", "~P(uso)", "~ERA", "~FIP", "~K%", "~BB%", "~SV/HLD", "Último uso", "~Pitcheos 3d"], rows.map((r) => tr([
        td(`<span class="${r.official === false ? "pen-pred" : "pen-off"}">${esc(r.name)}</span>${r.official ? ' <span class="tag ok" data-tip="Aparece en la lista oficial de bullpen del partido">oficial</span>' : ""}`),
        td(hand(r.throws)), td(esc(r.role)), td(chip(r.available)), tdn(pc(r.pUse)), tdn(f(r.era)), tdn(f(r.fip)), tdn(pc(r.k, 1)), tdn(pc(r.bb, 1)),
        tdn(`${r.sv}/${r.hld}`), td(r.lastDate ? fmtShort(r.lastDate) + (r.lastPitches != null ? ` (${r.lastPitches})` : "") : "—", "num"), tdn(r.p3)], "pen-row")))}`;
  }

  function importanceBlock(imp) {
    if (!imp) return "";
    return `<div class="panel"><h3 class="sub">¿Qué se juegan en la tabla? <span class="code">Importancia ${esc(imp.level)}</span></h3>
      ${table(["Equipo", "Récord", "División", "~JD", "~Comodín (rank · JD)", "Estado", "~P(playoffs)", "~P(división)", "~P(bye)", "~Δ playoffs si gana vs pierde"], imp.rows.map((r) => tr([
        td(`<b>${esc(r.team)}</b>`), tdn(`${r.w}-${r.l}`), td(esc((r.division || "").replace("American League", "AL").replace("National League", "NL")), "muted"), tdn(esc(r.gb)), tdn(`${esc(r.wcRank || "—")} · ${esc(r.wcgb || "—")}`),
        td(`<span class="tag ${r.status === "Clasificado" ? "ok" : r.status === "Eliminado" ? "bad" : "info"}">${esc(r.status)}</span>`),
        tdn(pc(r.pPlayoffs, 1)), tdn(pc(r.pDivision, 1)), tdn(pc(r.pBye, 1)), tdn(r.leverage ? signed(100 * r.leverage.po.delta, 1) + " pp" : "—")])))}
      ${imp.notes.length ? `<ul class="clean">${imp.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <p class="formula">${esc(imp.method)}</p></div>`;
  }

  function newsBlock(news) {
    if (!news) return "";
    const one = (n) => `<div class="panel"><h3 class="sub">Noticias ${esc(n.team)} <span class="code">movimientos oficiales, 21 días</span></h3>
      ${n.items.length ? `<ul class="clean">${n.items.slice(0, 8).map((x) => `<li><span class="num muted">${fmtShort(x.date)}</span> <span class="tag ${x.impact === "Alta" ? "warn" : ""}">${esc(x.type)}</span> ${esc(x.text)}</li>`).join("")}</ul>` : '<p class="note muted">Sin movimientos recientes.</p>'}
      ${n.injured && n.injured.length ? `<p class="note"><b>Lista de lesionados:</b> ${n.injured.slice(0, 12).map((x) => `${esc(x.name)} (${esc(x.pos)}, ${esc(x.status)})`).join(" · ")}</p>` : ""}</div>`;
    return `<div class="two">${one(news.away)}${one(news.home)}</div>`;
  }

  document.getElementById("stamp").textContent = `Datos: ${fmtStamp(D.meta.generatedAt)} · ${tz}`;

  // ---------------------------------------------------------------- tooltip
  const tip = document.getElementById("tip");
  document.addEventListener("mouseover", (e) => {
    const t = e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute("data-tip");
    tip.hidden = false;
  });
  document.addEventListener("mousemove", (e) => {
    if (tip.hidden) return;
    const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px";
    tip.style.top = e.clientY + 14 + "px";
  });

  // ---------------------------------------------------------------- vista: partidos
  function gameCard(g) {
    const s = g.summary, a = g.teams.away, h = g.teams.home;
    const pa = s.pAway, ph = s.pHome;
    const sp = (x) => x.missing ? `<span class="sp tbd">Abridor por anunciar</span>`
      : `<span class="sp">${esc(x.name)} <span class="muted">(${hand(x.hand)}) ERA ${f(x.era)} · FIP ${f(x.fip)}</span></span>`;
    const b = s.best;
    const bestTxt = b ? `${esc(b.market)}: <b>${esc(b.pick)}</b> ${pc(b.p)}${isNum(b.price) ? ` · ${odds(b.price)}` : isNum(b.fair) ? ` · justo ${odds(b.fair)}` : ""}` : "Sin mercado";
    const edge = s.starterEdge;
    const edgeTxt = !edge.side ? "sin dato" : edge.level === "equilibrado" ? "parejos" : `${esc(g.teams[edge.side].abbr)} ${esc(edge.level)}`;
    return `<a class="game" href="#g${g.pk}">
      <div class="top"><span>${fmtTime(g.time)} · ${esc(g.venue.name)}${g.dh && g.dh !== "N" ? ` · juego ${g.gameNumber}` : ""}</span>${light(s.light)}</div>
      <div class="line"><span class="abbr"><i class="away-mark"></i>${esc(a.abbr)}</span><span class="who"><span class="rec">${esc(a.name)} · ${a.w}-${a.l}</span>${sp(s.probables.away)}</span><span class="prob ${pa >= 0.5 ? "fav" : "dog"}">${pc(pa)}</span></div>
      <div class="line"><span class="abbr"><i class="home-mark"></i>${esc(h.abbr)}</span><span class="who"><span class="rec">${esc(h.name)} · ${h.w}-${h.l}</span>${sp(s.probables.home)}</span><span class="prob ${ph > 0.5 ? "fav" : "dog"}">${pc(ph)}</span></div>
      <div class="splitbar" role="img" aria-label="Probabilidad de victoria: ${esc(a.abbr)} ${pc(pa)}, ${esc(h.abbr)} ${pc(ph)}"><span style="width:${(pa * 100).toFixed(1)}%"></span><span style="width:${(ph * 100).toFixed(1)}%"></span></div>
      <div class="facts">
        <div class="fact"><b>${f(s.proj.away, 1)}–${f(s.proj.home, 1)}</b><span>Marcador</span></div>
        <div class="fact"><b>${f(s.proj.total, 1)}</b><span>Total</span></div>
        <div class="fact"><b>${f(s.proj.f5.away, 1)}–${f(s.proj.f5.home, 1)}</b><span>F5</span></div>
        <div class="fact"><b>${pc(s.nrfi)}</b><span>NRFI</span></div>
      </div>
      <div class="bestline"><span>Abridor: <b>${edgeTxt}</b> · triangulación ${esc(s.confidence)}</span><span class="muted">${s.gate.missing} dato${s.gate.missing === 1 ? "" : "s"} faltante${s.gate.missing === 1 ? "" : "s"}</span></div>
      <div class="picks2">${(s.topPicks || []).map((p) => `<div class="p2">${icBadge(p)}<span class="t"><b>${esc(p.pick)}</b> <span class="muted">${esc(p.market)} · ${pc(p.p)} · justo ${odds(p.fair)}</span></span></div>`).join("") || `<span class="muted">${bestTxt}</span>`}</div>
    </a>`;
  }

  function viewGames() {
    const dates = [...new Set(GAMES.map((g) => g.date))].sort();
    let sel = store.get("mlbgs-day");
    if (sel !== "todos" && !dates.includes(sel)) sel = dates[0] || "todos";
    let lightSel = store.get("mlbgs-light") || "todos";
    const render = () => {
      const games = GAMES.filter((g) => (sel === "todos" || g.date === sel) && (lightSel === "todos" || g.summary.light === lightSel));
      const days = [...new Set(games.map((g) => g.date))].sort();
      const noOdds = !D.meta.hasOdds;
      app.innerHTML = `
        <div class="page-head">
          <p class="eyebrow">Framework MLB Picks v2 · datos oficiales de MLB</p>
          <h1>Próximos partidos de la MLB, analizados antes del primer lanzamiento</h1>
          <p class="lede">Cada juego pasa por las 10 secciones del framework: contexto, historial, abridores con regresión a la media, bullpen y fatiga, modelo de carreras (Poisson / Binomial Negativa), Over/Under, valor contra el mercado y auditoría de contradicciones. El semáforo nunca es Verde si falta un dato obligatorio.</p>
        </div>
        ${noOdds ? `<div class="notice"><span class="ic">!</span><div><b>Sin momios conectados.</b> Sin cuotas no hay edge calculable, así que el framework marca los mercados en Gris («esperar cuota») o Rojo. Cada pick trae su <b>momio justo</b> y el <b>mínimo aceptable</b> para compararlo con tu casa de apuestas. Para activar el valor automático agrega el secreto <code>ODDS_API_KEY</code> (The Odds API) al repositorio.</div></div>` : ""}
        <div class="toolbar">
          <div class="chips" role="group" aria-label="Día">${dates.map((d) => `<button class="chip" data-day="${d}" aria-pressed="${sel === d}">${dayLabel(d)} · ${GAMES.filter((g) => g.date === d).length}</button>`).join("")}<button class="chip" data-day="todos" aria-pressed="${sel === "todos"}">Todos</button></div>
          <div class="chips" role="group" aria-label="Semáforo">${["todos", "Verde", "Amarillo", "Gris", "Rojo"].map((l) => `<button class="chip" data-light="${l}" aria-pressed="${lightSel === l}">${l === "todos" ? "Todo semáforo" : l}</button>`).join("")}</div>
        </div>
        ${days.length ? days.map((d) => `<section class="day"><h2>${dayLabel(d)} <small>${fmtDateLong(d)} · ${games.filter((g) => g.date === d).length} partidos</small></h2>
          <div class="grid">${games.filter((g) => g.date === d).map(gameCard).join("")}</div></section>`).join("")
          : `<div class="empty">No hay partidos con ese filtro.</div>`}
        ${footer()}`;
      app.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => { sel = b.dataset.day; store.set("mlbgs-day", sel); render(); }));
      app.querySelectorAll("[data-light]").forEach((b) => b.addEventListener("click", () => { lightSel = b.dataset.light; store.set("mlbgs-light", lightSel); render(); }));
    };
    render();
  }

  function footer() {
    const m = D.meta;
    return `<p class="foot">Fuentes: MLB Stats API (statsapi.mlb.com) y Baseball Savant (baseballsavant.mlb.com)${m.hasOdds ? " · The Odds API" : ""}. Datos generados ${fmtStamp(m.generatedAt)}: ${m.counts.results} resultados de la temporada ${m.season}, ${m.counts.boxscores} box scores recientes, ${m.counts.pitchers} abridores probables. Herramienta de análisis estadístico: no garantiza resultados y apostar implica riesgo financiero real.</p>`;
  }

  // ---------------------------------------------------------------- gráficas
  function distChart(pmf, lines, proj) {
    const W = 560, H = 190, L = 34, R = 10, T = 14, B = 30;
    const n = pmf.length, max = Math.max(...pmf) * 1.12;
    const bw = (W - L - R) / n;
    const y = (v) => T + (H - T - B) * (1 - v / max);
    const x = (k) => L + k * bw;
    const ticks = [0, 0.05, 0.1, 0.15].filter((t) => t <= max);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución de carreras totales">`;
    ticks.forEach((t) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`; });
    pmf.forEach((p, k) => {
      const h = Math.max(0, y(0) - y(p));
      s += `<rect x="${x(k) + 1}" y="${y(p)}" width="${bw - 2}" height="${h}" rx="2" fill="${k > 8.5 ? "var(--home)" : "var(--away)"}" opacity="0.85" data-tip="${k} carreras: ${(p * 100).toFixed(1)}%"/>`;
      if (k % 2 === 0) s += `<text x="${x(k) + bw / 2}" y="${H - 12}" text-anchor="middle">${k}</text>`;
    });
    lines.forEach((ln) => { const lx = L + (ln + 0.5) * bw; s += `<line x1="${lx}" x2="${lx}" y1="${T}" y2="${y(0)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text class="lbl" x="${lx}" y="${T - 3}" text-anchor="middle">${ln}</text>`; });
    const px = L + (proj + 0.5) * bw;
    s += `<line x1="${px}" x2="${px}" y1="${T}" y2="${y(0)}" stroke="var(--accent)" stroke-width="2"/>`;
    s += `<text x="${L}" y="${H - 1}">carreras totales</text></svg>`;
    return s;
  }

  function linescore(g) {
    const d = g.sections.s6.development;
    const max = Math.max(...d.perInning.away, ...d.perInning.home, 0.01);
    const cell = (v) => `<td class="num" style="background: rgba(var(--heat), ${(0.08 + 0.5 * v / max).toFixed(3)})" data-tip="${f(v, 2)} carreras esperadas">${f(v, 2)}</td>`;
    const row = (side) => `<tr><td class="team-cell"><span class="abbr" style="font-size:18px"><i class="${side}-mark" style="height:14px"></i>${esc(g.teams[side].abbr)}</span></td>${d.perInning[side].map(cell).join("")}<td class="num tot">${f(d.final[side], 1)}</td><td class="num">${f(d.f5[side], 1)}</td><td class="num">${f(d.f3[side], 1)}</td></tr>`;
    return `<div class="tbl"><table class="linescore"><thead><tr><th>Equipo</th>${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => `<th>${i}</th>`).join("")}<th>R</th><th>F5</th><th>F3</th></tr></thead><tbody>${row("away")}${row("home")}</tbody></table></div>`;
  }

  function methodBars(g) {
    const t = g.sections.s5.triangulation, h = g.teams.home.abbr;
    const row = (label, p) => `<div class="mbar"><span>${label}</span><span class="track" data-tip="${label}: ${esc(h)} ${pc(p, 1)}"><i style="width:${(p * 100).toFixed(1)}%"></i></span><span class="num">${pc(p, 1)}</span></div>`;
    return row("Log5", t.log5.pHome) + row("Elo", t.elo.pHome) + row("λ NB", t.lambda.pHome);
  }

  // ---------------------------------------------------------------- vista: partido
  function viewGame(g, backHref = "#partidos", backText = "← Todos los partidos") {
    const s = g.summary, S = g.sections, a = g.teams.away, h = g.teams.home;
    const w = g.weather;
    const weather = w.closed ? "Techo cerrado / domo" : w.available ? `${esc(w.condition || "")} · ${w.temp ?? "—"}°F · viento ${esc(w.windText || "—")}` : "Clima: sin reporte todavía";
    const fav = s.pHome >= 0.5 ? "home" : "away";
    const openAll = store.get("mlbgs-open") === "1";
    app.innerHTML = `
      <a class="back" href="${backHref}">${esc(backText)}</a>
      <div class="board">
        <div class="team away"><span class="eyebrow">Visitante</span><span class="big">${esc(a.abbr)}</span><span class="nm">${esc(a.name)}</span><span class="sub">${a.w}-${a.l} · ${esc(a.division || "")}${a.streak ? " · racha " + esc(a.streak) : ""} · Elo ${a.elo ?? "—"}</span></div>
        <div class="mid"><span class="at">@</span><b>${fmtDateLong(g.date)} · ${fmtTime(g.time)}</b><span>${esc(g.venue.name)}${g.venue.city ? ", " + esc(g.venue.city) : ""}${g.venue.neutral ? " · sede neutra" : ""}</span><span class="muted">${weather}</span><span class="muted">Umpire: ${esc(g.umpire || "no asignado aún")}${g.series && g.series.gameNumber ? ` · juego ${g.series.gameNumber} de ${g.series.totalGames}${g.series.result ? ` (${esc(g.series.result)})` : ""}` : ""}</span></div>
        <div class="team home"><span class="eyebrow">Local</span><span class="big">${esc(h.abbr)}</span><span class="nm">${esc(h.name)}</span><span class="sub">${h.w}-${h.l} · ${esc(h.division || "")}${h.streak ? " · racha " + esc(h.streak) : ""} · Elo ${h.elo ?? "—"}</span></div>
      </div>

      <section class="block"><h2>Picks principales</h2>
        <div class="toppicks">${(g.picks || []).slice(0, 2).map((p, i) => pickCard(p, g.pk, i + 1)).join("")}</div>
      </section>

      ${importanceBlock(S.s1.importance)}
      ${newsBlock(S.s1.news)}

      <section class="block"><h2>Alineaciones</h2>
        <div class="lineups">${lineupCard(a.abbr, S.s5.lineups.away, s.probables.home.name)}${lineupCard(h.abbr, S.s5.lineups.home, s.probables.away.name)}</div>
      </section>

      <div class="tiles">
        <div class="tile"><span class="eyebrow">Probabilidad triangulada</span>
          <span class="big">${esc(g.teams[fav].abbr)} ${pc(fav === "home" ? s.pHome : s.pAway)}</span>
          <div class="splitbar"><span style="width:${(s.pAway * 100).toFixed(1)}%"></span><span style="width:${(s.pHome * 100).toFixed(1)}%"></span></div>
          ${methodBars(g)}
          <span class="sub">P(${esc(h.abbr)}) por método · confianza <b>${esc(s.confidence)}</b> (divergencia ${pc(s.spread, 1)})</span></div>
        <div class="tile"><span class="eyebrow">Marcador proyectado</span>
          <span class="big">${esc(a.abbr)} ${f(s.proj.away, 1)} – ${f(s.proj.home, 1)} ${esc(h.abbr)}</span>
          <dl class="kv"><dt>Total esperado</dt><dd class="num">${f(s.proj.total, 2)}</dd><dt>F5</dt><dd class="num">${f(s.proj.f5.away, 2)} – ${f(s.proj.f5.home, 2)}</dd><dt>F3</dt><dd class="num">${f(s.proj.f3.away, 2)} – ${f(s.proj.f3.home, 2)}</dd><dt>NRFI / YRFI</dt><dd class="num">${pc(s.nrfi)} / ${pc(1 - s.nrfi)}</dd></dl></div>
        <div class="tile"><span class="eyebrow">Mejor mercado (8.4)</span>
          ${s.best ? `<span class="big" style="font-size:26px">${esc(s.best.pick)}</span><span>${esc(s.best.market)} · ${pc(s.best.p, 1)} ${light(s.best.light)}</span>
          <span class="sub">${isNum(s.best.price) ? `Momio ${odds(s.best.price)} · edge ${signed(100 * s.best.edge, 1)} pp` : `Momio justo ${odds(s.best.fair)} · mínimo aceptable ${odds(s.best.minPrice)}`} · ${esc(s.best.decision)}</span>` : "<span class='sub'>Sin mercado</span>"}
          <span class="sub">Gate: ${s.gate.ok}/${s.gate.total} campos · ${s.gate.missing} faltante${s.gate.missing === 1 ? "" : "s"}</span></div>
      </div>

      <section class="block"><h2>Carreras esperadas por entrada</h2>
        ${linescore(g)}
        <p class="note">λ por media entrada = carreras promedio de la liga en esa entrada × ofensiva × (fracción del abridor × abridor + fracción del bullpen × bullpen) × parque. Más intenso = más carreras esperadas.</p>
      </section>

      <section class="block"><h2>Decisión corregida por mercado</h2>
        ${decisionTable(S.s8)}
        <p class="rule">${esc(S.s8.rule)}</p>
      </section>

      <div class="toolbar"><button class="btn" id="toggle-all">${openAll ? "Contraer" : "Expandir"} las 10 secciones</button><span class="muted" style="font-size:13px">Numeración = secciones del Framework MLB Picks v2</span></div>
      ${sec(1, "Liga, división y contexto competitivo", S.s1.divisional ? "Divisional" : S.s1.sameLeague ? "Misma liga" : "Interliga", sec1(g), openAll)}
      ${sec(2, "Localía, visita, récords recientes e historial directo", `${S.s2.h2hCount} H2H`, sec2(g), openAll)}
      ${sec(3, "Pitchers abridores: comparación completa", S.s3.advantage.text, sec3(g), openAll)}
      ${sec(4, "Bullpen: relevistas, fatiga, roles y matchup", S.s4.advantage.team ? "Ventaja " + S.s4.advantage.team : "Parejos", sec4(g), openAll)}
      ${sec(5, "Patrones, probabilidades y modelo matemático", `P(${h.abbr}) ${pc(s.pHome, 1)}`, sec5(g), openAll)}
      ${sec(6, "Análisis Over/Under y desarrollo por entradas", `Total ${f(s.proj.total, 2)}`, sec6(g), openAll)}
      ${sec(7, "Cuotas, probabilidad implícita y valor", S.s7.hasOdds ? `${S.s7.nBooks} casas` : "Sin momios", sec7(g), openAll)}
      ${sec(8, "Auditoría final de contradicciones", `${S.s8.audit.filter((x) => x.status === "Alerta").length} alertas`, sec8(g), openAll)}
      ${sec(9, "Fuentes de datos y regla de completitud", `${s.gate.missing} faltantes`, sec9(g), openAll)}
      ${sec(10, "Algoritmo maestro", "Fases 0–6", sec10(g), openAll)}

      <section class="block"><h2>Todos los picks por nivel de confianza</h2>${picksTable(g.picks || [], g.pk)}</section>
      ${footer()}`;
    document.getElementById("toggle-all").addEventListener("click", () => {
      const open = store.get("mlbgs-open") !== "1";
      store.set("mlbgs-open", open ? "1" : "0");
      app.querySelectorAll("details.sec").forEach((d) => { d.open = open; });
      document.getElementById("toggle-all").textContent = `${open ? "Contraer" : "Expandir"} las 10 secciones`;
    });
    window.scrollTo(0, 0);
  }

  const sec = (n, title, sum, body, open) => `<details class="sec" id="s${n}"${open ? " open" : ""}><summary><span class="n">${n}</span><span class="t">${esc(title)}</span><span class="s">${esc(sum || "")}</span></summary><div class="body">${body}</div></details>`;

  function decisionTable(s8) {
    return table(["Mercado", "Pick", "~Prob.", "~Momio", "~Justo", "~Mínimo", "~Edge", "Modelo", "Guion", "Cuota", "Contradicción", "Semáforo", "Decisión"],
      s8.decisions.map((d) => tr([td(`<b>${esc(d.market)}</b>`), td(esc(d.pick)), tdn(pc(d.p, 1)), tdn(odds(d.price)), tdn(odds(d.fair)), tdn(odds(d.minPrice)),
        tdn(isNum(d.edge) ? signed(100 * d.edge, 1) + " pp" : "—"), td(yes(d.modelo)), td(`<span data-tip="${esc(d.guionWhy || "")}">${yes(d.guion)}</span>`), td(yes(d.cuota)),
        td(`<span data-tip="${esc((d.contraList || []).join(" · ") || "Sin contradicciones")}">${esc(d.contradiction)}</span>`), td(light(d.light)),
        td(`${esc(d.decision)}${d.blocked ? ' <span class="tag warn" data-tip="Gate de completitud: falta un dato obligatorio">gate</span>' : ""}${d.stake ? `<br><span class="muted">¼ Kelly ${pc(d.stake.quarter, 2)}</span>` : ""}`)])));
  }

  // ------------------------------------------------ sección 1
  function sec1(g) {
    const s = g.sections.s1;
    return `${table(["Pregunta", "Respuesta", "Detalle"], s.rows.map((r) => tr([td(esc(r.q)), td(`<b>${esc(r.a)}</b>`), td(esc(r.d), "muted")])))}
      <p class="rule">Partido divisional no significa automáticamente Over</p>
      <div><h3 class="sub">Interpretación corregida</h3><p class="note">${esc(s.interpretation)}</p></div>`;
  }

  // ------------------------------------------------ sección 2
  function gamesTable(rows, opts = {}) {
    return table(["Fecha", "Visitante", "Local", "Estadio", "~Marcador", "Ganador", "~Total", "~F5", ...(opts.venue ? ["Estadio actual"] : [])],
      rows.map((r) => tr([td(fmtShort(r.date), "num"), td(esc(r.away)), td(esc(r.home)), td(esc(r.venue), "muted"),
        tdn(`${r.score}${r.innings > 9 ? ` (${r.innings})` : ""}`), td(`<b>${esc(r.winner)}</b>`, r.won === true ? "w" : r.won === false ? "l" : ""),
        tdn(r.total), tdn(`${r.f5[0]}-${r.f5[1]}`), ...(opts.venue ? [td(r.sameVenue ? "✓" : "×", "c")] : [])])));
  }
  function sec2(g) {
    const s = g.sections.s2;
    return `<h3 class="sub"><span class="code">2.1</span> Récord general y splits de localía/visita</h3>
      ${table(["Equipo", "Rol", "Récord", "Casa", "Visita", "Últimos 10", "Racha", "Comentario"], s.records.map((r) => tr([td(`<b>${esc(r.team)}</b>`), td(r.role), tdn(r.overall), tdn(r.home), tdn(r.away), tdn(r.last10), td(esc(r.streak || "—")), td(esc(r.comment), "muted")])))}
      <h3 class="sub"><span class="code">2.2</span> Últimos 10 del local como local (${esc(g.teams.home.abbr)})</h3>${gamesTable(s.homeL10)}
      <h3 class="sub"><span class="code">2.3</span> Últimos 10 del visitante como visitante (${esc(g.teams.away.abbr)})</h3>${gamesTable(s.awayL10)}
      <h3 class="sub"><span class="code">2.4</span> Últimos 10 enfrentamientos directos</h3>${gamesTable(s.h2h, { venue: true })}
      <p class="note muted">Columna «Figura» del framework: la API de calendario no publica el jugador del partido; en su lugar se muestra el marcador de F5.</p>
      <h3 class="sub"><span class="code">2.5</span> Resumen estadístico de tendencias</h3>
      <dl class="kv">${s.summary.map((r) => `<dt>${esc(r.k)}</dt><dd class="num">${esc(r.v ?? "—")}</dd>`).join("")}</dl>
      <p class="rule">El historial directo es apoyo, no argumento suficiente para pick final.</p>
      <p class="note">${esc(s.warning)}</p>`;
  }

  // ------------------------------------------------ sección 3
  function logTable(rows) {
    return table(["Fecha", "Condición", "Rival", "~IP", "~H", "~ER", "~BB", "~K", "~HR", "~BF", "~Pitcheos"],
      rows.map((r) => tr([td(fmtShort(r.date), "num"), td(r.home ? "Local" : "Visita"), td(esc(r.oppAbbr)), tdn(r.ip), tdn(r.h), tdn(r.er), tdn(r.bb), tdn(r.k), tdn(r.hr), tdn(r.bf), tdn(r.pitches ?? "—")])));
  }
  function sec3(g) {
    const s = g.sections.s3;
    const comp = s.comparison;
    const scoreRows = s.weights.map((w, i) => tr([td(esc(w.f)), tdn(pc(w.w)), td(esc(w.what), "muted"),
      tdn(s.scores.away.rows[i] ? (s.scores.away.rows[i].score ?? "s/d") : "—"), tdn(s.scores.home.rows[i] ? (s.scores.home.rows[i].score ?? "s/d") : "—")]));
    scoreRows.push(tr([td("<b>Puntaje ponderado (0-100)</b>"), tdn("100%"), td(""), tdn(`<b>${f(s.scores.away.total, 1)}</b>`), tdn(`<b>${f(s.scores.home.total, 1)}</b>`)], "hl"));
    const block = (side) => {
      const b = s.blocks[side], p = comp.find((c) => c.side === side);
      if (!b) return `<div class="panel"><h3 class="sub">${esc(p.name)} (${esc(p.team)})</h3><p class="note">${esc(p.note || "Sin abridor anunciado")}. ERA estimada de la rotación: ${f(p.estEra)}.</p></div>`;
      return `<div class="panel"><h3 class="sub">${esc(p.name)} <span class="code">${esc(p.team)} · ${side === "away" ? "3.5 visitante" : "3.6 local"}</span></h3>
        <dl class="kv"><dt>a) Temporada</dt><dd class="num">ERA ${f(b.season.era)} · WHIP ${f(b.season.whip)} · FIP ${f(b.season.fip)} · ${b.season.bf} BF</dd>
        <dt>b) ${esc(b.condition.label)}</dt><dd class="num">ERA ${f(b.condition.era)} · WHIP ${f(b.condition.whip)} · FIP ${f(b.condition.fip)} · ${b.condition.bf} BF</dd>
        <dt>Factor de split regresado</dt><dd class="num">${f(b.condition.factor, 3)}</dd>
        <dt>Récord del equipo en sus aperturas</dt><dd class="num">${esc(b.teamRecordInStarts)}</dd>
        <dt>f) ¿Ya enfrentó al abridor rival?</dt><dd>${b.facedOpp ? (b.facedOpp.count ? `Sí, ${b.facedOpp.count} vez/veces (${b.facedOpp.dates.map(fmtShort).join(", ")})` : "No (2 temporadas)") : "—"}</dd>
        <dt>g) Valor en ponches</dt><dd>${b.kValue ? '<span class="tag warn">Sí</span>' : '<span class="tag">No</span>'} <span class="num">${f(b.kProj, 1)} K proyectados</span></dd>
        <dt>h) Tamaño de muestra (BF)</dt><dd class="num">temp ${b.bf.season} · cond ${b.bf.cond} · L5 ${b.bf.last5} · rival ${b.bf.vsRival}</dd>
        <dt>Forma (FIP L5 → factor regresado)</dt><dd class="num">${f(b.l5fip)} → ${f(b.form, 3)}</dd></dl>
        <p class="note">${esc(b.kNote)}</p>
        <h3 class="sub">c) Últimas 5 aperturas ${side === "away" ? "como visitante" : "como local"}</h3>${logTable(b.last5cond)}
        <h3 class="sub">d) Últimas 5 aperturas totales</h3>${logTable(b.last5)}
        <h3 class="sub">e) Últimos 3 enfrentamientos contra el rival</h3>${logTable(b.vsRival)}</div>`;
    };
    return `<h3 class="sub"><span class="code">3.1</span> Identificación de abridores</h3>
      ${table(["Elemento", "Pitcher visitante", "Pitcher local"], [
        tr([td("Nombre"), td(`<b>${esc(s.ident[0].name)}</b>`), td(`<b>${esc(s.ident[1].name)}</b>`)]),
        tr([td("Equipo"), td(esc(s.ident[0].team)), td(esc(s.ident[1].team))]),
        tr([td("Mano de lanzar"), td(esc(s.ident[0].hand)), td(esc(s.ident[1].hand))]),
        tr([td("Estado"), td(esc(s.ident[0].status)), td(esc(s.ident[1].status))]),
        tr([td("Condición"), td(esc(s.ident[0].cond)), td(esc(s.ident[1].cond))])])}
      <h3 class="sub"><span class="code">3.2</span> Comparación general de temporada</h3>
      ${table(["Pitcher", "Eq.", "Mano", "W-L", "~ERA", "~WHIP", "~IP", "~K%", "~BB%", "~K-BB%", "~FIP", "~xFIP*", "~SIERA", "~xERA", "~HR/9", "~Barrel%"],
        comp.map((c) => c.missing ? tr([td(`<b>${esc(c.name)}</b>`), td(esc(c.team)), td(`<span class="muted">${esc(c.note || "")}</span>`), ...Array(13).fill(td("—"))])
          : tr([td(`<b>${esc(c.name)}</b>`), td(esc(c.team)), td(hand(c.hand)), tdn(c.wl), tdn(f(c.era)), tdn(f(c.whip)), tdn(f(c.ip, 1)), tdn(pv(c.k)), tdn(pv(c.bb)), tdn(pv(c.kbb)), tdn(f(c.fip)), tdn(f(c.xfip)), tdn("s/d"), tdn(f(c.xera)), tdn(f(c.hr9)), tdn(pv(c.barrel))])))}
      <p class="note muted">* xFIP aproximado con airOuts de la MLB Stats API (sin FanGraphs); SIERA no disponible, sustituido por FIP según 3.4. FIP = (13·HR + 3·(BB+HBP) − 2·K)/IP + ${f(s.fipConstant, 3)} (constante de liga calculada con los totales de la temporada).</p>
      ${table(["Regresado a la media", "~K%", "~BB%", "~K-BB%", "~FIP", "~ERA", "~xERA", "~ERA estimada", "~IP esperadas"],
        comp.filter((c) => !c.missing).map((c) => tr([td(`<b>${esc(c.name)}</b><br><span class="muted" style="font-size:12px">${esc(c.blend)}</span>`), tdn(pv(c.shrunk.k)), tdn(pv(c.shrunk.bb)), tdn(pv(c.shrunk.kbb)), tdn(f(c.shrunk.fip)), tdn(f(c.shrunk.era)), tdn(f(c.shrunk.xera)), tdn(`<b>${f(c.estEra)}</b>`), tdn(f(c.expIp, 1))])))}
      <h3 class="sub"><span class="code">3.3</span> Peso corregido para evaluar abridores</h3>
      <p class="rule">Últimas 5 salidas no pueden pesar más que temporada + matchup + parque + pitch mix</p>
      ${table(["Factor", "~Peso", "Cómo se mide", `~${esc(g.teams.away.abbr)}`, `~${esc(g.teams.home.abbr)}`], scoreRows)}
      ${s.scores.away.note || s.scores.home.note ? `<p class="note muted">${esc(s.scores.away.note || s.scores.home.note)}. Puntaje = 50 + 15·z frente a la liga.</p>` : `<p class="note muted">Puntaje = 50 + 15·z frente a la liga.</p>`}
      <div class="two">${block("away")}${block("home")}</div>
      ${s.arsenal ? ["away", "home"].filter((sd) => s.arsenal[sd]).map((sd) => `<h3 class="sub">Arsenal de ${esc((comp.find((c) => c.side === sd) || {}).name || "")} vs el lineup rival <span class="code">ventaja ${f(s.arsenal[sd].score, 2)} carreras/100 pitcheos</span></h3>
        ${table(["Pitcheo", "~Uso", "~RV/100 pitcher", "~Regresado", "~RV/100 bateadores rivales", "~Whiff%", "~wOBA", "~Ventaja"], s.arsenal[sd].rows.map((r) => tr([td(esc(r.name)), tdn(pv(r.usage)), tdn(f(r.pitcherRv, 1)), tdn(f(r.pitcherRvShrunk, 2)), tdn(f(r.batterRv, 2)), tdn(pv(r.whiff)), tdn(f(r.woba, 3)), tdn(signed(r.edge, 2))])))}`).join("") + '<p class="note muted">Run value por 100 pitcheos de Baseball Savant: positivo en el pitcher = carreras que evita; en los bateadores = carreras que producen contra ese tipo de pitcheo. Ambos se regresan a 0 (300 pitcheos / 60 PA). Ventaja = Σ uso × (pitcher − bateadores).</p>' : ""}
      <h3 class="sub"><span class="code">3.8</span> Interpretación de abridores</h3>
      <dl class="kv">${s.interpretation.map((r) => `<dt>${esc(r.k)} <span class="muted" style="font-size:12px">(${esc(r.basis)})</span></dt><dd>${esc(r.v)}</dd>`).join("")}</dl>
      <h3 class="sub"><span class="code">3.9</span> Tabla final de ventaja de abridor</h3>
      <p class="rule">Ventaja preliminar de abridor: ${esc(s.advantage.text)} — pendiente de confirmar tras la regresión a la media (5.7.4)</p>
      <p class="note">${esc(s.advantage.markets)}</p>`;
  }

  // ------------------------------------------------ sección 4
  function sec4(g) {
    const s = g.sections.s4;
    const relTable = (side) => table(["Relevista", "Mano", "Rol", "~ERA", "~WHIP", "~FIP", "~IP", "~K%", "~BB%", "~SV/HLD", "Último uso", "~Pitcheos", "~Juegos 3d", "~IP 3d", "¿Disponible?", "Riesgo", "Matchup"],
      (s.relievers[side] || []).map((r) => tr([td(`<b>${esc(r.name)}</b>${r.idle7 ? ' <span class="tag warn" data-tip="No aparece en box scores de los últimos 7 días">7d sin uso</span>' : ""}`), td(hand(r.hand)), td(esc(r.role)),
        tdn(f(r.era)), tdn(f(r.whip)), tdn(f(r.fip)), tdn(f(r.ip, 1)), tdn(pv(r.k)), tdn(pv(r.bb)), tdn(`${r.sv}/${r.hld}`), td(r.lastDate ? fmtShort(r.lastDate) : "—", "num"), tdn(r.lastPitches ?? "—"), tdn(r.g3), tdn(f(r.ip3, 1)),
        td(`<span class="tag ${r.available === "Sí" ? "ok" : r.available === "Dudoso" ? "warn" : "bad"}">${esc(r.available)}</span>`), td(esc(r.risk)),
        td(r.matchup ? `<span data-tip="Ofensiva rival vs ${r.hand === "L" ? "zurdos" : "derechos"}: ${f(r.oppRatio, 3)} (1 = su promedio)">${esc(r.matchup)}</span>` : "—")])));
    return `<p class="rule">Bullpen = calidad + disponibilidad real + uso últimos 3 días + brazos clave</p>
      <h3 class="sub"><span class="code">4.1</span> Estadísticas generales del bullpen (relevistas, temporada)</h3>
      ${table(["Equipo", "~ERA", "~WHIP", "~FIP", "~K%", "~BB%", "~K-BB%", "~HR/9", "~H/9", "~LOB%", "~BABIP", "~Blown Sv.", "~Saves", "~ERA 7d", "~Rank"],
        s.stats.map((b) => tr([td(`<b>${esc(b.team)}</b>`), tdn(f(b.era)), tdn(f(b.whip)), tdn(f(b.fip)), tdn(pv(b.k)), tdn(pv(b.bb)), tdn(pv(b.kbb)), tdn(f(b.hr9)), tdn(f(b.h9)), tdn(pv(b.lob)), tdn(f(b.babip, 3)), tdn(b.bs), tdn(b.sv), tdn(f(b.era7)), tdn(`${b.rank}/30`)])))}
      <h3 class="sub"><span class="code">4.2</span> Interpretación general del bullpen</h3>
      <dl class="kv">${s.interpretation.map((r) => `<dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd>`).join("")}</dl>
      <p class="note muted">Si la ERA es buena pero el FIP es malo, debe advertirse posible regresión negativa.</p>
      <h3 class="sub"><span class="code">4.3 · 4.5 · 4.6</span> Relevistas principales, uso reciente, fatiga y matchup — ${esc(g.teams.away.abbr)}</h3>${relTable("away")}
      <h3 class="sub">${esc(g.teams.home.abbr)}</h3>${relTable("home")}
      <p class="note muted">Disponibilidad derivada de los box scores oficiales: «Probablemente no» con 3 juegos en 3 días, días consecutivos con 15+ pitcheos o 35+ pitcheos ayer; «Dudoso» con días consecutivos, 20+ pitcheos ayer o 45+ en 3 días. Matchup = ofensiva rival contra esa mano (regresada).</p>
      <h3 class="sub"><span class="code">4.4</span> Lectura de fatiga</h3>
      <ul class="clean">${s.fatigueReading.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      ${table(["Equipo", "~Pitcheos ponderados 3d", "~z fatiga", "~z ERA", "~z WHIP", "~z BB%", "~z HR/9", "~RiesgoBullpen"],
        s.stats.map((b) => tr([td(`<b>${esc(b.team)}</b>`), tdn(b.fatigue), tdn(f(b.zFatigue)), tdn(f(b.riskParts.era)), tdn(f(b.riskParts.whip)), tdn(f(b.riskParts.bb)), tdn(f(b.riskParts.hr9)), tdn(`<b>${f(b.risk)}</b>`)])))}
      <p class="note muted">${esc(s.formula)}. Pitcheos de relevistas ponderados: ayer ×1, hace 2 días ×0.66, hace 3 días ×0.33.</p>
      ${s.full ? `<h3 class="sub"><span class="code">4.3+</span> Bullpen completo: disponibilidad y probabilidad de uso</h3>
        <p class="note muted">Roles: cerrador = líder de salvamentos, setup = líderes en holds, largo = 1.6+ IP por aparición. P(uso) = probabilidad base del rol × disponibilidad por fatiga. «Oficial» = aparece en la lista de bullpen publicada para el partido.</p>
        ${bullpenTable(g.teams.away.abbr, s.full.away, s.officialList && s.officialList.away)}${bullpenTable(g.teams.home.abbr, s.full.home, s.officialList && s.officialList.home)}` : ""}
      <h3 class="sub"><span class="code">4.7</span> Conclusión obligatoria del bullpen</h3>
      <p class="rule">${esc(s.conclusion)}</p>`;
  }

  // ------------------------------------------------ sección 5
  function sec5(g) {
    const s = g.sections.s5, L = s.lambda, t = s.triangulation;
    const lamRow = (label, key, d = 3) => tr([td(label), tdn(f(L.away[key], d)), tdn(f(L.home[key], d))]);
    const lu = (side) => {
      const x = s.lineups[side];
      if (!x) return `<p class="note">${esc(g.teams[side].abbr)}: lineup aún no publicado; se usa la ofensiva habitual del equipo.</p>`;
      return `<h3 class="sub">Lineup confirmado ${esc(g.teams[side].abbr)} <span class="code">OBP ${f(x.obp, 3)} · SLG ${f(x.slg, 3)} · K% ${pv(x.k)} · Barrel% ${f(x.barrel, 1)} · factor ${f(x.ratio, 3)}</span></h3>
        ${table(["#", "Bateador", "Batea", "~PA", "~OBP", "~SLG", "~OPS", "~HR", "~K%", "~Barrel%"], x.rows.map((r, i) => tr([tdn(i + 1), td(esc(r.name)), td(esc(r.bats || "—")), tdn(r.pa), tdn(f(r.obp, 3)), tdn(f(r.slg, 3)), tdn(f(r.ops, 3)), tdn(r.hr), tdn(pv(r.k)), tdn(pv(r.barrel))])))}`;
    };
    return `<p class="rule">No se debe convertir una ventaja estadística en pick automático.</p>
      ${table(["Factor", `~${esc(g.teams.away.abbr)}`, `~${esc(g.teams.home.abbr)}`, "Ventaja", "Mercado afectado"], s.factors.map((r) => tr([td(esc(r.f)), tdn(r.a ?? "—"), tdn(r.h ?? "—"), td(`<b>${esc(r.adv)}</b>`), td(esc(r.m), "muted")])))}
      <h3 class="sub"><span class="code">5.1</span> Relación abridor vs lineup</h3>
      ${table(["Abridor", "Contra", "~Calidad (z)", "~Amenaza (z)", "~Ventaja", "Clasificación"], s.starterVsLineup.map((r) => tr([td(`<b>${esc(r.pitcher)}</b>`), td(esc(r.lineup)), tdn(f(r.quality)), tdn(f(r.threat)), tdn(f(r.diff)), td(esc(r.class))])))}
      <p class="note muted">Ventaja Abridor-Lineup = Calidad del abridor (ERA estimada vs liga) − Amenaza ofensiva rival (ofensiva × split vs mano × lineup).</p>
      ${lu("away")}${lu("home")}
      <h3 class="sub"><span class="code">5.2</span> Relación bullpen vs lineup</h3>
      <p class="note">RiesgoBullpen = z(ERA) + z(WHIP) + z(BB%) + z(HR/9) + z(Fatiga): ver 4.4. Si el bullpen contradice el pick de juego completo, se revisa F5.</p>
      <h3 class="sub"><span class="code">5.3</span> Carreras esperadas con ajuste de contradicciones</h3>
      ${table(["Componente", `~${esc(g.teams.away.abbr)} batea`, `~${esc(g.teams.home.abbr)} batea`], [
        lamRow("Ofensiva (neutral de parque, regresada)", "offense"), lamRow("× Split vs mano del abridor rival", "handRatio"), lamRow("× Lineup confirmado", "lineup"),
        lamRow("× Park factor (Savant)", "park"), lamRow("× Abridor rival (RA9 estimada / liga)", "starter"), lamRow("× Forma reciente regresada", "form"),
        lamRow("× Split casa/visita del abridor", "split"), lamRow("× Bullpen rival", "bullpen"), lamRow("× Fatiga del bullpen rival", "fatigue"),
        tr([td("λ base juego (sin ajustes 5.3)"), tdn(f(L.away.base.full)), tdn(f(L.home.base.full))]),
        tr([td("<b>λ F3 · F5 · juego (ajustada)</b>"), tdn(`<b>${f(L.away.f3)} · ${f(L.away.f5)} · ${f(L.away.full)}</b>`), tdn(`<b>${f(L.home.f3)} · ${f(L.home.f5)} · ${f(L.home.full)}</b>`)], "hl"),
        tr([td("Carreras vs abridor / vs bullpen"), tdn(`${f(L.away.vsStarter)} / ${f(L.away.vsBullpen)}`), tdn(`${f(L.home.vsStarter)} / ${f(L.home.vsBullpen)}`)]),
        tr([td("Promedio de liga (mismo lado)"), tdn(f(L.away.lgFull)), tdn(f(L.home.lgFull))])])}
      <p class="note muted">λ<sub>juego</sub> = λ<sub>F5</sub> + carreras esperadas contra el bullpen. La salida del abridor se modela como Normal(IP esperadas, 1.2): fracción de cada entrada cubierta por el abridor ${esc(g.teams.home.abbr)}: ${L.away.starterFracs.map((x) => f(x, 2)).join(" · ")}.</p>
      <p class="rule">Nunca subir el total por un solo factor. Los ajustes ya presentes en λ base no se duplican.</p>
      ${table(["Condición", "~Ajuste", "Impacto", "¿Se cumple?", "Estado", "Dato"], s.adjustments.map((r) => tr([td(`<b>${esc(r.cond)}</b><br><span class="muted" style="font-size:12px">${esc(r.why)}</span>`), tdn("λ × " + f(r.factor, 2)), td(esc(r.impact)),
        td(r.applies ? '<span class="tag warn">Sí</span>' : '<span class="tag">No</span>'), td(r.applied ? '<span class="tag info">Aplicado</span>' : r.applies && r.inBase ? `<span class="tag" data-tip="${esc(r.inBase)}">En λ base</span>` : '<span class="muted">—</span>'),
        td(esc(r.note || "") + (r.applies && r.inBase ? `<br><span class="muted" style="font-size:12px">${esc(r.inBase)}</span>` : ""), "muted")])))}
      <h3 class="sub"><span class="code">5.4 · 5.7.5</span> Modelo de probabilidad</h3>
      <p class="note">Juego completo: Binomial Negativa por equipo con Var/Media = ${f(s.league.varRatio, 2)} medido en ${s.league.games} juegos de esta temporada (Poisson subestima blanqueadas y juegos largos). F3/F5: Poisson. Empates a 9 entradas se resuelven con el ${pv(s.league.extraHomeWin)} de victorias locales en extra innings.</p>
      <h3 class="sub"><span class="code">5.5</span> Probabilidad por mercado</h3>
      ${table(["Mercado", "Pick", "~Prob.", "~Empate/push"], s.probabilities.map((r) => tr([td(esc(r.market)), td(esc(r.pick)), tdn(pc(r.p, 1)), tdn(r.tie ? pc(r.tie, 1) : r.push ? pc(r.push, 1) : "—")])))}
      <h3 class="sub"><span class="code">5.6</span> Razones preliminares para cancelar un pick</h3>
      <ul class="clean">${s.cancel.map((c) => `<li>${c.on ? '<span class="tag warn">Activa</span>' : '<span class="tag">No</span>'} ${esc(c.text)}</li>`).join("")}</ul>
      <h3 class="sub"><span class="code">5.7.1</span> Pythagorean Expectation (Pythagenpat)</h3>
      ${table(["Equipo", "~RS", "~RA", "~G", "~Win% real", "~Pitagórico", "~Prior (temp. anterior)", "~Win% verdadero", "Lectura"], s.luck.map((r) => tr([td(`<b>${esc(r.team)}</b>`), tdn(r.rs), tdn(r.ra), tdn(r.g), tdn(pv(r.wpct)), tdn(pv(r.pyth)), tdn(pv(r.prior)), tdn(`<b>${pv(r.true)}</b>`), td(esc(r.text), "muted")])))}
      <h3 class="sub"><span class="code">5.7.2 · 5.7.7 · FASE 2</span> Triangulación de la probabilidad de victoria</h3>
      ${table(["Método", `~P(${esc(g.teams.home.abbr)})`, "Cálculo"], [
        tr([td("<b>Log5</b> (win% verdadero)"), tdn(pc(t.log5.pHome, 1)), td(esc(t.log5.detail), "muted")]),
        tr([td("<b>Elo</b> + ajuste por abridor"), tdn(pc(t.elo.pHome, 1)), td(esc(t.elo.detail), "muted")]),
        tr([td("<b>Modelo λ</b> (Binomial Negativa)"), tdn(pc(t.lambda.pHome, 1)), td(esc(t.lambda.detail), "muted")]),
        tr([td("<b>Triangulada</b>"), tdn(`<b>${pc(t.pHome, 1)}</b>`), td(`Divergencia ${pc(t.spread, 1)} → confianza <b>${esc(t.confidence)}</b>. ${esc(t.rule)}`)], "hl")])}
      <p class="note muted">Ajuste de abridor en Elo: carreras que ahorra frente a la rotación de su equipo × entradas esperadas / 9, a ~0.1 de win% por carrera. ${esc(g.teams.away.abbr)}: ${f(t.elo.starterAdj.away.runsSaved)} carreras (${signed(t.elo.starterAdj.away.elo, 0)} Elo) · ${esc(g.teams.home.abbr)}: ${f(t.elo.starterAdj.home.runsSaved)} carreras (${signed(t.elo.starterAdj.home.elo, 0)} Elo).</p>
      <h3 class="sub"><span class="code">5.7.4</span> Regresión a la media (shrinkage bayesiano)</h3>
      <ul class="clean">${s.shrinkage.map((x) => `<li class="num" style="font-family:var(--sans)">${esc(x)}</li>`).join("")}</ul>
      <p class="note muted">θ̂ = n/(n+k)·x̄ + k/(n+k)·μ<sub>liga</sub> con k = 70 BF (K%), 170 BF (BB%), 1150 BF (HR, ≈400 FB) y 1000 BF para la ERA; la temporada anterior entra con peso 0.5.</p>
      <h3 class="sub"><span class="code">5.7.10</span> Correlación entre mercados</h3>
      <ul class="clean">${s.correlation.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  }

  // ------------------------------------------------ sección 6
  function sec6(g) {
    const s = g.sections.s6;
    const lean = (x) => `<span class="tag ${x === "Over" ? "bad" : x === "Under" ? "info" : ""}">${esc(x)}</span>`;
    const kp = Object.entries(s.kprops || {});
    return `<p class="rule">Si el juego proyecta pocas carreras, revisar primero Under/F5 Under antes que ML o Run Line.</p>
      <h3 class="sub"><span class="code">6.1</span> Datos base para el total</h3>
      ${table(["Factor", "Favorece", "Comentario"], s.base.map((r) => tr([td(esc(r.f)), td(lean(r.lean)), td(esc(r.c), "muted")])))}
      <h3 class="sub"><span class="code">6.3</span> Filtro de ponches contra Over (${s.kCount} de ${s.kFilter.length} condiciones)</h3>
      ${table(["Condición", "¿Se cumple?", "~Dato"], s.kFilter.map((r) => tr([td(esc(r.c)), td(r.on ? '<span class="tag warn">Sí</span>' : '<span class="tag">No</span>'), tdn(isNum(r.v) ? f(r.v, 1) : esc(r.v ?? "—"))])))}
      <p class="rule">${s.overBlocked ? "3 o más condiciones: el Over queda bloqueado salvo razón muy fuerte." : "Pitcher Ks fuerte + lineup con K alto = revisar F5 Under/Under antes que Over"}</p>
      <h3 class="sub"><span class="code">6.4</span> El estadio no puede dominar el análisis</h3>
      <p class="note">${esc(s.parkText)}</p>
      <ul class="clean">${s.parkChecks.map((c) => `<li>${c.on ? '<span class="tag ok">Sí</span>' : '<span class="tag">No</span>'} ${esc(c.c)}</li>`).join("")}</ul>
      <h3 class="sub"><span class="code">6.7 · 6.8</span> Carreras esperadas por tramos y distribución del total</h3>

  // ---------------------------------------------------------------- gráficas del Pro-Lab
  function heatmap(M, rows, cols, o = {}) {
    const cw = o.cell || 22, ch = o.cellH || cw, L = o.left || 52, T = o.top || 44;
    const W = L + cols.length * cw + 6, H = T + rows.length * ch + 6;
    const max = o.max || Math.max(...M.flat(), 1e-9);
    let sv = `<svg class="chart heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "matriz")}" style="max-width:${o.maxW || W}px">`;
    cols.forEach((c, j) => { sv += `<text x="${L + j * cw + cw / 2}" y="${T - 6}" text-anchor="start" transform="rotate(-55 ${L + j * cw + cw / 2} ${T - 6})">${esc(c)}</text>`; });
    rows.forEach((r, i) => {
      sv += `<text x="${L - 4}" y="${T + i * ch + ch / 2 + 3}" text-anchor="end">${esc(r)}</text>`;
      M[i].forEach((v, j) => {
        const a = v <= 0 ? 0.03 : 0.08 + 0.85 * Math.min(1, v / max);
        sv += `<rect x="${L + j * cw}" y="${T + i * ch}" width="${cw - 1}" height="${ch - 1}" rx="2" fill="rgba(var(--heat), ${a.toFixed(3)})" data-tip="${esc(r)} → ${esc(cols[j])}: ${o.fmt ? o.fmt(v) : v.toFixed(3)}"/>`;
        if (o.values && v > (o.minLabel || 0)) sv += `<text class="v" x="${L + j * cw + cw / 2}" y="${T + i * ch + ch / 2 + 3}" text-anchor="middle">${o.fmt ? o.fmt(v) : v.toFixed(2)}</text>`;
      });
    });
    return sv + "</svg>";
  }

  function groupedBars(series, labels, o = {}) {
    const W = o.w || 620, H = o.h || 190, L = 36, R = 8, T = 12, B = 26;
    const n = labels.length, k = series.length;
    const max = Math.max(...series.flatMap((x) => x.values), 1e-9) * 1.12;
    const bw = (W - L - R) / n;
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let sv = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "distribución")}">`;
    const step = max > 0.2 ? 0.1 : max > 0.08 ? 0.05 : 0.02;
    for (let t = 0; t <= max; t += step) sv += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 5}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`;
    labels.forEach((lab, i) => {
      series.forEach((sr, j) => {
        const v = sr.values[i] || 0, x = L + i * bw + 1 + j * ((bw - 2) / k);
        sv += `<rect x="${x}" y="${y(v)}" width="${Math.max(1, (bw - 2) / k - 1)}" height="${Math.max(0, y(0) - y(v))}" rx="2" fill="${sr.color}" data-tip="${esc(sr.name)} · ${esc(lab)}: ${(v * 100).toFixed(1)}%"/>`;
      });
      if (n <= 16 || i % 2 === 0) sv += `<text x="${L + i * bw + bw / 2}" y="${H - 9}" text-anchor="middle">${esc(lab)}</text>`;
    });
    (o.marks || []).forEach((m) => { const x = L + (m.at + 0.5) * bw; sv += `<line x1="${x}" x2="${x}" y1="${T}" y2="${y(0)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text class="lbl" x="${x + 3}" y="${T + 9}">${esc(m.label)}</text>`; });
    return sv + "</svg>" + (series.length > 1 ? `<div class="legend">${series.map((sr) => `<span><i style="background:${sr.color}"></i>${esc(sr.name)}</span>`).join("")}</div>` : "");
  }

  function convergence(pts, label) {
    const W = 620, H = 180, L = 44, R = 10, T = 12, B = 26;
    const xs = pts.map((p) => p.n), maxX = Math.max(...xs);
    const lo = Math.min(...pts.map((p) => p.p - 1.96 * p.se)), hi = Math.max(...pts.map((p) => p.p + 1.96 * p.se));
    const pad = (hi - lo) * 0.1 || 0.01;
    const y = (v) => T + (H - T - B) * (1 - (v - (lo - pad)) / (hi - lo + 2 * pad));
    const x = (n) => L + (W - L - R) * (n / maxX);
    const band = pts.map((p) => `${x(p.n)},${y(p.p + 1.96 * p.se)}`).join(" ") + " " + pts.slice().reverse().map((p) => `${x(p.n)},${y(p.p - 1.96 * p.se)}`).join(" ");
    let sv = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
    [lo, (lo + hi) / 2, hi].forEach((t) => { sv += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 5}" y="${y(t) + 4}" text-anchor="end">${(t * 100).toFixed(1)}%</text>`; });
    sv += `<polygon points="${band}" fill="rgba(var(--heat), 0.16)"/>`;
    sv += `<polyline points="${pts.map((p) => `${x(p.n)},${y(p.p)}`).join(" ")}" fill="none" stroke="var(--home)" stroke-width="2"/>`;
    const last = pts[pts.length - 1];
    sv += `<circle cx="${x(last.n)}" cy="${y(last.p)}" r="4" fill="var(--home)" stroke="var(--surface)" stroke-width="2"/>`;
    [0, 0.5, 1].forEach((t) => { sv += `<text x="${x(maxX * t)}" y="${H - 8}" text-anchor="${t === 0 ? "start" : t === 1 ? "end" : "middle"}">${Math.round(maxX * t).toLocaleString("es-MX")}</text>`; });
    return sv + "</svg>";
  }

  function hbars(items, color) {
    const max = Math.max(...items.map((i) => i.value), 1e-9);
    return `<div style="display:grid;grid-template-columns:minmax(0,190px) 1fr 52px;gap:5px 10px;align-items:center;font-size:13px">${items.map((i) => `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.label)}${i.sub ? ` <span class="muted">${esc(i.sub)}</span>` : ""}</span><span style="height:8px;background:var(--surface-2);border-radius:4px;position:relative"><i style="position:absolute;inset:0 auto 0 0;width:${(100 * i.value / max).toFixed(1)}%;background:${color};border-radius:4px"></i></span><span class="num" style="text-align:right">${pc(i.value)}</span>`).join("")}</div>`;
  }

  // ---------------------------------------------------------------- vista: Pro-Lab
  function viewProLab(showBase) {
    const lab = D.prolab;
    if (!lab) { app.innerHTML = `<div class="empty">El Pro-Lab todavía no tiene un partido congelado.</div>`; return; }

    const chainTable = (side) => {
      const c = lab.chains[side];
      const maxv = Math.max(...c.batterProbs.flatMap((b) => E.filter((e) => e !== "OUT").map((e) => b[e])));

        ${c.batterProbs.map((b, i) => `<tr><td class="num">${i + 1}</td><td>${esc(b.name)}</td><td>${esc(b.bats || "")}</td>${E.map((e) => cell(b[e], e)).join("")}<td class="r num">${f(b.obp, 3)}</td><td class="r num"><b>${f(b.woba, 3)}</b></td></tr>`).join("")}
        </tbody></table></div>`;

    const re24Table = (t, p1, title) => `<div><h3 class="sub">${esc(title)}</h3>${table(["Bases", "~0 outs", "~1 out", "~2 outs", "~P(≥1) 0 outs", "~P(≥1) 1 out", "~P(≥1) 2 outs"], t.map((row, b) => tr([td(`<span class="num">${["---", "1--", "-2-", "12-", "--3", "1-3", "-23", "123"][b]}</span>`), ...row.map((v) => tdn(f(v, 2))), ...(p1 ? p1[b].map((v) => tdn(pc(v))) : ["", "", ""].map(() => td("")))])))}</div>`;
    const Q = lab.re24.Q, states = lab.re24.states;
    const cons = lab.consensus;
    const graded = res ? res.graded : null;
    const gmap = Object.fromEntries((graded || []).map((x) => [x.pick, x]));
    const top = (lab.topPicks || []).map((p, i) => pickCard(p, lab.pk, i + 1, gmap[p.pick])).join("");
    const kLabels = [...Array(13).keys()].map(String);
    const relieversBlock = (side) => hbars((mc.relievers[side] || []).slice(0, 10).map((r) => ({ label: r.name, sub: r.role || "", value: r.p })), side === "away" ? "var(--away)" : "var(--home)");
    app.innerHTML = `
      <div class="lab-hero">
        <p class="eyebrow">Pro-Lab · prueba de modelo</p>
        <span class="name">DIAMANTE<span>-24</span></span>
        <p class="lede">Modelo por turno al bate: cadena de Markov de las <b>24 situaciones base-out</b> (sección 5.7.3) alimentada con la probabilidad de cada resultado bateador contra pitcher (log5 multinomial, 5.7.2, sobre tasas regresadas con 5.7.4), resuelta con matrices y simulada <b>${mc.n.toLocaleString("es-MX")} veces</b> (Monte Carlo, 5.7.9). Partido de prueba: <b>${esc(a.name)} @ ${esc(h.name)}</b>, ${fmtDateLong(g.date)}, ${esc(g.venue.name)}.</p>
        <div class="notice"><span class="ic" style="background:var(--verde-soft);color:var(--verde)">✓</span><div><b>Sin fuga de información:</b> los datos se congelaron el ${fmtStamp(lab.frozenAt)}, ${mins} minutos antes del primer lanzamiento (${fmtTime(lab.firstPitch)}), con lineups y bullpen oficiales ya publicados. El modelo no vio nada del partido.</div></div>
      </div>

      ${res ? `<section class="block"><h2>Resultado real contra el modelo</h2>
        <div class="res">
          <div class="tile"><span class="eyebrow">Final</span><span class="big">${esc(a.abbr)} ${res.away} – ${res.home} ${esc(h.abbr)}</span><span class="sub">proyección ${f(mc.meanRuns.away, 1)} – ${f(mc.meanRuns.home, 1)}</span></div>
          <div class="tile"><span class="eyebrow">Ganador</span><span class="big">${esc(res.homeWon ? h.abbr : a.abbr)}</span><span class="sub">el modelo daba ${pc(res.homeWon ? cons.pHome : 1 - cons.pHome, 1)} · Brier ${f(res.brier, 3)}</span></div>
          <div class="tile"><span class="eyebrow">Total</span><span class="big">${res.total}</span><span class="sub">percentil ${pc(res.percentileTotal)} de la distribución simulada</span></div>

        </div></section>` : `<div class="notice"><span class="ic">…</span><div>El partido todavía no termina: cuando la MLB publique el resultado oficial, cada actualización lo compara aquí contra la predicción congelada (acierto de cada pick, Brier, percentil del total).</div></div>`}

      <section class="block"><h2>Los dos picks de mayor confianza</h2><div class="toppicks">${top}</div></section>

        <div class="panel">
          ${[["Log5 (5.7.2)", cons.methods.log5], ["Elo + abridor (5.7.7)", cons.methods.elo], ["λ + Binomial Negativa (5.3 · 5.7.5)", cons.methods.lambda], ["DIAMANTE-24 Monte Carlo (5.7.3 · 5.7.9)", cons.methods.mc]].map(([n, v]) => `<div class="mbar" style="grid-template-columns:minmax(0,260px) 1fr 52px"><span>${n}</span><span class="track"><i style="width:${(v * 100).toFixed(1)}%"></i></span><span class="num">${pc(v, 1)}</span></div>`).join("")}
          <p class="note">P(${esc(h.abbr)}) de consenso <b>${pc(cons.pHome, 1)}</b> · divergencia entre métodos ${pc(cons.spread, 1)} · Monte Carlo ${pc(mc.pHome, 1)} ± ${pc(1.96 * mc.se, 1)} (IC 95%).</p>
        </div></section>

      <div class="step"><span class="n">1</span><div><h2>Probabilidad de cada turno al bate</h2>
        <p class="note">Para cada bateador contra el abridor rival: tasas de temporada regresadas a la media (K% 60 PA, BB% 120, HR 170, XBH 160, sencillos ≈1,100; pitcher K% 70 BF, BB% 170, HR 1,150, hits ≈2,800 BF), split por mano, y combinación <b>log5 multinomial</b>: P(e) ∝ bateador<sub>e</sub> · pitcher<sub>e</sub> / liga<sub>e</sub>. Luego parque (${esc(lab.park.name)}: HR ×${f(lab.park.mult.HR, 3)} incluyendo viento ${esc(lab.park.weather.windText || "—")}) y penalización por veces en el orden (0.96 · 1.00 · 1.07 · 1.10).</p>
        ${chainTable("away")}${chainTable("home")}
        <p class="note muted">E = evento residual calibrado (errores, robos, wild pitches): ${pc(lab.calibration.eRate, 2)} de los turnos, obtenido por bisección para que la cadena reproduzca las ${f(lab.calibration.target, 3)} carreras reales por media entrada de la liga (sin él daba ${f(lab.calibration.rawRE, 3)}). La tasa real de embasado por error en MLB ronda 1%.</p>
      </div></div>

      <div class="step"><span class="n">2</span><div><h2>Matriz de transición Q (24 × 24)</h2>
        <p class="note">Cada fila es una situación (bases ocupadas + outs) y cada columna la situación siguiente tras un turno al bate con las tasas de la liga. Las filas no suman 1: lo que falta es la probabilidad de terminar la entrada (tercer out). Reglas de corrido: sencillo anota desde 2ª 60% (85% con 2 outs), doble anota desde 1ª 40% (60%), doble play 40% de los rodados con corredor en 1ª, elevado de sacrificio 55%.</p>
        <div class="tbl" style="padding:8px">${heatmap(Q, states, states, { cell: 20, left: 46, top: 48, label: "Matriz Q", fmt: (v) => pc(v, 1), maxW: 560 })}</div>
      </div></div>

      <div class="step"><span class="n">3</span><div><h2>Matriz fundamental N = (I − Q)⁻¹ y expectativa de carreras RE24</h2>
        <p class="note">N<sub>ij</sub> = veces esperadas que la entrada pasa por la situación j empezando en i. Carreras esperadas = N · r, donde r son las carreras esperadas de cada turno. Desde bases vacías y 0 outs una entrada dura en promedio <b>${f(lab.re24.expectedPA, 2)} turnos</b>. P(≥1 carrera) se resuelve con un segundo sistema lineal donde anotar es absorbente.</p>
        <div class="two">${re24Table(lab.re24.league, lab.re24.leagueP1, "Liga 2026 calibrada")}${re24Table(lab.chains.away.re24, lab.chains.away.p1, `${a.abbr} contra ${lab.chains.away.vs}`)}${re24Table(lab.chains.home.re24, lab.chains.home.p1, `${h.abbr} contra ${lab.chains.home.vs}`)}</div>
        <p class="note muted">Cotejo: la matriz calibrada reproduce la RE24 empírica de MLB (≈0.50 · 0.27 · 0.11 con bases vacías; ≈2.3 con casa llena y 0 outs).</p>
      </div></div>

      <div class="step"><span class="n">4</span><div><h2>Cadena del lineup: 216 estados (24 situaciones × 9 bateadores)</h2>
        <p class="note">Al agregar quién batea, la cadena da las carreras esperadas de una entrada según quién la abre (R) y la matriz T de rotación del lineup: T<sub>kj</sub> = probabilidad de que, si la entrada la abre el bateador k, la siguiente la abra el j. Proyección por entrada: π<sub>i+1</sub> = π<sub>i</sub> · T, carreras<sub>i</sub> = π<sub>i</sub> · R (si el abridor lanzara todo el juego).</p>
        <div class="two">${["away", "home"].map((sd) => { const c = lab.chains[sd]; return `<div><h3 class="sub">${esc(g.teams[sd].abbr)} contra ${esc(c.vs)}</h3>
          <div class="tbl" style="padding:8px">${heatmap(c.T, c.batterProbs.map((b, i) => `${i + 1} ${b.name.split(" ").slice(-1)[0]}`), c.batterProbs.map((b, i) => `${i + 1}`), { cell: 30, left: 96, top: 26, values: true, minLabel: 0.05, fmt: (v) => (v * 100).toFixed(0), label: "Matriz T" })}</div>
          ${table(["Abre la entrada", "~Carreras esperadas R"], c.batterProbs.map((b, i) => tr([td(`${i + 1}. ${esc(b.name)}`), tdn(f(c.R[i], 3))])))}
          <p class="formula">Carreras por entrada vs el abridor: ${c.innings.map((r) => f(r.runs, 2)).join(" · ")}</p></div>`; }).join("")}</div>
      </div></div>

      <div class="step"><span class="n">5</span><div><h2>Monte Carlo: ${mc.n.toLocaleString("es-MX")} partidos simulados</h2>
        <p class="note">Cada simulación juega el partido turno por turno: el abridor sale al llegar a su límite de bateadores (${esc(a.abbr)}: ${f(mc.starterBf.away.mean, 1)} ± ${f(mc.starterBf.away.sd, 1)}, recientes ${mc.starterBf.away.recent.join(", ")}; ${esc(h.abbr)}: ${f(mc.starterBf.home.mean, 1)} ± ${f(mc.starterBf.home.sd, 1)}), el bullpen entra por rol y situación (largos en entradas tempranas, setup en la 8ª, cerrador en salvamento), cada relevista cubre sus outs típicos y los no disponibles por fatiga no lanzan; en extra innings hay corredor en 2ª y el local no batea la 9ª si va ganando. ${f(mc.seconds, 1)} s de cómputo.</p>
        <h3 class="sub">Convergencia de P(${esc(h.abbr)} gana) con banda de 95%</h3>${convergence(mc.convergence, "Convergencia del Monte Carlo")}
        <h3 class="sub">Carreras por equipo</h3>${groupedBars([{ name: a.abbr, color: "var(--away)", values: mc.runs.away.slice(0, 16) }, { name: h.abbr, color: "var(--home)", values: mc.runs.home.slice(0, 16) }], [...Array(16).keys()].map(String), { label: "Carreras por equipo" })}
        <h3 class="sub">Total de carreras (media ${f(mc.total.reduce((acc, v, k) => acc + k * v, 0), 2)})</h3>${groupedBars([{ name: "Total", color: "var(--accent)", values: mc.total.slice(0, 22) }], [...Array(22).keys()].map(String), { marks: [{ at: 7.5, label: "7.5" }, { at: 8.5, label: "8.5" }, { at: 9.5, label: "9.5" }], label: "Total" })}
        <h3 class="sub">Margen (${esc(h.abbr)} − ${esc(a.abbr)})</h3>${groupedBars([{ name: "Margen", color: "var(--home)", values: Object.keys(mc.margin).map(Number).sort((x, y) => x - y).map((k) => mc.margin[k]) }], Object.keys(mc.margin).map(Number).sort((x, y) => x - y).map(String), { label: "Margen" })}
        <div class="two"><div><h3 class="sub">Ponches de ${esc(lab.chains.home.vs)} (${esc(a.abbr)})</h3>${groupedBars([{ name: "K", color: "var(--away)", values: mc.k.away.slice(0, 13) }], kLabels, { w: 320, h: 150, label: "Ponches" })}</div>
          <div><h3 class="sub">Ponches de ${esc(lab.chains.away.vs)} (${esc(h.abbr)})</h3>${groupedBars([{ name: "K", color: "var(--home)", values: mc.k.home.slice(0, 13) }], kLabels, { w: 320, h: 150, label: "Ponches" })}</div></div>
        <dl class="kv"><dt>F5: ${esc(a.abbr)} · empate · ${esc(h.abbr)}</dt><dd class="num">${pc(mc.f5.away, 1)} · ${pc(mc.f5.tie, 1)} · ${pc(mc.f5.home, 1)}</dd>

      </div></div>

      <div class="step"><span class="n">6</span><div><h2>Bullpen: quién lanzaría (predicción del Monte Carlo)</h2>
        <p class="note">Frecuencia con que cada relevista entra en las simulaciones. Es la predicción de uso del bullpen con la lista oficial del partido, los roles y la fatiga de los últimos 3 días.</p>

        <li>ERA estimada del abridor = 0.45·FIP regresado + 0.35·xERA regresada + 0.20·ERA regresada.</li>
        <li>Carreras por media entrada con la distribución real de la liga por entrada; el abridor cubre cada entrada según sus IP esperadas y el resto lo cubre el bullpen (con su fatiga).</li>
        <li>Ajustes de la tabla 5.3: se evalúan todos; se aplican solo los que traen información nueva (viento, HR/9 + parque + contacto). Los que ya están en λ base (K-BB%, K% rival, bullpens, parque) se muestran pero no se duplican. Nunca se sube el total por un solo factor.</li>
        <li>Juego completo con Binomial Negativa (Var/Media medida); F3/F5 con Poisson; NRFI calibrado con la frecuencia real de ceros.</li>
        <li>Probabilidad de victoria triangulada: Log5 (Pitágoras regresado + ventaja de local medida), Elo (K=4, local +24, ajuste por abridor) y modelo λ.</li>
        <li>Semáforo: Verde solo con Modelo + Guion + Cuota con edge ≥ 3 pp y baja contradicción, y nunca con un campo obligatorio faltante.</li>
      </ul></section>
      ${footer()}`;
  }

  // ---------------------------------------------------------------- router
  function route() {
    const h = (location.hash || "#partidos").slice(1);
    let tab = "partidos";
    if (h.startsWith("g") && BY_PK[h.slice(1)]) viewGame(BY_PK[h.slice(1)]);
    else if (h === "prolab" || h === "prolabbase") { tab = "prolab"; viewProLab(h === "prolabbase"); }
    else if (h === "cotejo") { tab = h; viewChecks(); }
    else if (h === "posiciones") { tab = h; viewStandings(); }
    else if (h === "seguimiento") { tab = h; viewTrack(); }
    else if (h === "metodologia") { tab = h; viewMethod(); }
    else viewGames();
    document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
    tip.hidden = true;
  }
  window.addEventListener("hashchange", () => { route(); if (!location.hash.startsWith("#g")) window.scrollTo(0, 0); });
  route();
})();
</script>
