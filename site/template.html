<title>MLBgs</title>
<meta name="description" content="Análisis matemático y estadístico de los próximos partidos de MLB con datos oficiales (Framework MLB Picks v2).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #f1f3f0;
    --surface: #ffffff;
    --surface-2: #e8ece7;
    --ink: #15202b;
    --ink-2: #34414c;
    --muted: #5b6770;
    --border: #d5dbd4;
    --grid: #e4e8e3;
    --accent: #1e4fa3;
    --accent-soft: rgba(30, 79, 163, 0.10);
    --heat: 30, 79, 163;
    --away: #2f6fd0;
    --home: #c8612a;
    --verde: #23794b;
    --verde-soft: rgba(35, 121, 75, 0.13);
    --amarillo: #8a5f00;
    --amarillo-soft: rgba(201, 147, 0, 0.18);
    --gris: #5f6a72;
    --gris-soft: rgba(106, 116, 124, 0.15);
    --rojo: #b3302a;
    --rojo-soft: rgba(184, 50, 44, 0.12);
    --shadow: 0 1px 2px rgba(21, 32, 43, 0.06);
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --sans: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1419; --surface: #151d24; --surface-2: #1c2630; --ink: #e8edf0; --ink-2: #c3ccd3;
      --muted: #93a0aa; --border: #2a3540; --grid: #212b35; --accent: #7fa8f2; --accent-soft: rgba(127, 168, 242, 0.13);
      --heat: 127, 168, 242; --away: #5a93ea; --home: #c66a33;
      --verde: #5cc98e; --verde-soft: rgba(76, 192, 130, 0.15); --amarillo: #e9bd4c; --amarillo-soft: rgba(229, 181, 58, 0.16);
      --gris: #a3adb5; --gris-soft: rgba(142, 153, 161, 0.16); --rojo: #f07a73; --rojo-soft: rgba(232, 98, 91, 0.16);
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1419; --surface: #151d24; --surface-2: #1c2630; --ink: #e8edf0; --ink-2: #c3ccd3;
    --muted: #93a0aa; --border: #2a3540; --grid: #212b35; --accent: #7fa8f2; --accent-soft: rgba(127, 168, 242, 0.13);
    --heat: 127, 168, 242; --away: #5a93ea; --home: #c66a33;
    --verde: #5cc98e; --verde-soft: rgba(76, 192, 130, 0.15); --amarillo: #e9bd4c; --amarillo-soft: rgba(229, 181, 58, 0.16);
    --gris: #a3adb5; --gris-soft: rgba(142, 153, 161, 0.16); --rojo: #f07a73; --rojo-soft: rgba(232, 98, 91, 0.16);
    --shadow: none; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.93em; }
  .muted { color: var(--muted); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: max(16px, 3vw); }

  /* barra superior */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklab, var(--ground) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .topbar .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; }
  .brand:hover { text-decoration: none; }
  .brand svg { width: 26px; height: 26px; flex: none; }
  .brand b { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; line-height: 1; }
  .brand b span { color: var(--home); }
  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.tabs a { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border-radius: 6px; }
  nav.tabs a:hover { color: var(--ink); text-decoration: none; background: var(--surface-2); }
  nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
  .stamp { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 640px) { .stamp { display: none; } nav.tabs { flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; } nav.tabs a { white-space: nowrap; flex: none; } .topbar .wrap { gap: 6px; } }

  main { padding-block: 22px 56px; display: flex; flex-direction: column; gap: 26px; }
  .eyebrow { font-family: var(--display); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .lede { color: var(--ink-2); max-width: 72ch; }
  .page-head { display: flex; flex-direction: column; gap: 6px; }
  .page-head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.4vw, 42px); line-height: 1.02; letter-spacing: 0.005em; }

  .notice { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .notice .ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--amarillo-soft); color: var(--amarillo); }

  .toolbar { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }

  /* semáforo */
  .light { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px 2px 7px; white-space: nowrap; }
  .light::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .light.Verde { color: var(--verde); background: var(--verde-soft); }
  .light.Amarillo { color: var(--amarillo); background: var(--amarillo-soft); }
  .light.Gris { color: var(--gris); background: var(--gris-soft); }
  .light.Rojo { color: var(--rojo); background: var(--rojo-soft); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 5px; padding: 1px 7px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .tag.ok { background: var(--verde-soft); color: var(--verde); }
  .tag.warn { background: var(--amarillo-soft); color: var(--amarillo); }
  .tag.bad { background: var(--rojo-soft); color: var(--rojo); }
  .tag.info { background: var(--accent-soft); color: var(--accent); }

  /* tarjetas de partido */
  .day { display: flex; flex-direction: column; gap: 12px; }
  .day h2 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 10px; }
  .day h2 small { font-family: var(--sans); font-size: 14px; font-weight: 400; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
  .game { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--ink); text-decoration: none; box-shadow: var(--shadow); }
  .game:hover { border-color: var(--accent); text-decoration: none; }
  .game .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .game .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .line { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
  .abbr { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.01em; display: flex; align-items: center; gap: 6px; }
  .abbr i { width: 4px; height: 22px; border-radius: 2px; flex: none; }
  .away-mark { background: var(--away); }
  .home-mark { background: var(--home); }
  .who { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .who .rec { font-size: 12.5px; color: var(--muted); }
  .who .sp { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .sp.tbd { color: var(--amarillo); font-weight: 600; }
  .prob { font-family: var(--display); font-weight: 600; font-size: 24px; text-align: right; font-variant-numeric: tabular-nums; }
  .prob.fav { color: var(--ink); }
  .prob.dog { color: var(--muted); }
  .splitbar { display: flex; gap: 2px; height: 8px; }
  .splitbar span { display: block; height: 100%; }
  .splitbar span:first-child { background: var(--away); border-radius: 4px 0 0 4px; }
  .splitbar span:last-child { background: var(--home); border-radius: 0 4px 4px 0; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-top: 1px solid var(--grid); padding-top: 9px; }
  .fact { display: flex; flex-direction: column; min-width: 0; }
  .fact b { font-family: var(--mono); font-weight: 500; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fact span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .bestline { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .bestline .pick { min-width: 0; }

  /* detalle */
  .back { font-size: 14px; }
  .board { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; box-shadow: var(--shadow); }
  .board .team { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .board .team.home { text-align: right; align-items: flex-end; }
  .board .team .big { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 7vw, 60px); line-height: 0.9; letter-spacing: 0.01em; }
  .board .team.away .big { color: var(--away); }
  .board .team.home .big { color: var(--home); }
  .board .team .nm { font-weight: 600; }
  .board .team .sub { font-size: 13px; color: var(--muted); }
  .board .mid { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 13.5px; color: var(--ink-2); max-width: 300px; }
  .board .mid .at { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--muted); }
  @media (max-width: 700px) { .board { grid-template-columns: 1fr 1fr; } .board .mid { grid-column: 1 / -1; order: 3; max-width: none; } }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .tile .big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 13px; color: var(--muted); }
  .mbar { display: grid; grid-template-columns: 58px 1fr 46px; gap: 8px; align-items: center; font-size: 13px; }
  .mbar .track { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; }
  .mbar .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--home); border-radius: 4px; }
  .mbar .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: 0.6; }

  section.block { display: flex; flex-direction: column; gap: 12px; }
  .block > h2, .sec-title { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.01em; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  details.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 12px; padding: 14px 16px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .n { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--accent); min-width: 26px; }
  details.sec > summary .t { font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: 0.01em; flex: 1; }
  details.sec > summary .s { font-size: 13px; color: var(--muted); text-align: right; }
  details.sec > summary::after { content: "+"; font-family: var(--mono); color: var(--muted); font-size: 18px; }
  details.sec[open] > summary::after { content: "−"; }
  details.sec > .body { padding: 0 16px 18px; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 560px) { details.sec > summary .s { display: none; } }
  h3.sub { font-size: 15.5px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
  h3.sub .code { font-family: var(--display); color: var(--muted); font-weight: 600; font-size: 15px; }
  .rule { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 14px; font-weight: 600; color: var(--ink); }
  .note { font-size: 13.5px; color: var(--ink-2); }
  ul.clean { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px; }
  .kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; text-align: right; font-weight: 600; }

  .tbl { overflow-x: auto; border: 1px solid var(--grid); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 6px 9px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.c, th.c { text-align: center; }
  td.num, .r.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.hl td { background: var(--accent-soft); }
  td.w { color: var(--verde); font-weight: 700; }
  td.l { color: var(--rojo); font-weight: 700; }

  /* linescore de carreras esperadas */
  .linescore td, .linescore th { text-align: center; padding: 6px 4px; min-width: 34px; }
  .linescore td:first-child, .linescore th:first-child { text-align: left; padding-left: 10px; min-width: 60px; }
  .linescore td.tot { font-weight: 700; border-left: 1px solid var(--grid); }
  .linescore .team-cell { font-family: var(--display); font-weight: 700; font-size: 18px; }

  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
  .chart .lbl { fill: var(--ink-2); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 5px 8px; border-radius: 6px; max-width: 260px; }

  .foot { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }
  .btn { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  /* índice de confianza */
  .ic { display: inline-flex; align-items: baseline; gap: 5px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .ic small { font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: 0; }
  .ic.Alta { color: var(--verde); background: var(--verde-soft); }
  .ic.Media { color: var(--accent); background: var(--accent-soft); }
  .ic.Baja { color: var(--amarillo); background: var(--amarillo-soft); }
  .ic.Muy { color: var(--gris); background: var(--gris-soft); }
  .picks2 { display: flex; flex-direction: column; gap: 5px; border-top: 1px solid var(--grid); padding-top: 9px; }
  .p2 { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 13px; }
  .p2 .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p2 .t b { font-weight: 700; }
  .toppicks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
  .pickcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pickcard .rank { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .pickcard h3 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; letter-spacing: 0.005em; }
  .pickcard .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
  .gauge { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--gris-soft) 0 40%, var(--amarillo-soft) 40% 55%, var(--accent-soft) 55% 70%, var(--verde-soft) 70% 100%); }
  .gauge i { position: absolute; top: -3px; width: 4px; height: 16px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
  .gauge-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .parts { display: grid; grid-template-columns: 118px 1fr 44px; gap: 4px 8px; align-items: center; font-size: 12.5px; }
  .parts .bar { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
  .parts .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
  .methods { display: flex; flex-wrap: wrap; gap: 6px; }
  .methods span { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; background: var(--surface-2); }
  .methods span b { font-family: var(--mono); font-weight: 500; }
  .formula { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }

  /* momios del usuario */
  .oddsbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13.5px; }
  .oddsbar select, .odds-in { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  .odds-in { width: 86px; font-family: var(--mono); }
  .odds-in:focus { border-color: var(--accent); outline: none; }
  .val { font-size: 12.5px; }
  .val.good { color: var(--verde); font-weight: 700; }
  .val.bad { color: var(--rojo); font-weight: 600; }
  .val.fair { color: var(--muted); }

  /* tarjeta de alineación: confirmado vs proyectado */
  .lineups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
  .card-lu { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card-lu header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-lu header b { font-family: var(--display); font-size: 22px; font-weight: 700; }
  .stamp-c, .stamp-p { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 9px; border-radius: 4px; }
  .stamp-c { color: var(--verde); border: 2px solid var(--verde); }
  .stamp-p { color: var(--amarillo); border: 2px dashed var(--amarillo); font-style: italic; }
  .lu-row { display: grid; grid-template-columns: 26px 38px minmax(0, 1fr) 26px auto; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
  .lu-row:last-child { border-bottom: 0; }

<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("mlbgs-data").textContent);
  const app = document.getElementById("app");
  const GAMES = D.games || [];
  const BY_PK = Object.fromEntries(GAMES.map((g) => [String(g.pk), g]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } },
  };

  // ---------------------------------------------------------------- formato
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isNum = (x) => typeof x === "number" && isFinite(x);
  const f = (x, d = 2) => (isNum(x) ? x.toFixed(d) : "—");
  const pc = (p, d = 0) => (isNum(p) ? (100 * p).toFixed(d) + "%" : "—");
  const pv = (x, d = 1) => (isNum(x) ? x.toFixed(d) + "%" : "—"); // ya viene en porcentaje
  const odds = (m) => (isNum(m) ? (m > 0 ? "+" : "") + Math.round(m) : "—");
  const signed = (x, d = 1) => (isNum(x) ? (x > 0 ? "+" : "") + x.toFixed(d) : "—");
  const hand = (h) => (h === "L" ? "Z" : h === "R" ? "D" : "—");
  const light = (l) => `<span class="light ${esc(l)}">${esc(l)}</span>`;
  const status = (s) => {
    const cls = { OK: "ok", disponible: "ok", derivado: "info", sustituido: "info", "no aplica": "", parcial: "warn", Alerta: "warn", faltante: "bad", Falla: "bad" }[s] ?? "";
    return `<span class="tag ${cls}">${esc(s)}</span>`;
  };
  const yes = (v) => `<span class="tag ${v === "Sí" ? "ok" : v === "No" ? "bad" : ""}">${esc(v)}</span>`;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" }); } catch { return iso; } };
  const fmtDateLong = (d) => { const dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }); };
  const fmtShort = (d) => { const dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("es-MX", { day: "numeric", month: "short" }); };
  const fmtStamp = (iso) => { try { return new Date(iso).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch { return iso; } };
  const dayLabel = (d) => {
    const t = D.meta.today;
    if (d === t) return "Hoy";
    const n = new Date(t + "T12:00:00"); n.setDate(n.getDate() + 1);
    if (d === n.toISOString().slice(0, 10)) return "Mañana";
    return fmtShort(d);
  };
  const table = (head, rows, opts = {}) => `<div class="tbl"><table${opts.cls ? ` class="${opts.cls}"` : ""}><thead><tr>${head.map((h) => `<th${h.startsWith("~") ? ' class="r"' : ""}>${esc(h.replace(/^~/, ""))}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${head.length}" class="muted">Sin datos</td></tr>`}</tbody></table></div>`;
  const tr = (cells, cls = "") => `<tr${cls ? ` class="${cls}"` : ""}>${cells.join("")}</tr>`;
  const td = (v, cls = "") => `<td${cls ? ` class="${cls}"` : ""}>${v}</td>`;
  const tdn = (v) => `<td class="r num">${v}</td>`;

  // ---------------------------------------------------------------- picks e índice de confianza
  const lvlCls = (l) => (l === "Muy baja" ? "Muy" : esc(l));
  const icBadge = (p) => `<span class="ic ${lvlCls(p.level)}" data-tip="Índice de confianza ${f(p.ic, 1)} de 100 · ${esc(p.level)}">IC ${Math.round(p.ic)} <small>${esc(p.level)}</small></span>`;
  const PART_NAMES = { fuerza: "Fuerza", consenso: "Consenso", datos: "Datos", estabilidad: "Estabilidad", contradicciones: "Sin contradicciones" };
  const PART_W = { fuerza: 0.35, consenso: 0.25, datos: 0.15, estabilidad: 0.15, contradicciones: 0.10 };
  const PART_TIP = {
    fuerza: "Ventaja de la probabilidad sobre el punto de equilibrio del precio (momio real o de referencia), a escala de 12 pp",
    consenso: "Acuerdo entre métodos independientes del framework: 1 − divergencia/12 pp (un solo método = 0.5)",
    datos: "Gate de completitud (9.3) del mercado y lineups confirmados",
    estabilidad: "Peso de la muestra tras la regresión a la media (5.7.4) y error del Monte Carlo",
    contradicciones: "1 − contradicciones activas/3 (secciones 5.6, 6.11, 7.7)",
  };
  const BOOKS = ["Draftea", "Playdoit", "Caliente", "Codere", "Strendus", "Betcris", "bet365"];
  const oddsStore = (() => { try { return JSON.parse(store.get("mlbgs-odds") || "{}"); } catch { return {}; } })();
  const saveOdds = () => store.set("mlbgs-odds", JSON.stringify(oddsStore));
  const bookSel = () => { const b = store.get("mlbgs-book"); return BOOKS.includes(b) ? b : "Draftea"; };
  // clave de un momio: partido | pick | casa (las versiones anteriores no guardaban la casa)
  const oddsKey = (pk, pick, book = bookSel()) => `${pk}|${pick}|${book}`;
  Object.keys(oddsStore).forEach((k) => {
    if (k.split("|").length !== 2) return;
    const nk = `${k}|${bookSel()}`;
    if (!(nk in oddsStore)) oddsStore[nk] = oddsStore[k];
    delete oddsStore[k];
  });
  const booksWithOdds = (pk) => new Set(Object.entries(oddsStore).filter(([k, v]) => k.startsWith(pk + "|") && parseOdds(v)).map(([k]) => k.split("|")[2])).size;

  function parseOdds(raw) {
    const t = String(raw || "").trim().replace(",", ".");
    if (!t) return null;
    const v = Number(t);
    if (!isFinite(v) || v === 0) return null;
    if (t.includes(".") && v > 1 && v < 30) return { dec: v, imp: 1 / v, am: v >= 2 ? (v - 1) * 100 : -100 / (v - 1) };
    if (Math.abs(v) >= 100) return { am: v, imp: v < 0 ? -v / (-v + 100) : 100 / (v + 100), dec: v < 0 ? 1 + 100 / -v : 1 + v / 100 };
    return null;
  }

  function evalOdds(p, raw) {
    const o = parseOdds(raw);
    if (!o) return null;
    const edge = p.p - o.imp;
    const fuerza = Math.max(0, Math.min(1, edge / 0.12));
    const datos = p.datosWithOdds != null ? p.datosWithOdds : p.parts.datos;   // con momio, el gate de la sección 7 queda cubierto
    const ic = p.ic + 100 * PART_W.fuerza * (fuerza - p.parts.fuerza) + 100 * PART_W.datos * (datos - p.parts.datos);
    const blocked = p.blockedWithOdds != null ? p.blockedWithOdds : p.blocked;
    const b = o.dec - 1;
    const kelly = Math.max(0, (b * p.p - (1 - p.p)) / b);
    let light = "Gris", why = "precio justo (edge < 3 pp)";
    if (edge < 0) { light = "Rojo"; why = "sin valor: el momio paga menos que la probabilidad"; }
    else if (edge >= 0.03) {
      if (blocked) { light = "Amarillo"; why = "hay valor, pero falta un dato obligatorio (gate: lineup, umpire, clima o abridor)"; }
      else if (p.guion === "No" || p.contradiction === "Alta") { light = "Amarillo"; why = "hay valor, pero el guion o las contradicciones no acompañan"; }
      else if (ic >= 55) { light = "Verde"; why = "modelo + guion + cuota con edge + baja contradicción"; }
      else { light = "Amarillo"; why = "hay valor, pero la confianza es baja"; }
    }
    return { ...o, edge, ic, kelly, light, why, level: ic >= 70 ? "Alta" : ic >= 55 ? "Media" : ic >= 40 ? "Baja" : "Muy baja" };
  }

  function oddsResult(p, raw) {
    const r = evalOdds(p, raw);
    if (!r) return `<span class="muted val">Escribe el momio de ${esc(bookSel())} (−150, +130 o 1.91)</span>`;
    const cls = r.edge >= 0.03 ? "good" : r.edge < 0 ? "bad" : "fair";
    return `<span class="val ${cls}">${r.edge >= 0 ? "+" : ""}${(100 * r.edge).toFixed(1)} pp</span> · implícita ${pc(r.imp, 1)} · ${light(r.light)} · IC ${Math.round(r.ic)} · ¼ Kelly ${pc(r.kelly / 4, 2)}<br><span class="muted val">${esc(r.why)}</span>`;
  }

  const oddsInput = (pk, p) => {
    const key = oddsKey(pk, p.pick);
    return `<input class="odds-in" id="odds-${esc(String(pk))}-${esc(p.pick).replace(/[^a-zA-Z0-9]/g, "")}" data-odds="${esc(key)}" inputmode="decimal" placeholder="momio" value="${esc(oddsStore[key] || "")}" aria-label="Momio de ${esc(p.pick)}">`;
  };

  function pickCard(p, pk, rank, graded) {
    const partsHtml = Object.entries(p.parts).map(([k, v]) => `<span data-tip="${esc(PART_TIP[k])}">${PART_NAMES[k]} <span class="muted">×${PART_W[k]}</span></span><span class="bar"><i style="width:${(v * 100).toFixed(0)}%"></i></span><span class="num">${v.toFixed(2)}</span>`).join("");
    const res = graded ? `<span class="${graded.won ? "won" : graded.won === false ? "lost" : "muted"}">${graded.won ? "✓ Acertado" : graded.won === false ? "✗ Fallado" : "Push / sin dato"}</span>` : "";
    return `<article class="pickcard" data-pick="${esc(JSON.stringify({ pick: p.pick, p: p.p, ic: p.ic, parts: p.parts, guion: p.guion, contradiction: p.contradiction, blocked: p.blocked, blockedWithOdds: p.blockedWithOdds, datosWithOdds: p.datosWithOdds }))}">
      <div class="rank">Pick principal ${rank} · ${esc(p.market)} ${res}</div>
      <h3>${esc(p.pick)}</h3>
      <div class="meta"><span>Probabilidad <b class="num">${pc(p.p, 1)}</b></span><span>Momio justo <b class="num">${odds(p.fair)}</b></span><span>Mínimo aceptable <b class="num">${odds(p.minPrice)}</b></span>${icBadge(p)}</div>
      <div class="gauge" role="img" aria-label="Índice de confianza ${Math.round(p.ic)} de 100"><i style="left:${Math.max(0, Math.min(100, p.ic))}%"></i></div>
      <div class="gauge-l"><span>0</span><span>40 Baja</span><span>55 Media</span><span>70 Alta</span><span>100</span></div>
      <div class="note"><b>Cómo se llegó:</b> ${esc(p.how)}</div>
      <div class="methods">${Object.entries(p.methods).map(([k, v]) => `<span>${esc(k)} <b>${pc(v, 1)}</b></span>`).join("")}</div>
      <div class="parts">${partsHtml}</div>
      <div class="formula">IC = ${esc(p.formula)} → ${f(p.ic, 1)} · punto de equilibrio ${pc(p.breakeven, 1)} (${p.priceIsReal ? "momio real" : "precio de referencia " + odds(p.refPrice)})</div>
      <div class="oddsbar"><span>Tu momio en ${esc(bookSel())}:</span>${oddsInput(pk, p)}<span class="odds-out">${oddsResult(p, oddsStore[oddsKey(pk, p.pick)])}</span></div>
    </article>`;
  }

  function picksTable(picks, pk, graded) {
    const g = Object.fromEntries((graded || []).map((x) => [x.pick, x]));
    return `<div class="oddsbar"><label for="book-${pk}">Casa de apuestas</label><select id="book-${pk}" data-book>${BOOKS.map((b) => `<option${b === bookSel() ? " selected" : ""}>${b}</option>`).join("")}</select><span class="muted">Escribe tu momio (americano −150 / +130 o decimal 1.91): se recalculan edge, índice de confianza, semáforo y Kelly. Se guarda solo en este navegador.</span></div>
      ${table(["#", "Mercado", "Pick", "~Prob.", "Confianza", "Fuerza · Consenso · Datos · Estab. · Contr.", "Métodos del framework", "~Justo", "Tu momio", "Valor con tu momio", ...(graded ? ["Resultado"] : [])],
      picks.map((p) => tr([tdn(p.rank), td(esc(p.market)), td(`<b>${esc(p.pick)}</b>`), tdn(pc(p.p, 1)), td(icBadge(p)),
        td(`<span class="num" style="font-size:12px">${Object.values(p.parts).map((v) => v.toFixed(2)).join(" · ")}</span>`),
        td(`<span class="muted" style="font-size:12px">${Object.entries(p.methods).map(([k, v]) => `${esc(k)} ${pc(v, 1)}`).join("<br>")}</span>`),
        tdn(odds(p.fair)), td(oddsInput(pk, p)), td(`<span class="odds-out">${oddsResult(p, oddsStore[oddsKey(pk, p.pick)])}</span>`),
        ...(graded ? [td(g[p.pick] ? (g[p.pick].won ? '<span class="won">✓</span>' : g[p.pick].won === false ? '<span class="lost">✗</span>' : "push") : "—", "c")] : [])],
        "").replace("<tr", `<tr data-pick="${esc(JSON.stringify({ pick: p.pick, p: p.p, ic: p.ic, parts: p.parts, guion: p.guion, contradiction: p.contradiction, blocked: p.blocked, blockedWithOdds: p.blockedWithOdds, datosWithOdds: p.datosWithOdds }))}"`)))}
      <p class="note muted">IC = 100 · (0.35·Fuerza + 0.25·Consenso + 0.15·Datos + 0.15·Estabilidad + 0.10·Sin contradicciones). Niveles: ≥70 Alta · 55–69 Media · 40–54 Baja · &lt;40 Muy baja. Sin momio real la fuerza se mide contra un precio de referencia típico; en moneyline un favorito real cuesta más: escribe tu momio para medir el valor.</p>`;
  }

  document.addEventListener("input", (e) => {
    const stk = e.target.closest("[data-stake]");
    if (stk) {
      store.set("mlbgs-stake", String(Number(stk.value.replace(",", ".")) || ""));
      const el = stk.closest(".slip");
      clearTimeout(stk._t);
      stk._t = setTimeout(() => { renderSlip(el, el.dataset.slip); const n = el.querySelector("[data-stake]"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 500);
      return;
    }
    const inp = e.target.closest("[data-odds]");
    if (!inp) return;
    oddsStore[inp.dataset.odds] = inp.value;
    saveOdds();
    const board = inp.closest(".felt");
    if (board) { refreshBoard(board); refreshStatus(); return; }
    const host = inp.closest("[data-pick]");
    if (!host) return;
    const p = JSON.parse(host.dataset.pick);
    const out = host.querySelector(".odds-out");
    if (out) out.innerHTML = oddsResult(p, inp.value);
  });
  document.addEventListener("change", (e) => {
    const sel = e.target.closest("[data-book]");
    if (!sel) return;
    store.set("mlbgs-book", sel.value);
    route();
  });

  // ---------------------------------------------------------------- lineups, bullpen, importancia y noticias
  function lineupCard(team, lu, vsName) {
    if (!lu) return `<div class="card-lu"><header><b>${esc(team)}</b><span class="stamp-p">Sin datos</span></header><p class="note muted">No hay lineup publicado ni juegos recientes para proyectarlo.</p></div>`;
    const conf = lu.status === "Confirmado";
    return `<div class="card-lu"><header><b>${esc(team)}</b>${conf ? '<span class="stamp-c">✓ Confirmado</span>' : `<span class="stamp-p">Proyectado · ${pc(lu.confidence)}</span>`}</header>
      <p class="note muted">${conf ? "Lineup oficial publicado por el club." : `Predicción con sus últimos ${lu.games} juegos (${lu.sameGames} contra abridor de la misma mano, doble peso; recientes pesan más). El % es la frecuencia ponderada con que ese jugador abrió.`}${vsName && vsName !== "Por anunciar" ? ` Contra ${esc(vsName)}.` : " Abridor rival por anunciar: sin filtro de mano."}</p>
      ${lu.rows.map((r, i) => `<div class="lu-row ${conf ? "conf" : "proj"}"><span class="slot">${i + 1}</span><span class="pos">${esc(r.pos || "—")}</span><span class="nm">${esc(r.name)}</span><span class="pos">${esc(r.bats || "")}</span><span class="st">${r.ops != null ? "OPS " + f(r.ops, 3) : ""}${r.k != null ? " · K% " + pv(r.k) : ""}${!conf && r.prob != null ? ` <span class="pr">${pc(r.prob)}</span>` : ""}</span></div>`).join("")}
      <p class="formula">OBP ${f(lu.obp, 3)} · SLG ${f(lu.slg, 3)} · K% ${pv(lu.k)} · Barrel% ${f(lu.barrel, 1)} · factor vs ofensiva habitual ${f(lu.ratio, 3)}</p></div>`;
  }

  function bullpenTable(team, rows, hasOfficial) {
    const chip = (a) => `<span class="tag ${a === "Disponible" ? "ok" : a === "Dudoso" ? "warn" : a === "No disponible" ? "bad" : ""}">${esc(a)}</span>`;
    return `<h3 class="sub">${esc(team)} <span class="code">${rows.length} brazos · ${hasOfficial ? "lista oficial del partido + predicción de uso" : "roster activo + predicción de uso"}</span></h3>
      ${table(["Pitcher", "Mano", "Rol", "Estado", "~P(uso)", "~ERA", "~FIP", "~K%", "~BB%", "~SV/HLD", "Último uso", "~Pitcheos 3d"], rows.map((r) => tr([
        td(`<span class="${r.official === false ? "pen-pred" : "pen-off"}">${esc(r.name)}</span>${r.official ? ' <span class="tag ok" data-tip="Aparece en la lista oficial de bullpen del partido">oficial</span>' : ""}`),
        td(hand(r.throws)), td(esc(r.role)), td(chip(r.available)), tdn(pc(r.pUse)), tdn(f(r.era)), tdn(f(r.fip)), tdn(pc(r.k, 1)), tdn(pc(r.bb, 1)),
        tdn(`${r.sv}/${r.hld}`), td(r.lastDate ? fmtShort(r.lastDate) + (r.lastPitches != null ? ` (${r.lastPitches})` : "") : "—", "num"), tdn(r.p3)], "pen-row")))}`;
  }

  function importanceBlock(imp) {
    if (!imp) return "";
    return `<div class="panel"><h3 class="sub">¿Qué se juegan en la tabla? <span class="code">Importancia ${esc(imp.level)}</span></h3>
      ${table(["Equipo", "Récord", "División", "~JD", "~Comodín (rank · JD)", "Estado", "~P(playoffs)", "~P(división)", "~P(bye)", "~Δ playoffs si gana vs pierde"], imp.rows.map((r) => tr([
        td(`<b>${esc(r.team)}</b>`), tdn(`${r.w}-${r.l}`), td(esc((r.division || "").replace("American League", "AL").replace("National League", "NL")), "muted"), tdn(esc(r.gb)), tdn(`${esc(r.wcRank || "—")} · ${esc(r.wcgb || "—")}`),
        td(`<span class="tag ${r.status === "Clasificado" ? "ok" : r.status === "Eliminado" ? "bad" : "info"}">${esc(r.status)}</span>`),
        tdn(pc(r.pPlayoffs, 1)), tdn(pc(r.pDivision, 1)), tdn(pc(r.pBye, 1)), tdn(r.leverage ? signed(100 * r.leverage.po.delta, 1) + " pp" : "—")])))}
      ${imp.notes.length ? `<ul class="clean">${imp.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <p class="formula">${esc(imp.method)}</p></div>`;
  }

  function newsBlock(news) {
    if (!news) return "";
    const one = (n) => `<div class="panel"><h3 class="sub">Noticias ${esc(n.team)} <span class="code">movimientos oficiales, 21 días</span></h3>
      ${n.items.length ? `<ul class="clean">${n.items.slice(0, 8).map((x) => `<li><span class="num muted">${fmtShort(x.date)}</span> <span class="tag ${x.impact === "Alta" ? "warn" : ""}">${esc(x.type)}</span> ${esc(x.text)}</li>`).join("")}</ul>` : '<p class="note muted">Sin movimientos recientes.</p>'}
      ${n.injured && n.injured.length ? `<p class="note"><b>Lista de lesionados:</b> ${n.injured.slice(0, 12).map((x) => `${esc(x.name)} (${esc(x.pos)}, ${esc(x.status)})`).join(" · ")}</p>` : ""}</div>`;
    return `<div class="two">${one(news.away)}${one(news.home)}</div>`;
  }


  // ---------------------------------------------------------------- estado de cada sección (verde = confirmado y al día)
  const FIELD_OK = new Set(["OK", "disponible", "derivado", "sustituido", "no aplica"]);
  const SEC_SHORT = ["Contexto", "Historial", "Abridores", "Bullpen", "Modelo", "Over/Under", "Momios", "Auditoría", "Completitud", "Algoritmo"];
  const worst = (...xs) => (xs.includes("miss") ? "miss" : xs.includes("part") ? "part" : "ok");
  const fieldsSt = (list) => (list.some((x) => x.status === "faltante") ? "miss" : list.some((x) => !FIELD_OK.has(x.status)) ? "part" : "ok");
  const fieldsWhy = (list) => list.filter((x) => !FIELD_OK.has(x.status)).map((x) => `${x.field}: ${x.status}`).join(" · ");
  const ST_LABEL = { ok: "Confirmado", part: "Parcial", miss: "Falta dato" };

  function sectionStatus(g) {
    const S = g.sections, F = S.s9.fields, by = (k) => F.filter((x) => x.sec === k);
    const lc = g.summary.lineupsConfirmed || {};
    const nLu = (lc.away ? 1 : 0) + (lc.home ? 1 : 0);
    const nb = S.s7.hasOdds ? S.s7.nBooks : booksWithOdds(g.pk);
    const oddsSt = nb >= 2 ? "ok" : nb === 1 ? "part" : "miss";
    const missNoOdds = F.filter((x) => x.status === "faltante" && x.sec !== "7").length;
    const gateMissing = missNoOdds + (oddsSt === "ok" ? 0 : 1);
    const at = `corte ${fmtTime(D.meta.generatedAt)}`;
    const mk = (st, why, label) => ({ st, why, label: label || ST_LABEL[st] });
    const st = {};
    st.lu = mk(nLu === 2 ? "ok" : "part", nLu === 2 ? "Lineups oficiales de ambos equipos" : nLu === 1 ? "Un lineup oficial y otro proyectado" : "Lineups proyectados con los últimos 10 juegos", nLu === 2 ? "Confirmado" : "Proyectado");
    st[1] = mk("ok", `Standings oficiales · ${at}`, "Al día");
    const s2 = fieldsSt(by("1-2"));
    st[2] = mk(s2, fieldsWhy(by("1-2")) || "Récords, splits y H2H completos", s2 === "ok" ? "Al día" : undefined);
    const s3 = g.summary.probables.away.missing || g.summary.probables.home.missing ? "miss" : fieldsSt(by("3"));
    st[3] = mk(s3, s3 === "miss" ? "Abridor por anunciar" : fieldsWhy(by("3")) || "Abridores confirmados con game logs y Savant");
    const hasOff = S.s4.officialList && (S.s4.officialList.away || S.s4.officialList.home);
    st[4] = mk(worst(fieldsSt(by("4")), hasOff ? "ok" : "part"), hasOff ? "Lista oficial de bullpen publicada + fatiga de 3 días" : "Lista oficial de bullpen aún no publicada: uso predicho por rol y fatiga");
    st[5] = mk(worst(fieldsSt(by("5")), nLu === 2 ? "ok" : "part"), nLu === 2 ? "λ con lineups confirmados y park factor" : "λ con lineups proyectados", nLu === 2 ? "Confirmado" : "Proyectado");
    st[6] = mk(fieldsSt(by("6")), fieldsWhy(by("6")) || "Lineups, clima y umpire confirmados");
    st[7] = mk(oddsSt, nb ? `Momios de ${nb} casa${nb === 1 ? "" : "s"}${S.s7.hasOdds ? " (The Odds API)" : " capturados por ti"}` : "Sin momios: captúralos en el tablero de la sección 7", nb >= 2 ? "Con momios" : nb === 1 ? "1 casa" : "Sin momios");
    const alerts = S.s8.audit.filter((x) => x.status === "Alerta").length;
    st[8] = mk(gateMissing ? "part" : "ok", `${alerts} alerta${alerts === 1 ? "" : "s"} de ${S.s8.audit.length} filtros${gateMissing ? " · depende de datos faltantes" : ""}`, gateMissing ? "Parcial" : "Al día");
    st[9] = mk(missNoOdds ? "miss" : gateMissing ? "part" : "ok", `${F.length - gateMissing} de ${F.length} campos obligatorios`, gateMissing ? `${gateMissing} faltante${gateMissing === 1 ? "" : "s"}` : "Completo");
    const ph = S.s10.filter((x) => x.status !== "OK").length;
    st[10] = mk(ph ? "part" : "ok", ph ? `${ph} fase${ph === 1 ? "" : "s"} con alerta` : "Las 7 fases completas", ph ? "Parcial" : "Al día");
    return st;
  }

  function secMap(ST) {
    const items = [["lu", "L", "Alineaciones", ST.lu], ...SEC_SHORT.map((t, i) => [`s${i + 1}`, String(i + 1), t, ST[i + 1]])];
    const nOk = items.filter((x) => x[3].st === "ok").length;
    return `<section class="panel secpanel" aria-label="Estado de los datos">
      <div class="sp-head"><h2 class="sec-title">Estado de los datos</h2><span class="stpill ${nOk === items.length ? "ok" : "part"}">${nOk} de ${items.length} en verde</span><span class="fresh">Corte de datos: ${fmtStamp(D.meta.generatedAt)}</span></div>
      <div class="sec-map">${items.map(([id, n, t, s]) => `<a href="#${id}" data-jump="${id}" data-tip="${esc(s.label)}: ${esc(s.why)}"><span class="dot ${s.st}"></span><b>${n}</b>${esc(t)}</a>`).join("")}</div>
      <div class="legend-st"><span><span class="dot ok"></span>Verde: dato oficial, confirmado y al día</span><span><span class="dot part"></span>Ámbar: parcial, proyectado o sustituido</span><span><span class="dot miss"></span>Rojo: falta un dato obligatorio</span></div>
    </section>`;
  }

  const stPill = (s) => `<span class="stpill ${s.st}" data-tip="${esc(s.why)}">${esc(s.label)}</span>`;

  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-jump]");
    if (!a) return;
    e.preventDefault();
    const el = document.getElementById(a.dataset.jump);
    if (!el) return;
    if (el.tagName === "DETAILS") el.open = true;
    el.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  // ---------------------------------------------------------------- tablero de momios (estilo casino)
  const slip = (() => { try { return JSON.parse(store.get("mlbgs-slip") || "[]"); } catch { return []; } })();
  const saveSlip = () => store.set("mlbgs-slip", JSON.stringify(slip));
  const stake = () => { const v = Number(store.get("mlbgs-stake")); return v > 0 ? v : 100; };

  function boardRows(g) {
    const picksBy = Object.fromEntries((g.picks || []).map((p) => [p.pick, p]));
    const seen = new Set();
    const groups = new Map();
    const add = (market, r) => { if (!groups.has(market)) groups.set(market, []); groups.get(market).push(r); };
    g.sections.s7.fair.forEach((r) => { seen.add(r.pick); add(r.market, { market: r.market, pick: r.pick, p: r.p, fair: r.fair, minPrice: r.minPrice, obj: picksBy[r.pick] || null }); });
    (g.picks || []).filter((p) => !seen.has(p.pick)).forEach((p) => add(p.market, { market: p.market, pick: p.pick, p: p.p, fair: p.fair, minPrice: p.minPrice, obj: p }));
    return groups;
  }

  function apiPrice(b, row, g) {
    const a = g.teams.away.abbr, h = g.teams.home.abbr;
    if (row.market === "Moneyline") return row.pick === a ? b.mlAway : row.pick === h ? b.mlHome : null;
    if (row.market === "Run Line") {
      const [t, pt] = row.pick.split(" ");
      const x = t === a ? b.rlAway : t === h ? b.rlHome : null;
      return x && Number(x.point) === Number(pt) ? x.price : null;
    }
    if (row.market === "Total completo") {
      const m = row.pick.match(/^(Over|Under) ([\d.]+)$/);
      const x = m ? (m[1] === "Over" ? b.over : b.under) : null;
      return x && Number(x.point) === Number(m[2]) ? x.price : null;
    }
    return null;
  }

  // valor de un momio para una fila del tablero: con el pick completo recalcula IC y semáforo
  function tileEval(row, raw) {
    if (row.obj) return evalOdds(row.obj, raw);
    const o = parseOdds(raw);
    if (!o) return null;
    const edge = row.p - o.imp;
    return { ...o, edge, ic: null, light: edge < 0 ? "Rojo" : edge >= 0.03 ? "Amarillo" : "Gris", why: edge >= 0.03 ? "hay valor, pero este mercado no está entre los picks evaluados con IC" : edge < 0 ? "sin valor" : "precio justo" };
  }

  function oddsBoard(g) {
    const S = g.sections.s7;
    const api = (S.books || []).filter((b) => b.book);
    const cols = [...BOOKS.map((b) => ({ book: b })), ...api.filter((b) => !BOOKS.includes(b.book)).map((b) => ({ book: b.book, api: b }))];
    api.forEach((b) => { const c = cols.find((x) => x.book === b.book); if (c) c.api = b; });
    const mode = store.get("mlbgs-board-mode") || "capturar";
    const groups = boardRows(g);
    let body = "";
    groups.forEach((rows, market) => {
      body += `<tr class="mk"><td colspan="${cols.length + 3}">${esc(market)}</td></tr>`;
      rows.forEach((r) => {
        const data = esc(JSON.stringify({ pick: r.pick, p: r.p, market: r.market, obj: r.obj ? { pick: r.obj.pick, p: r.obj.p, ic: r.obj.ic, parts: r.obj.parts, guion: r.obj.guion, contradiction: r.obj.contradiction, blocked: r.obj.blocked, blockedWithOdds: r.obj.blockedWithOdds, datosWithOdds: r.obj.datosWithOdds } : null }));
        body += `<tr data-row="${data}"><td><span class="pp">${esc(r.pick)}</span>${r.obj ? ` <span class="ic ${lvlCls(r.obj.level)}" style="font-size:12px">IC ${Math.round(r.obj.ic)}</span>` : ""}</td>
          <td class="fairc">${pc(r.p, 1)}<br>justo ${odds(r.fair)}</td>
          ${cols.map((c) => {
            const key = oddsKey(g.pk, r.pick, c.book);
            const ap = c.api ? apiPrice(c.api, r, g) : null;
            if (isNum(ap)) return `<td class="c"><input class="otile api" readonly value="${odds(ap)}" data-sel="${esc(key)}" data-bk="${esc(c.book)}" aria-label="${esc(r.pick)} en ${esc(c.book)}: ${odds(ap)}"></td>`;
            return `<td class="c"><input class="otile" data-odds="${esc(key)}" data-sel="${esc(key)}" data-bk="${esc(c.book)}" value="${esc(oddsStore[key] || "")}" inputmode="decimal" placeholder="—"${mode === "elegir" ? " readonly" : ""} aria-label="Momio de ${esc(r.pick)} en ${esc(c.book)}"></td>`;
          }).join("")}
          <td class="bestc"></td></tr>`;
      });
    });
    return `<div class="felt" data-board="${g.pk}" data-mode="${mode}">
      <div class="felt-head"><h3>Tablero de momios</h3>
        <div class="seg" role="group" aria-label="Modo del tablero"><button type="button" data-mode-set="capturar" aria-pressed="${mode === "capturar"}">✎ Capturar momios</button><button type="button" data-mode-set="elegir" aria-pressed="${mode === "elegir"}">☑ Elegir apuesta</button></div></div>
      <p style="font-size:13px">${S.hasOdds ? `Momios de ${S.nBooks} casa(s) conectadas por API y casillas libres para las casas mexicanas.` : "Las casas mexicanas no publican API: cada casilla queda libre para que escribas el momio que ves en la app (americano −150 / +130 o decimal 1.91)."} Verde = edge ≥ 3 pp sobre la probabilidad del modelo · dorado = mejor precio del renglón · rojo = paga menos de lo que vale. En <b>Elegir apuesta</b> toca un momio para mandarlo al boleto.</p>
      <div class="tbl"><table><thead><tr><th>Selección</th><th>Modelo</th>${cols.map((c) => `<th class="c">${esc(c.book)}${c.api ? " ·API" : ""}</th>`).join("")}<th>Mejor precio</th></tr></thead><tbody>${body}</tbody></table></div>
      <div class="slip" data-slip="${g.pk}"></div>
    </div>`;
  }

  function refreshBoard(el) {
    if (!el) return;
    const pk = el.dataset.board;
    el.querySelectorAll("tr[data-row]").forEach((trEl) => {
      const row = JSON.parse(trEl.dataset.row);
      let best = null;
      trEl.querySelectorAll(".otile").forEach((t) => {
        const r = tileEval(row, t.value);
        t.classList.remove("val", "neg", "best", "sel");
        if (!r) return;
        if (r.edge >= 0.03) t.classList.add("val");
        else if (r.edge < 0) t.classList.add("neg");
        if (!best || r.dec > best.r.dec) best = { r, t };
        if (slip.includes(t.dataset.sel)) t.classList.add("sel");
      });
      if (best) best.t.classList.add("best");
      const cell = trEl.querySelector(".bestc");
      cell.innerHTML = best ? `<b class="num">${odds(best.r.am)}</b> <span class="muted">${esc(best.t.dataset.bk)}</span><br><span class="${best.r.edge >= 0.03 ? "good" : best.r.edge < 0 ? "badv" : ""}">${best.r.edge >= 0 ? "+" : ""}${(100 * best.r.edge).toFixed(1)} pp</span> ${light(best.r.light)}` : '<span class="muted">—</span>';
    });
    renderSlip(el.querySelector(".slip"), pk);
  }

  function renderSlip(el, pk) {
    if (!el) return;
    const board = el.closest(".felt");
    const mine = slip.filter((k) => k.startsWith(pk + "|"));
    const st = stake();
    if (!mine.length) { el.innerHTML = `<b style="color:var(--gold);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase">Boleto</b><span class="muted" style="font-size:13px">Vacío. Cambia a «Elegir apuesta» y toca un momio para agregarlo. Se guarda solo en este navegador.</span>`; return; }
    let evSum = 0;
    const rows = mine.map((k) => {
      const t = board.querySelector(`.otile[data-sel="${CSS.escape(k)}"]`);
      if (!t) return "";
      const row = JSON.parse(t.closest("tr").dataset.row);
      const r = tileEval(row, t.value);
      if (!r) return "";
      const ev = st * (row.p * r.dec - 1);
      evSum += ev;
      return `<div class="row"><span><b>${esc(row.pick)}</b> <span class="muted">${esc(t.dataset.bk)} · ${odds(r.am)} · modelo ${pc(row.p, 1)} · ${r.edge >= 0 ? "+" : ""}${(100 * r.edge).toFixed(1)} pp${isNum(r.ic) ? ` · IC ${Math.round(r.ic)}` : ""}</span> ${light(r.light)}</span><span class="num">paga ${(st * r.dec).toFixed(0)} · VE <span class="${ev >= 0 ? "good" : "badv"}">${ev >= 0 ? "+" : ""}${ev.toFixed(1)}</span></span><button type="button" class="x" data-unslip="${esc(k)}" aria-label="Quitar ${esc(row.pick)} del boleto">✕</button></div>`;
    }).join("");
    el.innerHTML = `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><b style="color:var(--gold);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase">Boleto · ${mine.length} ${mine.length === 1 ? "selección" : "selecciones"}</b><label style="font-size:13px">Monto por apuesta <input data-stake inputmode="decimal" value="${st}" aria-label="Monto por apuesta"></label></div>
      ${rows}
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span class="muted" style="font-size:12.5px">VE = monto × (p<sub>modelo</sub> × momio decimal − 1). Apuestas sencillas: el framework (5.7.10) desaconseja combinar picks del mismo partido porque están correlacionados.</span><span class="num">VE total <b class="${evSum >= 0 ? "good" : "badv"}">${evSum >= 0 ? "+" : ""}${evSum.toFixed(1)}</b></span></div>`;
  }

  document.addEventListener("click", (e) => {
    const m = e.target.closest("[data-mode-set]");
    if (m) {
      const board = m.closest(".felt");
      const mode = m.dataset.modeSet;
      store.set("mlbgs-board-mode", mode);
      board.dataset.mode = mode;
      board.querySelectorAll("[data-mode-set]").forEach((b) => b.setAttribute("aria-pressed", b === m));
      board.querySelectorAll(".otile:not(.api)").forEach((t) => { t.readOnly = mode === "elegir"; });
      return;
    }
    const x = e.target.closest("[data-unslip]");
    if (x) {
      const i = slip.indexOf(x.dataset.unslip);
      if (i >= 0) slip.splice(i, 1);
      saveSlip();
      refreshBoard(x.closest(".felt"));
      return;
    }
    const t = e.target.closest(".felt .otile");
    if (t && (t.classList.contains("api") || t.closest(".felt").dataset.mode === "elegir")) {
      if (!parseOdds(t.value)) return;
      const k = t.dataset.sel, i = slip.indexOf(k);
      if (i >= 0) slip.splice(i, 1); else slip.push(k);
      saveSlip();
      refreshBoard(t.closest(".felt"));
    }
  });

      <div class="line"><span class="abbr"><i class="home-mark"></i>${esc(h.abbr)}</span><span class="who"><span class="rec">${esc(h.name)} · ${h.w}-${h.l}</span>${sp(s.probables.home)}</span><span class="prob ${ph > 0.5 ? "fav" : "dog"}">${pc(ph)}</span></div>

      <div class="picks2">${(s.topPicks || []).map((p) => `<div class="p2">${icBadge(p)}<span class="t"><b>${esc(p.pick)}</b> <span class="muted">${esc(p.market)} · ${pc(p.p)} · justo ${odds(p.fair)}</span></span></div>`).join("") || `<span class="muted">${bestTxt}</span>`}</div>

  function viewGames() {
    const dates = [...new Set(GAMES.map((g) => g.date))].sort();

    if (sel !== "todos" && !dates.includes(sel)) sel = dates[0] || "todos";

      app.innerHTML = `
        <div class="page-head">

          <p class="lede">Cada juego pasa por las 10 secciones del framework: contexto, historial, abridores con regresión a la media, bullpen y fatiga, modelo de carreras (Poisson / Binomial Negativa), Over/Under, valor contra el mercado y auditoría de contradicciones. El semáforo nunca es Verde si falta un dato obligatorio.</p>
        </div>
        ${noOdds ? `<div class="notice"><span class="ic">!</span><div><b>Sin momios conectados.</b> Sin cuotas no hay edge calculable, así que el framework marca los mercados en Gris («esperar cuota») o Rojo. Cada pick trae su <b>momio justo</b> y el <b>mínimo aceptable</b> para compararlo con tu casa de apuestas. Para activar el valor automático agrega el secreto <code>ODDS_API_KEY</code> (The Odds API) al repositorio.</div></div>` : ""}
        <div class="toolbar">

  // ---------------------------------------------------------------- gráficas
  function distChart(pmf, lines, proj) {
    const W = 560, H = 190, L = 34, R = 10, T = 14, B = 30;
    const n = pmf.length, max = Math.max(...pmf) * 1.12;
    const bw = (W - L - R) / n;
    const y = (v) => T + (H - T - B) * (1 - v / max);
    const x = (k) => L + k * bw;
    const ticks = [0, 0.05, 0.1, 0.15].filter((t) => t <= max);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución de carreras totales">`;
    ticks.forEach((t) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`; });
    pmf.forEach((p, k) => {
      const h = Math.max(0, y(0) - y(p));
      s += `<rect x="${x(k) + 1}" y="${y(p)}" width="${bw - 2}" height="${h}" rx="2" fill="${k > 8.5 ? "var(--home)" : "var(--away)"}" opacity="0.85" data-tip="${k} carreras: ${(p * 100).toFixed(1)}%"/>`;
      if (k % 2 === 0) s += `<text x="${x(k) + bw / 2}" y="${H - 12}" text-anchor="middle">${k}</text>`;
    });
    lines.forEach((ln) => { const lx = L + (ln + 0.5) * bw; s += `<line x1="${lx}" x2="${lx}" y1="${T}" y2="${y(0)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text class="lbl" x="${lx}" y="${T - 3}" text-anchor="middle">${ln}</text>`; });
    const px = L + (proj + 0.5) * bw;
    s += `<line x1="${px}" x2="${px}" y1="${T}" y2="${y(0)}" stroke="var(--accent)" stroke-width="2"/>`;
    s += `<text x="${L}" y="${H - 1}">carreras totales</text></svg>`;
    return s;
  }

  function linescore(g) {
    const d = g.sections.s6.development;
    const max = Math.max(...d.perInning.away, ...d.perInning.home, 0.01);
    const cell = (v) => `<td class="num" style="background: rgba(var(--heat), ${(0.08 + 0.5 * v / max).toFixed(3)})" data-tip="${f(v, 2)} carreras esperadas">${f(v, 2)}</td>`;
    const row = (side) => `<tr><td class="team-cell"><span class="abbr" style="font-size:18px"><i class="${side}-mark" style="height:14px"></i>${esc(g.teams[side].abbr)}</span></td>${d.perInning[side].map(cell).join("")}<td class="num tot">${f(d.final[side], 1)}</td><td class="num">${f(d.f5[side], 1)}</td><td class="num">${f(d.f3[side], 1)}</td></tr>`;
    return `<div class="tbl"><table class="linescore"><thead><tr><th>Equipo</th>${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => `<th>${i}</th>`).join("")}<th>R</th><th>F5</th><th>F3</th></tr></thead><tbody>${row("away")}${row("home")}</tbody></table></div>`;
  }

  function methodBars(g) {
    const t = g.sections.s5.triangulation, h = g.teams.home.abbr;
