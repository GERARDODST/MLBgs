  // ---------------------------------------------------------------- vista: PRISMA (probabilidad bayesiana)
  function strengthScatter(S, aAbbr, hAbbr) {
    const W = 640, H = 380, L = 54, R = 16, T = 16, B = 44;
    const xs = S.map((s) => s.att), ys = S.map((s) => s.def);
    const pad = 0.025;
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    const X = (v) => L + (W - L - R) * (v - x0) / (x1 - x0), Y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
    let sv = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ataque contra defensa de los 30 equipos">`;
    for (let v = Math.ceil(x0 * 20) / 20; v <= x1; v += 0.05) sv += `<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}" stroke="var(--grid)"/><text x="${X(v)}" y="${H - B + 14}" text-anchor="middle">${v >= 0 ? "+" : ""}${v.toFixed(2)}</text>`;
    for (let v = Math.ceil(y0 * 20) / 20; v <= y1; v += 0.05) sv += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v >= 0 ? "+" : ""}${v.toFixed(2)}</text>`;
    sv += `<line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="4 3"/><line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
    sv += `<text class="lbl" x="${W - R}" y="${T + 10}" text-anchor="end">mejor ataque y defensa ↗</text><text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">ataque (log carreras anotadas vs liga)</text><text x="12" y="${(T + H - B) / 2}" transform="rotate(-90 12 ${(T + H - B) / 2})" text-anchor="middle">defensa (log carreras evitadas)</text>`;
    S.forEach((s) => {
      const hl = s.team === aAbbr ? "var(--away)" : s.team === hAbbr ? "var(--home)" : null;
      if (hl) {
        const ex = 1.645 * s.attSd, ey = 1.645 * s.defSd;
        sv += `<line x1="${X(s.att - ex)}" x2="${X(s.att + ex)}" y1="${Y(s.def)}" y2="${Y(s.def)}" stroke="${hl}" stroke-width="2"/><line x1="${X(s.att)}" x2="${X(s.att)}" y1="${Y(s.def - ey)}" y2="${Y(s.def + ey)}" stroke="${hl}" stroke-width="2"/>`;
      }
      sv += `<circle cx="${X(s.att)}" cy="${Y(s.def)}" r="${hl ? 6 : 3.5}" fill="${hl || "var(--muted)"}" opacity="${hl ? 1 : 0.55}" stroke="var(--surface)" stroke-width="${hl ? 2 : 0}" data-tip="${esc(s.team)}: ataque ${signed(s.att, 3)} ± ${f(s.attSd, 3)} · defensa ${signed(s.def, 3)} ± ${f(s.defSd, 3)} · neto ${signed(s.net, 3)}"/>`;
      sv += `<text x="${X(s.att) + (hl ? 9 : 6)}" y="${Y(s.def) + 3.5}" style="${hl ? `fill:${hl};font-weight:700;font-size:12.5px` : "font-size:9.5px"}">${esc(s.team)}</text>`;
    });
    return sv + "</svg>";
  }

  // densidad de P(local) a partir de los 101 cuantiles de la posterior (derivada numérica suavizada)
  function posteriorDensity(post, pMarket) {
    // estimación por kernel gaussiano usando los 101 cuantiles como muestra representativa
    const q = post.quantiles;
    const bw = 0.55 * post.sd;
    const x0 = q[0] - 2 * bw, x1 = q[100] + 2 * bw;
    const sm = [...Array(121).keys()].map((k) => { const x = x0 + (x1 - x0) * k / 120; return [x, q.reduce((s, v) => s + Math.exp(-0.5 * ((x - v) / bw) ** 2), 0) / (q.length * bw * Math.sqrt(2 * Math.PI))]; });
    const W = 620, H = 190, L = 40, R = 12, T = 12, B = 30;
    const lo = Math.min(x0, 0.45), hi = Math.max(x1, 0.55), ymax = Math.max(...sm.map((p) => p[1])) * 1.1;
    const X = (v) => L + (W - L - R) * (v - lo) / (hi - lo), Y = (v) => T + (H - T - B) * (1 - v / ymax);
    const inCI = sm.filter((p) => p[0] >= post.q05 && p[0] <= post.q95);
    let sv = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución posterior de la probabilidad de victoria del local">`;
    for (let v = Math.ceil(lo * 50) / 50; v <= hi + 1e-9; v += 0.02) sv += `<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}" stroke="var(--grid)"/><text x="${X(v)}" y="${H - B + 14}" text-anchor="middle">${Math.round(v * 100)}%</text>`;
    sv += `<polygon points="${X(sm[0][0])},${Y(0)} ${sm.map((p) => `${X(p[0])},${Y(p[1])}`).join(" ")} ${X(sm[sm.length - 1][0])},${Y(0)}" fill="rgba(var(--heat), 0.12)"/>`;
    if (inCI.length) sv += `<polygon points="${X(inCI[0][0])},${Y(0)} ${inCI.map((p) => `${X(p[0])},${Y(p[1])}`).join(" ")} ${X(inCI[inCI.length - 1][0])},${Y(0)}" fill="rgba(var(--heat), 0.32)"/>`;
    sv += `<polyline points="${sm.map((p) => `${X(p[0])},${Y(p[1])}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    sv += `<line x1="${X(post.mean)}" x2="${X(post.mean)}" y1="${T}" y2="${H - B}" stroke="var(--home)" stroke-width="2"/><text class="lbl" x="${X(post.mean) + 4}" y="${T + 10}">media ${pc(post.mean, 1)}</text>`;
    sv += `<line x1="${X(0.5)}" x2="${X(0.5)}" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-dasharray="3 3"/>`;
    if (isNum(pMarket)) sv += `<line x1="${X(pMarket)}" x2="${X(pMarket)}" y1="${T}" y2="${H - B}" stroke="var(--verde)" stroke-width="2" stroke-dasharray="5 3"/><text x="${X(pMarket) + 4}" y="${T + 24}" style="fill:var(--verde)">implícita ${pc(pMarket, 1)}</text>`;
    sv += `<text x="${L}" y="${H - 2}">P(local gana) según cada muestra de la posterior · banda oscura = intervalo creíble 90%</text>`;
    return sv + "</svg>";
  }

  function stepsChart(steps, hAbbr) {
    const W = 640, H = 220, L = 44, R = 16, T = 22, B = 58;
    const ps = steps.map((s) => s.pHome);
    const lo = Math.min(0.45, ...ps) - 0.01, hi = Math.max(0.55, ...ps) + 0.01;
    const IN = 64;
    const X = (i) => L + IN + (W - L - R - 2 * IN) * (steps.length === 1 ? 0.5 : i / (steps.length - 1)), Y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    let sv = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Actualización secuencial de P(${esc(hAbbr)})">`;
    for (let v = Math.ceil(lo * 50) / 50; v <= hi; v += 0.02) sv += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 5}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
    sv += `<line x1="${L}" x2="${W - R}" y1="${Y(0.5)}" y2="${Y(0.5)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/>`;
    sv += `<polyline points="${steps.map((s, i) => `${X(i)},${Y(s.pHome)}`).join(" ")}" fill="none" stroke="var(--home)" stroke-width="2"/>`;
    steps.forEach((s, i) => {
      const d = i ? 100 * (s.pHome - steps[i - 1].pHome) : null;
      sv += `<circle cx="${X(i)}" cy="${Y(s.pHome)}" r="5" fill="var(--home)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(s.label)}: ${pc(s.pHome, 1)} · μ ${f(s.muAway, 2)} – ${f(s.muHome, 2)}"/>`;
      sv += `<text class="lbl" x="${X(i)}" y="${Y(s.pHome) - 10}" text-anchor="middle">${pc(s.pHome, 1)}${d != null ? ` (${d >= 0 ? "+" : ""}${d.toFixed(1)})` : ""}</text>`;
      const words = s.label.replace(/^\+ /, "+ ").split(" ");
      const lines = [];
      words.forEach((w) => { if (!lines.length || (lines[lines.length - 1] + " " + w).length > 17) lines.push(w); else lines[lines.length - 1] += " " + w; });
      lines.slice(0, 3).forEach((ln, j) => { sv += `<text x="${X(i)}" y="${H - B + 16 + j * 12}" text-anchor="middle">${esc(ln)}</text>`; });
    });
    return sv + "</svg>";
  }

  function wpHeat(M, aAbbr, hAbbr) {
    const cw = 50, ch = 26, L = 82, T = 30, W = L + 9 * cw + 4, H = T + M.length * ch + 4;
    let sv = `<svg class="chart heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz de probabilidad de victoria en vivo" style="max-width:${W}px">`;
    for (let j = 0; j < 9; j++) sv += `<text x="${L + j * cw + cw / 2}" y="${T - 10}" text-anchor="middle" style="font-size:11px">${j + 1}ª</text>`;
    M.forEach((row, i) => {
      const diff = i - 5;
      sv += `<text x="${L - 6}" y="${T + i * ch + ch / 2 + 4}" text-anchor="end" style="font-size:11px">${diff === 0 ? "empate" : diff > 0 ? `${esc(hAbbr)} +${diff}` : `${esc(aAbbr)} +${-diff}`}</text>`;
      row.forEach((p, j) => {
        const side = p >= 0.5 ? "var(--home)" : "var(--away)";
        const a = Math.min(1, Math.abs(p - 0.5) * 2);
        sv += `<rect x="${L + j * cw}" y="${T + i * ch}" width="${cw - 2}" height="${ch - 2}" rx="3" style="fill: color-mix(in srgb, ${side} ${Math.round(8 + 72 * a)}%, var(--surface))" data-tip="Inicio de la ${j + 1}ª, ${diff === 0 ? "empatados" : diff > 0 ? `${esc(hAbbr)} arriba por ${diff}` : `${esc(aAbbr)} arriba por ${-diff}`}: P(${esc(hAbbr)}) ${pc(p, 1)}"/>`;
        sv += `<text class="v" x="${L + j * cw + cw / 2 - 1}" y="${T + i * ch + ch / 2 + 3}" text-anchor="middle" style="font-size:11.5px;${a > 0.6 ? "fill:#fff" : ""}">${Math.round(p * 100)}</text>`;
      });
    });
    return sv + "</svg>";
  }

  function viewPrisma(lab) {
    const g = lab.game, a = g.teams.away, h = g.teams.home, P = lab.prisma, F = P.fit, post = P.posterior, pred = P.predictive, cons = lab.consensus, V = lab.validation, res = lab.result;
    const frozen = new Date(lab.frozenAt), first = new Date(lab.firstPitch);
    const mins = Math.round((first - frozen) / 60000);
    const gmap = Object.fromEntries(((res && res.graded) || []).map((x) => [x.pick, x]));
    const top = (lab.topPicks || []).map((p, i) => pickCard(p, lab.pk, i + 1, gmap[p.pick])).join("");
    const mlKey = oddsKey(lab.pk, h.abbr);
    const mlOdds = parseOdds(oddsStore[mlKey]);
    const pAbove = mlOdds ? post.quantiles.filter((x) => x > mlOdds.imp).length / post.quantiles.length : null;
    const base = lab.base, lu = base.sections.s5.lineups;
    const passes = lab.passes || [];
    const luStatus = (x) => (Array.isArray(x) ? x[0] : x) || "—";
    const teamRow = (sd) => { const t = P.teams[sd], off = P.offsets[sd]; return tr([td(`<b style="color:var(--${sd})">${esc(t.abbr)}</b>`), tdn(`${signed(t.att, 3)} ± ${f(t.attSd, 3)}`), tdn(`${signed(t.def, 3)} ± ${f(t.defSd, 3)}`), tdn(signed(off.abridor, 3)), tdn(signed(off.mano, 3)), tdn(signed(off.lineup, 3)), tdn(signed(off.fatiga, 3)), tdn(f(sd === "away" ? post.muAway : post.muHome, 2))]); };
    const chosen = (x) => x.halfLife == null && x.prevW === F.prevWeight;
    app.innerHTML = `
      <a class="back" href="#prolab">← Pro-Lab: todos los modelos</a>
      <div class="lab-hero">
        <p class="eyebrow">Pro-Lab · prueba de modelo · ${esc(a.abbr)} @ ${esc(h.abbr)}</p>
        <span class="name">PRISMA</span>
        <p class="lede"><b>P</b>osterior de ca<b>R</b>reras con <b>R</b>egresión jerárquica, <b>I</b>ntegración por <b>S</b>imulación, <b>M</b>uestreo y <b>A</b>ctualización. En vez de dar un solo número, PRISMA estima la <b>distribución completa de la probabilidad</b>: cuánto vale cada equipo con su incertidumbre, qué tan seguro está el modelo de su propia estimación y cómo cambia en vivo. Partido: <b>${esc(a.name)} @ ${esc(h.name)}</b>, ${fmtDateLong(g.date)}, ${esc(g.venue.name)}.</p>
        <div class="notice"><span class="ic" style="background:var(--verde-soft);color:var(--verde)">✓</span><div><b>Sin fuga de información:</b> datos congelados el ${fmtStamp(lab.frozenAt)}, ${mins} minutos antes del primer lanzamiento (${fmtTime(lab.firstPitch)}). ${passes.length > 1 ? "Dos pasadas: mañana y tarde (con lineups y clima de última hora)." : Date.now() < first.getTime() ? "Pasada de la mañana; la de la tarde se agrega antes del primer lanzamiento." : "Una sola pasada, tomada con los lineups oficiales ya publicados (la de la tarde no se tomó a tiempo y no se congela nada después del primer lanzamiento)."}</div></div>
      </div>

      ${res ? `<section class="block"><h2>Resultado real contra el modelo</h2><div class="res">
        <div class="tile"><span class="eyebrow">Final</span><span class="big">${esc(a.abbr)} ${res.away} – ${res.home} ${esc(h.abbr)}</span><span class="sub">esperado ${f(post.muAway, 1)} – ${f(post.muHome, 1)}</span></div>
        <div class="tile"><span class="eyebrow">Ganador</span><span class="big">${esc(res.homeWon ? h.abbr : a.abbr)}</span><span class="sub">PRISMA daba ${pc(res.homeWon ? pred.pHome : 1 - pred.pHome, 1)} · Brier ${f(res.brier, 3)}</span></div>
        <div class="tile"><span class="eyebrow">Total</span><span class="big">${res.total}</span><span class="sub">percentil ${pc(res.percentileTotal)} de la predictiva</span></div>
        <div class="tile"><span class="eyebrow">Picks calificados</span><span class="big">${res.hits} ✓ · ${res.misses} ✗</span></div></div></section>` : ""}

      <section class="block"><h2>Los dos picks de mayor confianza</h2><div class="toppicks">${top}</div></section>

      <div class="tiles">
        <div class="tile"><span class="eyebrow">P(${esc(h.abbr)}) predictiva</span><span class="big">${pc(pred.pHome, 1)}</span><span class="sub">${pred.sims.toLocaleString("es-MX")} partidos simulados con incertidumbre de parámetros</span></div>
        <div class="tile"><span class="eyebrow">Intervalo creíble 90%</span><span class="big">${pc(post.q05, 1)} – ${pc(post.q95, 1)}</span><span class="sub">desviación posterior ${pc(post.sd, 1)} · ${post.draws.toLocaleString("es-MX")} muestras</span></div>
        <div class="tile"><span class="eyebrow">Carreras esperadas</span><span class="big">${f(post.muAway, 2)} – ${f(post.muHome, 2)}</span><span class="sub">total ${f(pred.meanTotal, 2)} ± ${f(pred.sdTotal, 2)}</span></div>
        <div class="tile"><span class="eyebrow">Consenso de 4 métodos</span><span class="big">${pc(cons.pHome, 1)}</span><span class="sub">divergencia ${pc(cons.spread, 1)}</span></div>
      </div>

      <div class="step"><span class="n">1</span><div><h2>Modelo jerárquico de ataque y defensa</h2>
        <p class="note">Cada juego de la temporada (y la anterior) aporta dos observaciones: las carreras que anota cada equipo. Se modelan con un GLM de Poisson con exposición (medias entradas bateadas) y efectos por equipo:</p>
        <div class="mathbox">log μ<sub>g</sub> = log(entradas<sub>g</sub>/9) + log PF<sub>estadio</sub> + α + h·local + ataque<sub>ofensiva</sub> − defensa<sub>rival</sub><br>ataque<sub>i</sub> ~ N(0, σ<sub>A</sub>²) · defensa<sub>j</sub> ~ N(0, σ<sub>D</sub>²) · σ por Bayes empírico (EM con Laplace)</div>
        <p class="note">Los priors normales hacen la <b>regresión a la media</b> (5.7.4) de forma óptima: un equipo con pocas entradas o resultados extremos se acerca al promedio en la medida exacta que indica la varianza real entre equipos. El MAP se obtiene con Newton-Raphson sobre ${F.nobs.toLocaleString("es-MX")} observaciones.</p>
        ${table(["Parámetro", "~Valor", "Lectura"], [
          tr([td("α (intercepto)"), tdn(f(F.alpha, 3)), td(`e<sup>α</sup>·9 ≈ ${f(Math.exp(F.alpha) * 9, 2)} carreras por 9 entradas para un equipo promedio`, "muted")]),
          tr([td("h (ventaja de local)"), tdn(f(F.home, 3)), td(`el local anota ×${f(Math.exp(F.home), 3)} por entrada`, "muted")]),
          tr([td("σ<sub>A</sub> · σ<sub>D</sub> (entre equipos)"), tdn(`${f(F.sigmaAtt, 3)} · ${f(F.sigmaDef, 3)}`), td("dispersión real del talento ofensivo y defensivo, estimada de los datos", "muted")]),
          tr([td("φ (Pearson / gl)"), tdn(f(F.phi, 2)), td("sobredispersión: las carreras varían más que un Poisson → fragilidad gamma", "muted")]),
          tr([td("Vida media · peso temporada anterior"), tdn(`${F.halfLife ?? "sin decaimiento"} · ${f(F.prevWeight, 2)}`), td("elegidos por validación fuera de muestra (paso 6)", "muted")])])}
        <h3 class="sub">Los 30 equipos: ataque contra defensa (barras = intervalo creíble 90%)</h3>
        <div class="tbl" style="padding:8px">${strengthScatter(P.strengths, a.abbr, h.abbr)}</div>
        ${table(["Equipo", "~Ataque", "~Defensa", "~Abridor", "~Mano", "~Lineup", "~Fatiga rival", "~Carreras esp."], [teamRow("away"), teamRow("home")])}
        <p class="note muted">Ajustes del día en escala log (se suman a log μ): abridor rival, split por mano, lineup confirmado y fatiga del bullpen rival, tomados del análisis del framework.</p>
      </div></div>

      <div class="step"><span class="n">2</span><div><h2>Posterior de Laplace e incertidumbre de la probabilidad</h2>
        <p class="note">Alrededor del MAP la posterior se aproxima con una normal multivariada: θ ~ N(θ̂, Σ), Σ = (−H)⁻¹ con H el hessiano de la log-posterior (${2 + 2 * 30} parámetros). Se factoriza Σ = L·Lᵀ (Cholesky) y se generan ${post.draws.toLocaleString("es-MX")} muestras θ = θ̂ + L·z, z ~ N(0, I). Cada muestra da un par (μ<sub>visita</sub>, μ<sub>local</sub>) y una P(local) con Binomial Negativa: el resultado es la <b>distribución de la probabilidad</b>, no un punto.</p>
        <div class="tbl" style="padding:8px">${posteriorDensity(post, mlOdds ? mlOdds.imp : null)}</div>
        <dl class="kv"><dt>Media · mediana</dt><dd class="num">${pc(post.mean, 1)} · ${pc(post.q50, 1)}</dd><dt>Cuartiles (25% – 75%)</dt><dd class="num">${pc(post.q25, 1)} – ${pc(post.q75, 1)}</dd><dt>Intervalo creíble 90%</dt><dd class="num">${pc(post.q05, 1)} – ${pc(post.q95, 1)}</dd>
          <dt>P(valor) = P(p real &gt; p implícita del momio)</dt><dd class="num">${pAbove != null ? `${pc(pAbove, 0)} con tu momio ${odds(mlOdds.am)} de ${esc(bookSel())}` : `escribe el momio de ${esc(h.abbr)} en el tablero`}</dd></dl>
        <p class="note muted">P(valor) es la incertidumbre de segundo orden: aunque la probabilidad media supere a la implícita, si buena parte de la posterior queda debajo, el edge no es confiable.</p>
      </div></div>

      <div class="step"><span class="n">3</span><div><h2>Actualización secuencial (5.7.6)</h2>
        <p class="note">La probabilidad se construye capa por capa: cada dato nuevo mueve el logit en lugar de rehacer el análisis. Así se ve qué información pesa de verdad.</p>
        <div class="tbl" style="padding:8px">${stepsChart(P.steps, h.abbr)}</div>
        ${table(["Capa", `~P(${esc(h.abbr)})`, "~Δ pp", "~logit", `~Carreras ${esc(a.abbr)}`, `~Carreras ${esc(h.abbr)}`], P.steps.map((s, i) => tr([td(esc(s.label)), tdn(pc(s.pHome, 1)), tdn(i ? signed(100 * (s.pHome - P.steps[i - 1].pHome), 1) : "—"), tdn(f(s.logit, 3)), tdn(f(s.muAway, 2)), tdn(f(s.muHome, 2))])))}
      </div></div>

      <div class="step"><span class="n">4</span><div><h2>Predictiva posterior con fragilidad</h2>
        <p class="note">Para simular el partido se integra sobre todo: parámetros (lognormal, de la posterior) × fragilidad gamma individual (varianza ${f(F.vInd, 3)}) × fragilidad compartida del partido (clima, umpire, contexto) × Poisson. La covarianza de residuos entre ambos equipos de un mismo juego dio ${f(F.vSharedRaw, 3)} (ρ = ${f(F.rhoRaw, 2)}): negativa, así que la fragilidad compartida se trunca en 0 y las carreras de ambos equipos se simulan independientes dado μ.</p>
        <div class="mathbox">carreras ~ Poisson(μ · G<sub>partido</sub> · G<sub>equipo</sub>) · G ~ Gamma(1/v, v) · μ ~ posterior · empate a 9 → extra innings con ${pc(P.xHome, 1)} para el local</div>
        <h3 class="sub">Carreras por equipo</h3>${groupedBars([{ name: a.abbr, color: "var(--away)", values: pred.runs.away.slice(0, 16) }, { name: h.abbr, color: "var(--home)", values: pred.runs.home.slice(0, 16) }], [...Array(16).keys()].map(String), { label: "Carreras por equipo" })}
        <h3 class="sub">Total de carreras (media ${f(pred.meanTotal, 2)}, desviación ${f(pred.sdTotal, 2)})</h3>${groupedBars([{ name: "Total", color: "var(--accent)", values: pred.total.slice(0, 22) }], [...Array(22).keys()].map(String), { marks: [{ at: 7.5, label: "7.5" }, { at: 8.5, label: "8.5" }, { at: 9.5, label: "9.5" }], label: "Total" })}
        <dl class="kv"><dt>F5: ${esc(a.abbr)} · empate · ${esc(h.abbr)}</dt><dd class="num">${pc(pred.f5.away, 1)} · ${pc(pred.f5.tie, 1)} · ${pc(pred.f5.home, 1)}</dd><dt>Over / Under 8.5</dt><dd class="num">${pc(pred.total.slice(9).reduce((x, y) => x + y, 0), 1)} / ${pc(pred.total.slice(0, 9).reduce((x, y) => x + y, 0), 1)}</dd></dl>
      </div></div>

      <div class="step"><span class="n">5</span><div><h2>Probabilidad de victoria en vivo: matriz entrada × marcador</h2>
        <p class="note">Programación dinámica sobre la distribución real de carreras por media entrada de la liga (${D.meta.season}), escalada a la media esperada de cada equipo: P(local gana) = Σ P(visita anota i en lo que falta) · P(local anota j) · 1[dif + j − i &gt; 0], con empates resueltos por la tasa de extra innings. Se lee: al empezar la entrada indicada, con esa ventaja, ¿qué tan probable es que gane ${esc(h.abbr)}? Esta misma matriz alimenta la pestaña <a href="#envivo">En vivo</a>.</p>
        <div class="tbl" style="padding:8px">${wpHeat(P.wpMatrix, a.abbr, h.abbr)}</div>
        <h3 class="sub">Carreras en una media entrada</h3>${groupedBars([{ name: "Liga", color: "var(--muted)", values: P.halfInning.league.slice(0, 7) }, { name: a.abbr, color: "var(--away)", values: P.halfInning.away.slice(0, 7) }, { name: h.abbr, color: "var(--home)", values: P.halfInning.home.slice(0, 7) }], ["0", "1", "2", "3", "4", "5", "6+"], { label: "Carreras por media entrada", h: 170 })}
      </div></div>

      <div class="step"><span class="n">6</span><div><h2>Validación fuera de muestra</h2>
        <p class="note">Antes de confiar en el modelo se re-ajustó con los datos hasta el ${fmtShort(V.cutoff)} y se predijeron los ${V.games} juegos siguientes, día por día y sin ver resultados futuros. También se probó una rejilla de hiperparámetros: el modelo que pesa más la forma reciente <b>predice peor</b>, así que PRISMA usa la temporada completa.</p>
        ${table(["Modelo", "~Log-loss", "~Brier"], [["PRISMA", "prisma"], ["Log5 (framework 5.7.2)", "log5"], ["Siempre el local", "local"]].map(([n, k]) => tr([td(`<b>${n}</b>`), tdn(f(V.logloss[k], 4)), tdn(f(V.brier[k], 4))], k === "prisma" ? "hl" : "")))}
        <p class="note muted">Menor es mejor. Log-loss de una moneda = 0.6931. Error absoluto medio del total: ${f(V.totalMae, 2)} carreras (sesgo ${signed(V.totalBias, 2)}). Ganarle a Log5 por poco es lo normal: el béisbol tiene mucho azar en un solo juego.</p>
        ${V.grid ? table(["Vida media (días)", "~Peso temp. anterior", "~Log-loss", "~Brier"], V.grid.map((x) => tr([td(x.halfLife == null ? "sin decaimiento" : String(x.halfLife)), tdn(f(x.prevW, 2)), tdn(f(x.logloss, 4)), tdn(f(x.brier, 4))], chosen(x) ? "hl" : ""))) : ""}
      </div></div>

      <div class="step"><span class="n">7</span><div><h2>Pasadas del día</h2>
        ${table(["Pasada", "Hora", `~P(${esc(h.abbr)})`, "~Intervalo 90%", "~Total", "Lineups", "Clima", "Umpire"], passes.map((x) => tr([td(`<b>${x.label === "manana" ? "Mañana" : "Tarde"}</b>`), td(fmtStamp(x.takenAt)), tdn(pc(x.pHome, 1)), tdn(`${pc(x.posterior.q05, 1)} – ${pc(x.posterior.q95, 1)}`), tdn(f(x.meanTotal, 2)),
          td(`${esc(a.abbr)} ${esc(luStatus(x.lineups.away))} · ${esc(h.abbr)} ${esc(luStatus(x.lineups.home))}`), td(x.weather ? `${esc(x.weather.condition || "")} ${esc(x.weather.temp ?? "")}°F · ${esc(x.weather.wind || x.weather.windText || "")}` : "—", "muted"), td(esc(x.umpire || "—"))])))}
        ${lab.changes && lab.changes.length ? `<ul class="clean">${lab.changes.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
      </div></div>

      <section class="block"><h2>Consenso de cuatro métodos</h2><div class="panel">
        ${[["Log5 (5.7.2)", cons.methods.log5], ["Elo + abridor (5.7.7)", cons.methods.elo], ["λ + Binomial Negativa (5.3 · 5.7.5)", cons.methods.lambda], ["PRISMA predictiva (5.7.4 · 5.7.6 · 5.7.9)", cons.methods.prisma]].map(([n, v]) => `<div class="mbar" style="grid-template-columns:minmax(0,260px) 1fr 52px"><span>${n}</span><span class="track"><i style="width:${(v * 100).toFixed(1)}%"></i></span><span class="num">${pc(v, 1)}</span></div>`).join("")}
        <p class="note">P(${esc(h.abbr)}) de consenso <b>${pc(cons.pHome, 1)}</b> · divergencia ${pc(cons.spread, 1)}.</p></div></section>

      <section class="block"><h2 class="bh">Alineaciones ${stPill(sectionStatus(base).lu)}</h2>
        <div class="lineups">${lineupCard(a.abbr, lu.away, base.summary.probables.home.name)}${lineupCard(h.abbr, lu.home, base.summary.probables.away.name)}</div></section>

      <section class="block"><h2>Todos los picks del partido por nivel de confianza</h2>${picksTable(lab.picks, lab.pk, res ? res.graded : null)}</section>
      <a class="callout-link btn" href="#lab${lab.pk}base">Ver el análisis completo del framework (10 secciones) para este partido →</a>
      ${footer()}`;
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- vista: en vivo
  const LV = D.live || { games: [] };
  let liveGames = (LV.games || []).slice();
  let liveInfo = { source: "corte", at: LV.asOf || D.meta.generatedAt, error: null };
  let liveTimer = null;
  const kCache = {};
  const meanOf = (d) => d.reduce((acc, v, k) => acc + k * v, 0);
  const isOff = (g) => /Postponed|Cancel|Suspended/i.test(g.detailed || "");

  function convJS(a, b, kmax = 40) {
    const out = new Array(Math.min(kmax + 1, a.length + b.length - 1)).fill(0);
    a.forEach((x, i) => { if (x < 1e-12) return; b.forEach((y, j) => { if (i + j < out.length) out[i + j] += x * y; }); });
    return out;
  }

  // carreras que faltan en la media entrada en curso: P(0) = 1 − P(≥1) y geométrica con la media de RE24
  function curHalf(bases, outs, ratio) {
    if (!LV.re24 || !LV.p1) return [1];
    const p1 = 1 - Math.pow(1 - LV.p1[bases][outs], ratio);
    const m = Math.max(1.0001, (LV.re24[bases][outs] * ratio) / Math.max(p1, 1e-6));
    const q = 1 - 1 / m;
    const out = [1 - p1];
    for (let k = 1; k <= 20; k++) out.push(p1 * (1 - q) * Math.pow(q, k - 1));
    return out;
  }

  function remDist(g, side, upto) {
    const lg = LV.halfLeague || [1];
    const half = (side === "away" ? g.halfAway : g.halfHome) || lg;
    const ratio = meanOf(half) / Math.max(1e-6, meanOf(lg));
    const pre = g.state === "Preview" || g.inning == null;
    const i = pre ? 1 : g.inning, st = pre ? "Pre" : g.inningState || "Top";
    let partial = false, full;
    if (st === "Pre") full = upto;
    else if (side === "away") { partial = st === "Top" && i <= upto && (g.outs ?? 0) < 3; full = Math.max(0, upto - i); }
    else if (st === "Top" || st === "Middle") full = i <= upto ? upto - i + 1 : 0;
    else { partial = st === "Bottom" && i <= upto && (g.outs ?? 0) < 3; full = Math.max(0, upto - i); }
    let d = partial ? curHalf(g.bases || 0, Math.min(2, g.outs || 0), ratio) : [1];
    for (let k = 0; k < full; k++) d = convJS(d, half);
    return d;
  }

  const periodOf = (fam) => (fam === "F5" || fam === "F5 total" ? 5 : fam === "NRFI" ? 1 : 9);
  function periodScore(g, upto) {
    if (upto >= 9) return [g.ar || 0, g.hr || 0];
    const inn = (g.inn || []).slice(0, upto);
    return [inn.reduce((s, x) => s + (x[0] || 0), 0), inn.reduce((s, x) => s + (x[1] || 0), 0)];
  }

  // resultado de un pick si el periodo terminara con (a, h): 1 gana · 0 pierde · "p" push · fracción en empate de ML
  function outcomeFn(p, aA, hA) {
    const over = p.pick.includes("Over");
    const cmp = (v) => (v === p.line ? "p" : (v > p.line) === over ? 1 : 0);
    const xh = LV.xHome ?? 0.5;
    switch (p.family) {
      case "ML": { const home = p.pick === hA; return (a, h) => (h > a ? (home ? 1 : 0) : a > h ? (home ? 0 : 1) : home ? xh : 1 - xh); }
      case "RL": { const i = p.pick.lastIndexOf(" "), team = p.pick.slice(0, i), line = Number(p.pick.slice(i + 1)); return (a, h) => ((team === hA ? h - a : a - h) + line > 0 ? 1 : 0); }
      case "Total": case "F5 total": return (a, h) => cmp(a + h);
      case "Team total": { const away = p.pick.startsWith(aA + " "); return (a, h) => cmp(away ? a : h); }
      case "F5": { const home = p.pick.startsWith(hA + " "); return (a, h) => (a === h ? "p" : (h > a) === home ? 1 : 0); }
      case "NRFI": return (a, h) => ((p.pick === "NRFI" ? a + h === 0 : a + h > 0) ? 1 : 0);
    }
    return null;
  }

  function pickProb(p, g) {
    const out = outcomeFn(p, g.awayAbbr, g.homeAbbr);
    if (!out) return null;
    const upto = periodOf(p.family) === 9 ? Math.max(9, g.inning || 9) : periodOf(p.family);
    const cur = periodScore(g, upto);
    const fin = g.state === "Final";
    const RA = fin ? [1] : remDist(g, "away", upto), RH = fin ? [1] : remDist(g, "home", upto);
    let w = 0, l = 0, pu = 0;
    RA.forEach((pa, i) => { if (pa < 1e-10) return; RH.forEach((ph, j) => { if (ph < 1e-10) return; const o = out(cur[0] + i, cur[1] + j), m = pa * ph; if (o === "p") pu += m; else { w += m * o; l += m * (1 - o); } }); });
    const t = w + l + pu || 1;
    return { w: w / t, l: l / t, push: pu / t, now: out(cur[0], cur[1]) };
  }

  function kName(p) { return p.pick.split(" Over ")[0].split(" Under ")[0]; }

  function pickNow(p, g) {
    if (isOff(g)) return { cls: "pend", text: "Pospuesto" };
    if (g.state === "Preview" || g.ar == null) return { cls: "pend", text: `Por jugar · ${pc(p.p)}` };
    if (p.family === "K") {
      const k = (kCache[g.pk] || {})[kName(p)];
      const over = p.pick.includes("Over");
      if (g.state === "Final") {
        const won = p.won ?? (k != null ? (k === p.line ? null : (k > p.line) === over) : null);
        return won === true ? { cls: "win", text: `✓ Ganó${k != null ? ` · ${k} K` : ""}` } : won === false ? { cls: "lose", text: `✗ Perdió${k != null ? ` · ${k} K` : ""}` } : { cls: "pend", text: k != null ? "Push" : "Sin dato de ponches" };
      }
      if (k != null && k > p.line) return over ? { cls: "win", text: `✓ Asegurado · ${k} K` } : { cls: "lose", text: `✗ Perdido · ${k} K` };
      return { cls: "pend", text: k != null ? `${k} K hasta ahora` : "En curso" };
    }
    const r = pickProb(p, g);
    if (!r) return { cls: "pend", text: "—" };
    if (g.state === "Final") {
      const won = p.won ?? (r.w > 0.999 ? true : r.l > 0.999 ? false : null);
      return won === true ? { cls: "win", text: "✓ Ganó" } : won === false ? { cls: "lose", text: "✗ Perdió" } : { cls: "pend", text: "Push" };
    }
    if (r.w > 0.9995) return { cls: "win", text: "✓ Asegurado" };
    if (r.l > 0.9995) return { cls: "lose", text: "✗ Perdido" };
    if (r.push > 0.9995) return { cls: "pend", text: "Push" };
    const now = r.now === "p" ? null : r.now;
    return { cls: now === 1 ? "lead" : now === 0 ? "trail" : "pend", text: `${now === 1 ? "Va ganando" : now === 0 ? "Va perdiendo" : "Parejo"} · ${pc(r.w)} ahora` };
  }

  const diamond = (b) => `<svg viewBox="0 0 40 30" width="40" height="30" aria-label="Bases ocupadas: ${[b & 1 ? "1ª" : "", b & 2 ? "2ª" : "", b & 4 ? "3ª" : ""].filter(Boolean).join(", ") || "ninguna"}">${[[30, 16, 1], [20, 6, 2], [10, 16, 4]].map(([x, y, m]) => `<rect x="${x - 5.5}" y="${y - 5.5}" width="11" height="11" transform="rotate(45 ${x} ${y})" fill="${b & m ? "var(--amarillo)" : "none"}" stroke="var(--ink-2)" stroke-width="1.5"/>`).join("")}<rect x="16.5" y="22.5" width="7" height="7" transform="rotate(45 20 26)" fill="var(--surface-2)" stroke="var(--muted)"/></svg>`;

  function liveCard(g) {
    const pre = g.pred, aA = g.awayAbbr, hA = g.homeAbbr;
    const live = g.state === "Live", fin = g.state === "Final", off = isOff(g);
    const inn = g.inningState === "Top" ? "▲" : g.inningState === "Bottom" ? "▼" : g.inningState === "Middle" ? "mitad" : g.inningState === "End" ? "fin" : "";
    const hd = off ? `<span class="tag warn">Pospuesto</span>` : live ? `<span class="live-dot">En vivo · ${g.inning}ª ${inn}</span>` : fin ? `<b>Final${g.inning > 9 ? ` (${g.inning})` : ""}</b>` : `<span>${fmtTime(g.time)}${g.detailed && g.detailed !== "Scheduled" ? ` · ${esc(g.detailed === "Pre-Game" ? "Previa" : g.detailed === "Warmup" ? "Calentamiento" : g.detailed)}` : ""}</span>`;
    const hasScore = (live || fin) && !off && g.ar != null;
    const lead = (x, y) => (x > y ? "lead" : x < y ? "trail" : "");
    const wp = hasScore ? pickProb({ family: "ML", pick: hA }, g) : null;
    const pH = wp ? wp.w : pre ? pre.pHome : null;
    const nInn = Math.max(9, (g.inn || []).length);
    const ls = hasScore ? `<div class="tbl"><table class="linescore mini"><thead><tr><th></th>${[...Array(nInn).keys()].map((i) => `<th>${i + 1}</th>`).join("")}<th>R</th></tr></thead><tbody>${["away", "home"].map((sd, k) => `<tr><td class="team-cell">${esc(sd === "away" ? aA : hA)}</td>${[...Array(nInn).keys()].map((i) => { const v = ((g.inn || [])[i] || [])[k]; return `<td class="num">${v ?? ""}</td>`; }).join("")}<td class="num tot">${sd === "away" ? g.ar : g.hr}</td></tr>`).join("")}</tbody></table></div>` : "";
    const link = LAB_BY_PK[String(g.pk)] ? `#lab${g.pk}` : BY_PK[String(g.pk)] ? `#g${g.pk}` : null;
    const picks = pre && pre.picks && pre.picks.length ? pre.picks.map((p) => { const s = pickNow(p, g); return `<div class="p2">${icBadge(p)}<span class="t"><b>${esc(p.pick)}</b> <span class="muted">${esc(p.market)} · ${pc(p.p)}</span></span><span class="res-chip ${s.cls}">${esc(s.text)}</span></div>`; }).join("")
      : `<span class="muted" style="font-size:13px">Sin predicción guardada para este partido${g.date < D.meta.today ? " (el seguimiento arrancó el 23 de septiembre)" : ""}.</span>`;
    return `<article class="live-card${live ? " is-live" : ""}">
      <div class="hd">${hd}<span>${esc(g.venue || "")}</span></div>
      <div class="score">
        <span class="tm"><i class="abbr-mark away-mark"></i>${esc(aA)}${pre && pre.probables ? ` <small class="muted">${esc(pre.probables.away || "")}</small>` : ""}</span><span class="r ${hasScore ? lead(g.ar, g.hr) : ""}">${hasScore ? g.ar : ""}</span>
        <span class="tm"><i class="abbr-mark home-mark"></i>${esc(hA)}${pre && pre.probables ? ` <small class="muted">${esc(pre.probables.home || "")}</small>` : ""}</span><span class="r ${hasScore ? lead(g.hr, g.ar) : ""}">${hasScore ? g.hr : ""}</span>
      </div>
      ${live ? `<div class="sit">${diamond(g.bases || 0)}<span class="outs" aria-label="${g.outs ?? 0} outs">${[0, 1, 2].map((i) => `<i class="${i < (g.outs || 0) ? "on" : ""}"></i>`).join("")}</span><span>${g.outs ?? 0} out${g.outs === 1 ? "" : "s"}</span></div>` : ""}
      ${ls}
      ${isNum(pH) && !off ? `<div class="wpbar"><span>${pc(1 - pH)}</span><div class="splitbar" role="img" aria-label="Probabilidad de victoria: ${esc(aA)} ${pc(1 - pH)}, ${esc(hA)} ${pc(pH)}"><span style="width:${((1 - pH) * 100).toFixed(1)}%"></span><span style="width:${(pH * 100).toFixed(1)}%"></span></div><span style="text-align:right">${pc(pH)}</span></div>
        <p class="muted" style="font-size:12px">${live ? `Probabilidad en vivo (situación + distribución por media entrada)${pre ? ` · antes del juego ${esc(hA)} ${pc(pre.pHome)}` : ""}` : fin ? `Antes del juego: ${esc(hA)} ${pc(pre ? pre.pHome : null)} · proyección ${f(pre && pre.projAway, 1)}–${f(pre && pre.projHome, 1)}` : `Probabilidad previa · proyección ${f(pre && pre.projAway, 1)}–${f(pre && pre.projHome, 1)} · total ${f(pre && pre.total, 1)}`}</p>` : ""}
      <div class="pk-live"><span class="eyebrow" style="font-size:12px">Los 2 picks principales${pre && pre.model ? ` · modelo ${esc(pre.model)}` : ""}</span>${picks}</div>
      ${link ? `<a href="${link}" style="font-size:13px;font-weight:600">${LAB_BY_PK[String(g.pk)] ? "Ver el modelo del Pro-Lab →" : "Ver el análisis completo →"}</a>` : ""}
    </article>`;
  }

  function viewLive() {
    const today = D.meta.today;
    const withPred = (g) => g.date === today || (g.pred && g.pred.picks && g.pred.picks.length);
    const gs = liveGames.filter(withPred);
    const liveNow = gs.filter((g) => g.state === "Live" && !isOff(g));
    const offList = gs.filter(isOff);
    const done = gs.filter((g) => g.state === "Final" && !isOff(g)).sort((x, y) => (y.date + y.time).localeCompare(x.date + x.time));
    const next = gs.filter((g) => g.state === "Preview" && !isOff(g)).sort((x, y) => (x.time || "").localeCompare(y.time || ""));
    const allPicks = [...liveNow, ...done].flatMap((g) => ((g.pred && g.pred.picks) || []).map((p) => pickNow(p, g)));
    const won = allPicks.filter((x) => x.cls === "win").length, lost = allPicks.filter((x) => x.cls === "lose").length;
    const provisional = allPicks.filter((x) => x.cls === "lead" || x.cls === "trail" || x.cls === "pend").length;
    const src = liveInfo.source === "api" ? `En vivo desde statsapi.mlb.com · actualizado ${new Date(liveInfo.at).toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit", second: "2-digit" })} · se refresca cada minuto`
      : `Marcador del último corte de datos (${fmtStamp(liveInfo.at)})${liveInfo.error ? " · el navegador no pudo consultar statsapi.mlb.com desde aquí, así que se actualiza con cada corrida del workflow" : " · consultando statsapi.mlb.com…"}`;
    const group = (title, list, empty) => `<section class="block"><h2>${title} <small class="muted" style="font-family:var(--sans);font-size:14px;font-weight:400">${list.length}</small></h2>${list.length ? `<div class="live-grid">${list.map(liveCard).join("")}</div>` : `<div class="empty">${empty}</div>`}</section>`;
    app.innerHTML = `<div class="page-head"><p class="eyebrow">En vivo · ${fmtDateLong(today)}</p><h1>Partidos en juego, terminados y por jugar, con sus dos picks</h1>
      <p class="lede">Cada partido muestra los dos picks de mayor confianza que el modelo guardó <b>antes</b> del primer lanzamiento. En vivo se recalcula la probabilidad de cada pick con la situación real (entrada, outs, corredores) y la distribución de carreras por media entrada; al terminar se califica con el resultado oficial.</p>
      <p class="fresh"><span class="dot ${liveInfo.source === "api" ? "ok" : "part"}" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${src}</p></div>
      <div class="tiles t4">
        <div class="tile"><span class="eyebrow">En juego</span><span class="big">${liveNow.length}</span><span class="sub">${done.length} terminados · ${next.length} por jugar</span></div>
        <div class="tile"><span class="eyebrow">Picks ganados</span><span class="big" style="color:var(--verde)">${won}</span><span class="sub">calificados o ya asegurados</span></div>
        <div class="tile"><span class="eyebrow">Picks perdidos</span><span class="big" style="color:var(--rojo)">${lost}</span><span class="sub">${provisional} todavía en juego o sin dato</span></div>
        <div class="tile"><span class="eyebrow">Acierto hasta ahora</span><span class="big">${won + lost ? pc(won / (won + lost)) : "—"}</span><span class="sub">solo picks ya decididos</span></div>
      </div>
      ${group("En juego", liveNow, "No hay partidos en juego en este momento.")}
      ${group("Terminados", done, "Todavía no termina ningún partido de hoy.")}
      ${group("Por jugar", next, "No quedan partidos por jugar hoy.")}
      ${offList.length ? group("Pospuestos", offList, "") : ""}
      <p class="note muted">Probabilidad en vivo: P(gana el local) = Σ P(la visita anota i en lo que falta) · P(el local anota j) · 1[dif + j − i &gt; 0]. La media entrada en curso usa la matriz RE24 y P(≥1 carrera) de la liga según corredores y outs; las siguientes, la distribución empírica de carreras por media entrada escalada a la proyección de cada equipo. Push = línea exacta (se devuelve la apuesta).</p>
      ${footer()}`;
  }

  // marcador directo desde el navegador (funciona donde la política del sitio lo permite, p. ej. GitHub Pages)
  async function pullLive() {
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = setTimeout(() => ctl && ctl.abort(), 8000);
    try {
      const r = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${D.meta.today}&hydrate=linescore,team`, { signal: ctl ? ctl.signal : undefined });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const js = await r.json();
      const byPk = Object.fromEntries(liveGames.map((g) => [g.pk, g]));
      (js.dates || []).forEach((d) => d.games.forEach((x) => {
        const ls = x.linescore || {}, off = ls.offense || {}, t = x.teams;
        const row = byPk[x.gamePk] || { pk: x.gamePk, date: x.officialDate, time: x.gameDate, awayAbbr: t.away.team.abbreviation, homeAbbr: t.home.team.abbreviation, venue: (x.venue || {}).name };
        Object.assign(row, { state: x.status.abstractGameState, detailed: x.status.detailedState, ar: t.away.score, hr: t.home.score, inning: ls.currentInning, top: ls.isTopInning, inningState: ls.inningState, outs: ls.outs,
          bases: (off.first ? 1 : 0) | (off.second ? 2 : 0) | (off.third ? 4 : 0), inn: (ls.innings || []).map((i) => [(i.away || {}).runs ?? null, (i.home || {}).runs ?? null]) });
        if (!byPk[x.gamePk]) liveGames.push(row);
      }));
      await Promise.all(liveGames.filter((g) => (g.state === "Live" || g.state === "Final") && g.date === D.meta.today && g.pred && g.pred.picks.some((p) => p.family === "K")).map(async (g) => {
        try {
          const b = await (await fetch(`https://statsapi.mlb.com/api/v1/game/${g.pk}/boxscore`)).json();
          const ks = {};
          ["away", "home"].forEach((sd) => { const tm = b.teams[sd], id = (tm.pitchers || [])[0], pl = id && tm.players["ID" + id]; if (pl) ks[pl.person.fullName] = pl.stats.pitching.strikeOuts; });
          kCache[g.pk] = ks;
        } catch { /* sin box score */ }
      }));
      liveInfo = { source: "api", at: new Date().toISOString(), error: null };
    } catch (e) {
      liveInfo = { ...liveInfo, error: String(e) };
    } finally {
      clearTimeout(timer);
    }
    if ((location.hash || "").slice(1) === "envivo") viewLive();
    markLiveTab();
  }

  function markLiveTab() {
    const a = document.querySelector('nav.tabs a[data-tab="envivo"]');
    if (!a) return;
    const n = liveGames.filter((g) => g.state === "Live").length;
    a.innerHTML = n ? `<span class="live-dot">En vivo</span>` : "En vivo";
    a.setAttribute("aria-label", n ? `En vivo, ${n} partido${n === 1 ? "" : "s"} en juego` : "En vivo");
  }

  function startLive() {
    if (liveTimer) return;
    pullLive();
    liveTimer = setInterval(() => { if (!document.hidden) pullLive(); }, 60000);
  }
  function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

  // ---------------------------------------------------------------- vista: cotejo de datos
  function viewChecks() {
    const c = D.checks || { checks: [], counts: {} };
    app.innerHTML = `<div class="page-head"><p class="eyebrow">Calidad de datos</p><h1>Cotejo: cada fuente contra otra</h1>
      <p class="lede">Antes de usar un dato se verifica contra una fuente independiente (standings contra resultados, temporada contra game logs, MLB Stats API contra Baseball Savant, lineups contra roster). ${esc(Object.entries(c.counts).map(([k, v]) => `${v} ${k}`).join(" · "))}.</p></div>
      ${table(["Chequeo", "Estado", "Detalle", "Fuentes"], c.checks.map((x) => tr([td(`<b>${esc(x.title)}</b>${x.bad.length ? `<details><summary class="muted" style="cursor:pointer">${x.bad.length} caso(s)</summary><ul class="clean">${x.bad.slice(0, 30).map((b) => `<li>${esc(b)}</li>`).join("")}</ul></details>` : ""}`), td(status(x.status)), td(esc(x.detail), "muted"), td(esc(x.source), "muted")])))}
      <section class="block"><h2>Correcciones que salieron del cotejo</h2><ul class="clean panel">
        <li><b>Juego duplicado en el calendario oficial</b> (SF 7–ATL 2, gamePk 824912, listado dos veces por una reanudación): inflaba el récord, el Elo y el H2H de ATL y SF. Ahora se deduplica por gamePk.</li>
        <li><b>La API de stats por equipo devolvía solo 50 filas</b>: 15 equipos se quedaban sin split de abridores/relevistas o sin splits por mano (bullpen vacío). Ahora se pide <code>limit=100</code> y el cotejo verifica los 30.</li>
        <li><b>Estadio sin park factor en Savant</b> (Sutter Health Park): se calcula uno propio con dos temporadas (carreras en casa ÷ carreras de visita, regresado).</li>
      </ul></section>${footer()}`;
  }

  // ---------------------------------------------------------------- vista: posiciones
  function viewStandings() {
    const rows = D.standings || [];
    const divs = [...new Set(rows.map((r) => r.division))];
    app.innerHTML = `<div class="page-head"><p class="eyebrow">Temporada ${D.meta.season}</p><h1>Posiciones con Pitágoras, Elo y bullpen</h1>
      <p class="lede">El win% «verdadero» regresa el Pitagórico hacia la temporada anterior (k = 70 juegos). «Suerte» = win% real − Pitagórico: valores altos suelen regresar.</p></div>
      ${divs.map((d) => `<section class="block"><h2>${esc(d)}</h2>${table(["Equipo", "~W-L", "~JD", "~RS", "~RA", "~Pitagórico", "~Win% verdadero", "~Suerte", "~Elo", "~Ofensiva", "~Bullpen (rank)"],
        rows.filter((r) => r.division === d).map((r) => tr([td(`<b>${esc(r.abbr)}</b> <span class="muted">${esc(r.name)}</span>${r.clinch ? ` <span class="tag ok">${esc(r.clinch)}</span>` : ""}`), tdn(`${r.w}-${r.l}`), tdn(r.gb), tdn(r.rs), tdn(r.ra), tdn(pc(r.pyth, 1)), tdn(pc(r.true, 1)), tdn(signed(100 * r.luck, 1)), tdn(Math.round(r.elo)), tdn(f(r.off, 3)), tdn(`${f(r.bpEra)} (${r.bpRank})`)])))}</section>`).join("")}
      ${footer()}`;
  }

  // ---------------------------------------------------------------- vista: seguimiento
  function viewTrack() {
    const t = D.track || { n: 0 };
    const head = `<div class="page-head"><p class="eyebrow">Control de calidad</p><h1>¿Qué tan bien predice el modelo?</h1>
      <p class="lede">Cada corrida guarda la última predicción antes del primer lanzamiento (<code>data/predictions/</code>). Cuando el juego termina se compara contra el resultado oficial: acierto, Brier, log-loss y error del total.</p></div>`;
    if (!t.n) { app.innerHTML = head + `<div class="empty">Todavía no hay partidos terminados con predicción guardada. El seguimiento arranca con los partidos de hoy y se llena solo en cada actualización.</div>` + footer(); return; }
    app.innerHTML = head + `<div class="tiles">
        <div class="tile"><span class="eyebrow">Partidos evaluados</span><span class="big">${t.n}</span></div>
        <div class="tile"><span class="eyebrow">Acierto de ganador</span><span class="big">${pc(t.accuracy, 1)}</span><span class="sub">favorito del modelo</span></div>
        <div class="tile"><span class="eyebrow">Brier / log-loss</span><span class="big">${f(t.brier, 3)}</span><span class="sub">log-loss ${f(t.logloss, 3)} (0.693 = moneda)</span></div>
        <div class="tile"><span class="eyebrow">Error del total</span><span class="big">${f(t.totalMae, 2)}</span><span class="sub">MAE en carreras · sesgo ${signed(t.totalBias, 2)}</span></div>
      </div>
      ${table(["Método", "~Brier"], Object.entries(t.brierMethods).map(([k, v]) => tr([td(esc({ log5: "Log5", elo: "Elo + abridor", lambda: "Modelo λ" }[k])), tdn(f(v, 4))])))}
      ${table(["Rango de confianza", "~Partidos", "~Prob. media", "~Acierto real"], t.calibration.map((b) => tr([td(esc(b.range)), tdn(b.n), tdn(pc(b.pred, 1)), tdn(pc(b.hit, 1))])))}
      ${t.picks && t.picks.n ? `<section class="block"><h2>Picks principales: ¿el índice de confianza acierta?</h2>
        <p class="note">Los dos picks de mayor confianza de cada partido, calificados con el resultado oficial. Si el índice funciona, los niveles altos deben acertar más.</p>
        ${table(["Nivel de confianza", "~Picks", "~Prob. media del modelo", "~Acierto real"], t.picks.byLevel.map((b) => tr([td(`<span class="ic ${lvlCls(b.level)}">${esc(b.level)}</span>`), tdn(b.n), tdn(pc(b.pred, 1)), tdn(pc(b.hit, 1))])))}
        ${table(["Fecha", "Partido", "Pick", "~Prob.", "Confianza", "Resultado"], t.picks.rows.slice(0, 40).map((r) => tr([td(fmtShort(r.date), "num"), td(esc(r.game)), td(esc(r.pick)), tdn(pc(r.p, 1)), td(`<span class="ic ${lvlCls(r.level)}">IC ${Math.round(r.ic)}</span>`), td(r.won ? '<span class="won">✓</span>' : r.won === false ? '<span class="lost">✗</span>' : "push", "c")])))}</section>` : ""}
      <section class="block"><h2>Últimos partidos evaluados</h2>${table(["Fecha", "Partido", "~P(local)", "~Proyección", "~Final", "~Total", "NRFI", "Semáforo"],
        t.rows.map((r) => tr([td(fmtShort(r.date), "num"), td(`${esc(r.away)} @ ${esc(r.home)}`), tdn(pc(r.pHome)), tdn(`${f(r.projAway, 1)}-${f(r.projHome, 1)}`),
          td(`${r.ar}-${r.hr}`, `num r ${(r.pHome >= 0.5) === r.homeWon ? "w" : "l"}`), tdn(`${f(r.total, 1)} / ${r.actualTotal}`), td(r.nrfiHit ? "Sí" : "No"), td(light(r.light))])))}</section>` + footer();
  }

  // ---------------------------------------------------------------- vista: metodología
  function viewMethod() {
    const L = D.league;
    app.innerHTML = `<div class="page-head"><p class="eyebrow">Cómo se calcula</p><h1>Metodología y fuentes</h1>
      <p class="lede">MLBgs implementa el Framework MLB Picks v2 de punta a punta con datos oficiales. Todo se recalcula en cada actualización (varias veces al día) desde cero.</p></div>
      <section class="block"><h2>Constantes de la liga medidas hoy</h2>
      <dl class="kv panel"><dt>ERA de liga · RA9</dt><dd class="num">${f(L.era)} · ${f(L.ra9)}</dd><dt>Constante FIP</dt><dd class="num">${f(L.cFip, 3)}</dd>
        <dt>Carreras por juego visitante · local</dt><dd class="num">${f(L.rpg.away)} · ${f(L.rpg.home)}</dd><dt>Var/Media de carreras (sobredispersión)</dt><dd class="num">${f(L.varRatio, 3)}</dd>
        <dt>Win% del local</dt><dd class="num">${pc(L.homeWin, 1)}</dd><dt>Juegos a extra innings · win% local en extras</dt><dd class="num">${pc(L.extraShare, 1)} · ${pc(L.extraHomeWin, 1)}</dd>
        <dt>Primeras medias entradas sin carrera</dt><dd class="num">${pc(L.pScoreless1, 1)}</dd><dt>K% · BB% de liga</dt><dd class="num">${pc(L.kRate, 1)} · ${pc(L.bbRate, 1)}</dd>
        <dt>Juegos de la temporada usados</dt><dd class="num">${L.games}</dd></dl></section>
      <section class="block"><h2>Fuentes</h2>${table(["Dato", "Fuente", "Uso"], [
        ["Calendario, abridores probables, lineups, umpires, clima", "MLB Stats API · /schedule", "Secciones 1, 3, 6"],
        ["Resultados y linescore por entrada (2 temporadas)", "MLB Stats API · /schedule?hydrate=linescore", "Secciones 2, 5, 6 · Elo, Pitágoras, NRFI"],
        ["Standings y splits casa/visita", "MLB Stats API · /standings", "Sección 2"],
        ["Stats de abridores (temporada, game logs, splits)", "MLB Stats API · /people", "Sección 3"],
        ["Bullpen (split relevistas) y ofensiva vs mano", "MLB Stats API · /teams/stats", "Secciones 4, 5"],
        ["Uso de relevistas últimos 7 días", "MLB Stats API · /game/{pk}/boxscore", "Sección 4 (fatiga)"],
        ["xERA, xwOBA, Barrel%, Hard Hit%", "Baseball Savant · leaderboards", "Secciones 3, 5"],
        ["Park factors (índice 3 años)", "Baseball Savant · statcast-park-factors", "Secciones 5, 6"],
        ["Momios de varias casas (opcional)", "The Odds API · ODDS_API_KEY", "Sección 7"],
        ["Tendencias de umpires, SIERA, props de bateadores", "No conectadas", "Marcadas como faltantes/sustituidas"]].map((r) => tr(r.map((c) => td(esc(c))))))}</section>
      <section class="block"><h2>Decisiones de modelado</h2><ul class="clean panel">
        <li>Regresión a la media con los puntos de estabilización del framework (K% 70 BF, BB% 170 BF, HR ≈1150 BF) y la temporada anterior al 50%.</li>
        <li>ERA estimada del abridor = 0.45·FIP regresado + 0.35·xERA regresada + 0.20·ERA regresada.</li>
        <li>Carreras por media entrada con la distribución real de la liga por entrada; el abridor cubre cada entrada según sus IP esperadas y el resto lo cubre el bullpen (con su fatiga).</li>
        <li>Ajustes de la tabla 5.3: se evalúan todos; se aplican solo los que traen información nueva (viento, HR/9 + parque + contacto). Los que ya están en λ base (K-BB%, K% rival, bullpens, parque) se muestran pero no se duplican. Nunca se sube el total por un solo factor.</li>
        <li>Juego completo con Binomial Negativa (Var/Media medida); F3/F5 con Poisson; NRFI calibrado con la frecuencia real de ceros.</li>
        <li>Probabilidad de victoria triangulada: Log5 (Pitágoras regresado + ventaja de local medida), Elo (K=4, local +24, ajuste por abridor) y modelo λ.</li>
        <li>Semáforo: Verde solo con Modelo + Guion + Cuota con edge ≥ 3 pp y baja contradicción, y nunca con un campo obligatorio faltante.</li>
      </ul></section>
      ${footer()}`;
  }

  // ---------------------------------------------------------------- router
  function route() {
    const h = (location.hash || "#partidos").slice(1);
    let tab = "partidos";
    if (h.startsWith("g") && BY_PK[h.slice(1)]) viewGame(BY_PK[h.slice(1)]);
    else if (h === "prolab") { tab = "prolab"; viewProLabList(); }
    else if (h === "prolabbase" && LABS.length) { tab = "prolab"; viewLab(LABS.find((l) => labKey(l) === "diamante") || LABS[0], true); }
    else if (/^lab\d+(base)?$/.test(h) && LAB_BY_PK[h.match(/\d+/)[0]]) { tab = "prolab"; viewLab(LAB_BY_PK[h.match(/\d+/)[0]], h.endsWith("base")); }
    else if (h === "envivo") { tab = h; viewLive(); startLive(); }
    else if (h === "cotejo") { tab = h; viewChecks(); }
    else if (h === "posiciones") { tab = h; viewStandings(); }
    else if (h === "seguimiento") { tab = h; viewTrack(); }
    else if (h === "metodologia") { tab = h; viewMethod(); }
    else viewGames();
    if (h !== "envivo") stopLive();
    if (!h.startsWith("g") && !/^lab\d+base$/.test(h)) CURRENT_GAME = null;
    document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
    tip.hidden = true;
  }
  window.addEventListener("hashchange", () => { route(); if (!location.hash.startsWith("#g")) window.scrollTo(0, 0); });
  markLiveTab();
  route();
})();
</script>
